<!DOCTYPE html>
<html lang="en">
<meta charset="utf-8">
<title>Gridiron Desk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap">
<style>
:root{
  /* Type and palette follow FantasyPros': Poppins throughout, near-black ink,
     a navy chrome, one saturated blue for "this is the thing", cool greys. */
  --font:"Poppins",system-ui,-apple-system,"Segoe UI",sans-serif;
  --ground:#F3F5F9; --surface:#FFFFFF; --surface-2:#EEF1F6; --line:#E2E7EE; --line-strong:#CBD3DE;
  --ink:#16191D; --ink-2:#4A5361; --muted:#6B7686;
  --market:#9A6410; --market-soft:#F7EBD3;
  --consensus:#0769DE; --consensus-soft:#E4EEFC;
  --good:#127A52; --good-soft:#DAF0E6; --warn:#96600B; --bad:#B5382E; --bad-soft:#F9E2DF;
  --gold:#FACD39;
  --shadow:0 1px 2px rgba(8,29,63,.06),0 4px 14px rgba(8,29,63,.06);
  /* the two rails: a dark chrome, unchanged by the light/dark page theme */
  --rail-bg:#081D3F; --rail-bg-2:#0B2650; --rail-ink:#B9C6DC; --rail-ink-hi:#FFFFFF; --rail-line:rgba(255,255,255,.10);
  --rail1:76px; --rail2:208px; --rail:calc(var(--rail1) + var(--rail2));
  /* FantasyPros' player-position palette: pastel fills carrying dark navy ink,
     so a badge stays legible without going neon. Flex/superflex are ours. */
  --p-qb:#C8A1FF; --p-rb:#83DCEF; --p-wr:#85DE9E; --p-te:#FF8AA2;
  --p-k:#FDB97C; --p-dst:#BDC3CD; --p-flex:#7FD1D8; --p-sf:#FFB3D1; --p-bn:#EBEEF4;
  --pos-ink:#13284A;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ground:#0A1322; --surface:#101B30; --surface-2:#172440; --line:#1F2E4A; --line-strong:#33466B;
    --ink:#E8EEF7; --ink-2:#B4C0D3; --muted:#8B9BB5;
    --market:#E0A445; --market-soft:#3A2C14;
    --consensus:#5AA2FF; --consensus-soft:#122A4E;
    --good:#5FC095; --good-soft:#15302690; --warn:#D9A038; --bad:#E2786D; --bad-soft:#37211F;
    --rail-bg:#050E20; --rail-bg-2:#0A1A36;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.3);
  }
}
:root[data-theme="dark"]{
  --ground:#0A1322; --surface:#101B30; --surface-2:#172440; --line:#1F2E4A; --line-strong:#33466B;
  --ink:#E8EEF7; --ink-2:#B4C0D3; --muted:#8B9BB5;
  --market:#E0A445; --market-soft:#3A2C14;
  --consensus:#5AA2FF; --consensus-soft:#122A4E;
  --good:#5FC095; --good-soft:#15302690; --warn:#D9A038; --bad:#E2786D; --bad-soft:#37211F;
  --rail-bg:#050E20; --rail-bg-2:#0A1A36;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.3);
}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--font);font-size:13.5px;line-height:1.5;-webkit-font-smoothing:antialiased}
td,th,.stat .v,.num{font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:var(--font);font-weight:700;letter-spacing:-.01em;text-wrap:balance;margin:0}
h1{font-size:26px;line-height:1.15}
h2{font-size:19px;line-height:1.2}
h3{font-size:11.5px;line-height:1.3;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:600}
a{color:var(--consensus)}
/* Columns of numbers still need to line up; they do not need to look like a
   receipt. Tabular figures give the alignment on the same face as the rest of
   the page, so a table reads as one design instead of two. */
.num{font-variant-numeric:tabular-nums;letter-spacing:0}

/* shell */
.shell{display:grid;grid-template-columns:var(--rail) 1fr;min-height:100vh}
.rail{background:var(--surface);display:flex;position:sticky;top:0;height:100vh}
/* Two tiers. The narrow navy one picks a GROUP of pages and never changes
   width; the wide one lists that group's pages, with the league switcher pinned
   above them because one league is "current" for every page in every group. */
.rail1{width:var(--rail1);flex:none;background:var(--rail-bg);display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 8px;overflow-y:auto}
.rail2{flex:1;min-width:0;display:flex;flex-direction:column;gap:18px;padding-block:16px;padding-inline:12px;overflow-y:auto;border-right:1px solid var(--line)}
.brandmark{display:flex;flex-direction:column;align-items:center;gap:3px;margin-bottom:10px;line-height:1}
.brandmark b{font-size:19px;font-weight:700;letter-spacing:.02em;color:var(--rail-ink-hi)}
.brandmark span{font-size:9px;font-weight:600;text-transform:uppercase;letter-spacing:.1em;color:var(--gold)}
.gtile{all:unset;box-sizing:border-box;cursor:pointer;position:relative;width:60px;aspect-ratio:1;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;color:var(--rail-ink);font-size:10px;font-weight:500;letter-spacing:.02em;transition:background .12s,color .12s}
.gtile svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.gtile:hover{background:rgba(255,255,255,.08);color:var(--rail-ink-hi)}
.gtile[aria-current="true"]{background:var(--consensus);color:#fff;font-weight:600;box-shadow:0 4px 12px rgba(7,105,222,.45)}
.gtile:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
/* a group can be closed and still need you: pending League Setup edits */
.gtile .gdot{position:absolute;top:7px;right:8px;width:8px;height:8px;border-radius:50%;background:var(--gold);box-shadow:0 0 0 2px var(--rail-bg)}
.rail2-title{margin:0 0 6px;padding-inline:10px}
#nav{display:flex;flex-direction:column;gap:18px}
.navsec{display:flex;flex-direction:column;gap:2px}
.navsec .rail2-title{margin:0 0 4px}
/* The single-page options sit at the foot of the first rail, and their page gets the width. */
.gtile.first-foot{margin-top:auto}
.shell.solo{grid-template-columns:var(--rail1) 1fr}
.shell.solo .rail2{display:none}
#nav button{all:unset;cursor:pointer;padding:8px 10px;border-radius:8px;font-size:13px;font-weight:500;color:var(--ink-2);display:flex;justify-content:space-between;align-items:center;gap:8px;position:relative}
#nav button:hover{background:var(--surface-2);color:var(--ink)}
#nav button[aria-current="true"]{background:var(--consensus-soft);color:var(--consensus);font-weight:600}
#nav button[aria-current="true"]::before{content:'';position:absolute;left:-12px;top:8px;bottom:8px;width:3px;border-radius:0 3px 3px 0;background:var(--consensus)}
#nav button:focus-visible{outline:2px solid var(--consensus);outline-offset:1px}
#nav .tag{font-size:10.5px;font-weight:500;color:var(--muted);font-variant-numeric:tabular-nums;background:var(--surface-2);padding:1px 7px;border-radius:99px}
#nav button[aria-current="true"] .tag{background:var(--surface);color:var(--consensus)}
.rail-foot{margin-top:auto;font-size:10.5px;color:var(--muted);display:flex;flex-direction:column;gap:4px;line-height:1.45}

.main{min-width:0;display:flex;flex-direction:column}
.topbar{border-bottom:1px solid var(--line);background:var(--surface);padding-block:10px;padding-inline:24px;display:flex;flex-wrap:wrap;gap:12px 18px;align-items:center;position:sticky;top:0;z-index:5}
/* league switcher — the permanent rail control above the page tabs: one league
   is "current" for every page, so the switcher sits above them, not beside one */
.railswitch{position:relative}
.rsw-btn{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;gap:10px;width:100%;
  background:var(--surface);border:1px solid var(--line-strong);border-radius:12px;padding:9px 10px;box-shadow:var(--shadow);transition:border-color .12s}
.rsw-btn:hover,.rsw-btn[aria-expanded="true"]{border-color:var(--consensus)}
.rsw-btn:focus-visible{outline:2px solid var(--consensus);outline-offset:1px}
.rsw-txt{display:flex;flex-direction:column;gap:1px;min-width:0;flex:1;text-align:left}
.rsw-name{font-weight:600;font-size:13.5px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.25}
.rsw-chev{color:var(--muted);flex:none;width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;transition:transform .15s}
.rsw-btn[aria-expanded="true"] .rsw-chev{transform:rotate(180deg)}
.rsw-sub{display:flex;align-items:center;gap:5px;font-size:10.5px;color:var(--muted);text-align:left;white-space:nowrap;overflow:hidden}
.rsw-sub .dot{color:var(--line-strong)}
.rsw-panel{position:absolute;top:calc(100% + 6px);left:0;right:0;z-index:20;background:var(--surface);
  border:1px solid var(--line-strong);border-radius:12px;box-shadow:0 10px 30px rgba(8,29,63,.18);padding:6px;
  display:flex;flex-direction:column;gap:2px;max-height:60vh;overflow-y:auto}
.rsw-cap{font-size:9.5px;font-weight:600;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);padding:4px 8px 2px}
.rsw-item{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;gap:9px;
  padding:7px 8px;border-radius:8px;width:100%}
.rsw-item:hover{background:var(--surface-2)}
.rsw-item:focus-visible{outline:2px solid var(--consensus);outline-offset:-2px}
.rsw-item.current{background:var(--consensus-soft)}
.rsw-item .rsw-txt{gap:0}
.rsw-item-name{font-size:12.5px;font-weight:600;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rsw-item.current .rsw-item-name{color:var(--consensus)}
.rsw-item-meta{font-size:10.5px;color:var(--muted)}
.rsw-tick{width:14px;height:14px;flex:none;fill:none;stroke:var(--consensus);stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
label.lbl{font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}
select{font-family:inherit;font-size:13.5px;color:var(--ink);background:var(--surface-2);border:1px solid var(--line-strong);border-radius:6px;padding:6px 9px;max-width:min(300px,60vw)}
select.hz{max-width:220px;padding:5px 8px;font-size:12.5px}
select:focus-visible{outline:2px solid var(--consensus);outline-offset:1px}
.spacer{flex:1}
.wk{font-size:11.5px;color:var(--muted)}
.iconbtn{all:unset;cursor:pointer;padding:6px 9px;border-radius:6px;border:1px solid var(--line-strong);font-size:12px;color:var(--ink-2)}
.iconbtn:hover{background:var(--surface-2)}
.iconbtn:focus-visible{outline:2px solid var(--consensus);outline-offset:1px}
.page{padding-block:22px 48px;padding-inline:24px;display:flex;flex-direction:column;gap:22px;max-width:1220px;width:100%}

/* pieces */
.head{display:flex;flex-direction:column;gap:3px}
.head p{margin:0;color:var(--muted);font-size:13px;max-width:70ch}
.strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(132px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden;box-shadow:var(--shadow)}
.stat{background:var(--surface);padding:12px 14px;display:flex;flex-direction:column;gap:3px}
.stat .k{font-size:10px;font-weight:500;text-transform:uppercase;letter-spacing:.09em;color:var(--muted)}
.stat .v{font-family:var(--font);font-size:22px;font-weight:600;line-height:1.1;letter-spacing:-.01em}
.stat .s{font-size:11px;color:var(--muted)}
.v.market{color:var(--market)} .v.consensus{color:var(--consensus)}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);overflow:hidden}
.panel>header{padding:8px 12px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.panel>header h3{margin:0}
.panel>header .spacer{flex:1}
.pbody{padding:10px 12px}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:16px;align-items:start}

.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
/* Projection tables set every source column to the SAME fixed width, so five
   sources read as one scale instead of five differently-sized ones. Fixed
   layout is what makes the colgroup binding rather than advisory. */
table.fixed{table-layout:fixed}
.srcth{display:flex;flex-direction:column;align-items:flex-end;gap:2px;line-height:1}
.srcth img{width:13px;height:13px;object-fit:contain;border-radius:3px}
.srcth b{font-size:10px;font-weight:700;letter-spacing:.06em;color:var(--ink-2)}
th.r .srcth{align-items:flex-end}
th{font-size:9.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--ink-2);font-weight:600;text-align:left;padding:5px 8px;border-bottom:1px solid var(--line-strong);white-space:nowrap;background:var(--surface-2)}
th.band{text-align:center;border-bottom:1px solid var(--line-strong);color:var(--consensus);background:var(--consensus-soft);letter-spacing:.1em;padding-block:5px}
th.band+th.band,td.bandsep{border-left:1px solid var(--line)}
.tsep{border-left:1px solid var(--line)}
td{padding:2px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover{background:color-mix(in srgb,var(--consensus) 6%,var(--surface))}
td.r,th.r{text-align:right}
.pl{display:flex;align-items:center;gap:8px;min-width:0}
/* Same lesson as the avatar: a name block is a shape, not a context. */
.nm{display:flex;flex-direction:column;line-height:1.2;min-width:0}
.nm b,.plink{font-weight:600;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* A player's name is a real button: it opens the player modal (click anywhere on the [data-pid] cell does too). */
.plink{all:unset;box-sizing:border-box;display:block;max-width:100%;cursor:pointer;font-weight:600;font-size:13px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink)}
.plink:hover{color:var(--consensus);text-decoration:underline}
.plink:focus-visible{outline:2px solid var(--consensus);outline-offset:2px;border-radius:3px}
[data-pid]{cursor:pointer}
.nm small{color:var(--muted);font-size:10.5px}
.prow{display:flex;align-items:center;gap:8px;min-width:0}
/**
 * The headshot sits on a grey disc, no ring and no badge; the position lives in
 * the subtext line under the name (see `subLine`).
 *
 * Sleeper's thumbnails are 350x254 with a transparent background and the face
 * centred, so `object-fit:cover` on a square already crops to a head-and-
 * shoulders view. Zooming it further pushes the chin into the corner and cuts
 * the head off. `object-position` top keeps the crown in frame.
 *
 * Two elements: `.av` is the sized frame, `.avf` the clipped, grey face.
 */
/* Scoped to nothing: an avatar is a SIZE, not a context. Scoping this to
   `.prow` and `.pl` meant the matchup cards drew the raw image at its natural
   width the moment they started using the same helper. */
.av{--c:var(--p-bn);width:34px;height:34px;flex:none;position:relative;display:block}
.avf{position:absolute;inset:0;border-radius:50%;background:var(--line);overflow:hidden;display:block}
.avf img{width:100%;height:100%;object-fit:cover;object-position:50% 0;display:block}
/* Team marks are logos, not faces: no crop, no zoom, and a square frame. */
.av.logo .avf{border-radius:10px}
.av.logo .avf img{object-fit:contain;padding:4px}
table.fixed td .prow, table.fixed td .pl{padding-block:1px}
.prow .who{display:flex;flex-direction:column;gap:1px;min-width:0}
.prow .who .pn{font-size:13px;font-weight:600;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stack{display:flex;flex-direction:column;align-items:flex-end;line-height:1.15}
table.fixed td{padding:1px 6px}
table.fixed th{padding:5px 6px;overflow:hidden}
/* Fixed layout sizes from the colgroup, but a nowrap header still sets a
   minimum the table honours; letting band labels clip keeps a long one from
   widening the table past its container. */
table.fixed th.band{overflow:hidden;text-overflow:clip}
.stack .sv{font-variant-numeric:tabular-nums;font-size:13px;font-weight:500}
.stack .ss{font-size:10px;color:var(--muted);font-variant-numeric:tabular-nums}
.stack .sv.big{font-size:14.5px;font-weight:700}
.scored{font-variant-numeric:tabular-nums;font-weight:700;font-size:15px;color:var(--ink)}
.scored.zero{font-weight:400;color:var(--muted)}
/* Solid position squares, matching Sleeper's slot chips. */
.pos{--c:var(--p-flex);display:inline-flex;align-items:center;justify-content:center;text-align:center;
  font-size:10px;font-weight:700;letter-spacing:.02em;border-radius:6px;overflow:hidden;
  width:30px;height:20px;background:var(--surface-2);color:var(--ink-2);border:1px solid var(--line)}
.pos[data-p]{background:var(--c);color:var(--pos-ink);border-color:transparent}
.pos[data-p="QB"]{--c:var(--p-qb)} .pos[data-p="RB"]{--c:var(--p-rb)} .pos[data-p="WR"]{--c:var(--p-wr)}
.pos[data-p="TE"]{--c:var(--p-te)} .pos[data-p="K"]{--c:var(--p-k)} .pos[data-p="DST"]{--c:var(--p-dst)}
.pos[data-p="DEF"]{--c:var(--p-dst)} .pos[data-p="FLEX"]{--c:var(--p-flex)}
.pos[data-p="SF"]{--c:var(--p-sf)} .pos[data-p="BN"]{--c:var(--p-bn)}
.slot{width:38px;height:24px;font-size:10.5px;border-radius:7px;flex:none}
.slotcell{display:flex;align-items:center;gap:6px}
/* team logo · TEAM · position, all at one weight below the name */
.subt{display:flex;align-items:center;gap:5px;line-height:1;margin-top:1px}
/* Scoped to .subt originally, which silently did nothing the first time the
   class was reused outside a player subtitle. It is a size, not a context. */
.tmlogo{width:14px;height:14px;object-fit:contain;flex:none;opacity:.9}
.subt .tm{font-size:11px;color:var(--muted);font-weight:500;letter-spacing:.03em}
.subt .dot{font-size:10px;color:var(--line-strong);margin-inline:1px}
/* Inline position label (e.g. in transaction rows). The palette is pastel now,
   so it is a small filled chip — pastel text on white would not read. */
.pos.mini{width:auto;min-width:22px;height:14px;padding-inline:4px;font-size:9px;border-radius:4px;letter-spacing:.04em}
.subt .pill{font-size:9px;padding:1px 5px;font-weight:700}
.toggles{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.seg{display:inline-flex;border:1px solid var(--line-strong);border-radius:7px;overflow:hidden}
.seg button{all:unset;cursor:pointer;padding:5px 11px;font-size:12px;color:var(--ink-2);background:var(--surface)}
.seg button+button{border-left:1px solid var(--line-strong)}
.seg button[aria-pressed="true"]{background:var(--consensus-soft);color:var(--consensus);font-weight:600}
.seg button:focus-visible{outline:2px solid var(--consensus);outline-offset:-2px}
.grouphdr td{background:var(--surface-2);font-size:10px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:600;padding:6px 10px}
.totrow td{border-top:2px solid var(--line-strong);font-weight:600;background:var(--surface-2)}
/* ---- matchup page ---------------------------------------------------
   Two mirrored cards per slot with the badge between them, the way every host
   draws it. Each side is its own card so the row reads as two things being
   compared rather than one wide strip of text. */
.munav{display:flex;align-items:center;gap:8px;margin-bottom:4px}
.mustrip{display:flex;gap:6px;overflow-x:auto;padding:2px;flex:1;scrollbar-width:thin}
.muchip{display:flex;align-items:center;gap:5px;padding:5px 8px;border-radius:9px;flex:none;
  border:1px solid var(--line);background:var(--surface);cursor:pointer;color:var(--ink-2)}
.muchip:hover{border-color:var(--line-strong)}
.muchip.on{border-color:var(--consensus);background:var(--consensus-soft);color:var(--ink)}
.muchip.mine{box-shadow:inset 0 -2px 0 var(--consensus)}
.muchip .tav{width:22px;height:22px;border-radius:6px}
.muchip .mc{font-size:11.5px;font-variant-numeric:tabular-nums;font-weight:600}
.muchip .vs{font-size:10px;color:var(--muted)}
.muhead{display:grid;grid-template-columns:1fr auto 1fr;gap:14px;align-items:center;padding-bottom:12px}
.muteam{display:flex;align-items:center;gap:11px;min-width:0}
.muteam.b{flex-direction:row;justify-content:flex-end;text-align:right}
.muteam .tav{width:44px;height:44px;border-radius:11px}
.mun{min-width:0;display:flex;flex-direction:column;gap:3px;flex:1;align-items:flex-start}
.muteam.b .mun{align-items:flex-end}
.mun b{font-family:var(--font);font-size:16px;font-weight:600;line-height:1.05;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.musc{text-align:right;flex:none}
.muteam.b .musc{text-align:left}
.musc .p1{font-family:var(--font);font-size:26px;font-weight:600;line-height:1;font-variant-numeric:tabular-nums}
.musc .p2{font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.muvs{font-size:11px;color:var(--muted);letter-spacing:.12em;font-weight:700;text-align:center;white-space:nowrap}
.muband{font-size:9.5px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);font-weight:600;
  padding:10px 0 6px;border-top:1px solid var(--line);margin-top:8px}
.murow{display:grid;grid-template-columns:1fr 48px 1fr;gap:8px;align-items:stretch;margin-bottom:6px}
.muside{display:flex;align-items:center;gap:9px;min-width:0;padding:7px 10px;border-radius:9px;
  border:1px solid var(--line);background:var(--surface-2)}
.muside .note{margin:auto}
.muwho{display:flex;align-items:center;gap:8px;min-width:0;flex:1}
.muwho .av{width:32px;height:32px}
.muside.b .muwho{flex-direction:row-reverse;text-align:right}
.munm{min-width:0;display:flex;flex-direction:column;gap:1px}
.munm .l1{display:flex;align-items:center;gap:5px;min-width:0}
.muside.b .munm .l1{justify-content:flex-end}
.munm .l1 b{font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.munm .l1 .tm{font-size:10px;color:var(--muted);font-weight:600;letter-spacing:.04em;flex:none}
.munm .l2{font-size:10.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.muval{flex:none;text-align:right;min-width:54px}
.muside.b .muval{text-align:left}
.muval .pv{font-size:16px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}
.muval .pv.dim{color:var(--muted);font-weight:400}
.muval .pj{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.mumid{display:flex;align-items:center;justify-content:center}
.mutot .muside{background:transparent;border-color:var(--line-strong);border-width:0;border-top-width:2px;border-radius:0}
.mutot .grow{flex:1}
.muslots.bench .muside{background:transparent;opacity:.82}
@media (max-width:720px){
  .murow{grid-template-columns:1fr 40px 1fr;gap:5px}
  .muside{padding:6px 7px;gap:6px}
  .munm .l1 b{font-size:12.5px}
  .muhead{gap:8px}
  .musc .p1{font-size:24px}
  .muteam .tav{width:34px;height:34px}
}
tr.benchrow td{background:color-mix(in srgb,var(--surface-2) 55%,transparent)}
.wp{display:flex;flex-direction:column;gap:5px;min-width:150px}
.wpbar{height:7px;border-radius:4px;overflow:hidden;display:flex;background:var(--surface-2);border:1px solid var(--line)}
.wpbar i{display:block;height:100%}
.wpnums{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.teamhead{display:flex;align-items:center;gap:9px}
.teamhead img{width:30px;height:30px;border-radius:6px;object-fit:contain;background:var(--surface-2)}
.gt{font-size:11px;color:var(--muted)}
.pill{display:inline-block;font-size:10px;font-weight:600;letter-spacing:.03em;padding:2px 6px;border-radius:99px;border:1px solid transparent}
.pill.out{background:var(--bad-soft);color:var(--bad);border-color:var(--bad)}
.pill.q{background:var(--market-soft);color:var(--warn);border-color:var(--warn)}
.pill.ok{background:var(--good-soft);color:var(--good);border-color:var(--good)}
.pill.gh{background:var(--surface-2);color:var(--muted);border-color:var(--line-strong)}
.delta{font-variant-numeric:tabular-nums;font-weight:500}
.delta.up{color:var(--good)} .delta.dn{color:var(--bad)} .delta.flat{color:var(--muted)}
/* expert-spread meter: text, then a bar whose fill is how contested the rank is */
.rng{display:flex;align-items:center;justify-content:flex-end;gap:7px}
.rng .rt{font-variant-numeric:tabular-nums;font-size:12px;font-weight:500;min-width:34px;text-align:right}
.rng .rbar{width:30px;height:5px;border-radius:99px;background:var(--surface-2);overflow:hidden;flex:none;box-shadow:inset 0 0 0 1px var(--line)}
.rng .rbar i{display:block;height:100%;border-radius:99px;background:var(--consensus)}
.rng.tight .rbar i{background:var(--good)}
.rng.wide .rbar i{background:var(--market)}
.rng.wide .rt{color:var(--market)}
.spark{display:block;margin-left:auto;overflow:visible}
.spark path{fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.spark circle{fill:currentColor}
.spark.up{color:var(--good)} .spark.dn{color:var(--bad)} .spark.flat{color:var(--muted)}

/* ---- trade market page ------------------------------------------------
   The table, the history chart and the "similarly valued" cards all read the
   same `tm` block; up/dn/flat on the wrapper sets one `color` and every stroke,
   gradient stop and arrow below it follows. */
.pos.pill{width:auto;min-width:32px;height:20px;padding-inline:8px;border-radius:99px;font-size:11px}
.tmv{display:inline-flex;align-items:center;gap:5px;font-variant-numeric:tabular-nums;font-size:15px;font-weight:600}
.tmarrow{width:17px;height:17px;flex:none;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.tmarrow.up{color:var(--good)} .tmarrow.dn{color:var(--bad)}
.tmgap{font-variant-numeric:tabular-nums;font-weight:600}
.tmgap.up{color:var(--good)} .tmgap.dn{color:var(--bad)}
.areaspark{display:block;margin-left:auto;overflow:visible}
.areaspark.up,.tmplot.up{color:var(--good)} .areaspark.dn,.tmplot.dn{color:var(--bad)} .areaspark.flat,.tmplot.flat{color:var(--muted)}
.areaspark .ln,.tmplot .ln{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tmbars{display:inline-flex;align-items:flex-end;gap:2px;height:30px}
.tmbars i{display:block;width:4px;min-height:3px;border-radius:2px;background:var(--ink-2);opacity:.75}
.tmbtn{font:inherit;font-size:12.5px;font-weight:600;color:var(--consensus);background:var(--surface);cursor:pointer;
  border:1.5px solid var(--consensus);border-radius:8px;padding:5px 14px;white-space:nowrap}
.tmbtn:hover{background:var(--consensus-soft)}
.tmbtn:focus-visible{outline:2px solid var(--consensus);outline-offset:2px}
.tmsec{display:flex;flex-direction:column;gap:12px}
.tmsec>header{display:flex;align-items:center;gap:10px}
.tmsec h2{font-size:17px;font-weight:700;letter-spacing:-.01em;margin:0;text-transform:none;color:var(--ink)}
.tmsec .spacer{flex:1}
.tmwin{font-size:12px;font-weight:600;color:var(--consensus);border:1.5px solid var(--consensus);border-radius:8px;padding:3px 10px}
.tmplot{position:relative;border:1px solid var(--line);border-radius:20px;padding:12px 10px 4px;background:var(--surface)}
.tmplot svg{display:block;width:100%;height:auto;overflow:visible}
.tmplot .grid{stroke:var(--line);stroke-dasharray:4 4}
.tmplot .axis{stroke:var(--line-strong)}
.tmplot text{fill:var(--ink-2);font-family:var(--font);font-size:12px;font-weight:500}
.tmplot .halo{fill:currentColor;opacity:.18}
.tmplot .dot{fill:currentColor}
.tmtip{position:absolute;pointer-events:none;z-index:2;background:var(--surface);border:1px solid var(--line);border-radius:10px;
  box-shadow:var(--shadow);padding:6px 11px;transform:translate(-50%,calc(-100% - 14px));line-height:1.25;white-space:nowrap}
.tmtip small{display:block;font-size:11.5px;font-weight:500;color:var(--muted)}
.tmtip b{font-size:15px;font-weight:700;font-variant-numeric:tabular-nums}
.tmnav{display:flex;gap:6px}
.tmnav button{font:inherit;width:30px;height:30px;border-radius:50%;border:1px solid var(--line-strong);background:var(--surface);
  color:var(--ink);cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0}
.tmnav button:hover{background:var(--surface-2)}
.tmnav button:focus-visible{outline:2px solid var(--consensus);outline-offset:2px}
.tmnav svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tmcards{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x proximity;padding:4px 2px 10px;scrollbar-width:thin}
.tmcard{font:inherit;color:inherit;text-align:left;cursor:pointer;flex:none;width:352px;display:flex;align-items:center;gap:0;
  padding:8px 14px 8px 8px;border:1px solid var(--line);border-radius:22px;background:var(--surface);box-shadow:var(--shadow);scroll-snap-align:start}
.tmcard:hover{border-color:var(--line-strong);background:var(--surface-2)}
.tmcard:focus-visible{outline:2px solid var(--consensus);outline-offset:2px}
.tmph{width:92px;height:104px;flex:none;border-radius:16px 0 0 16px;background:var(--line);overflow:hidden;
  clip-path:polygon(0 0,66% 0,100% 100%,0 100%);margin-right:-14px}
.tmph img{width:100%;height:100%;object-fit:cover;object-position:50% 0;display:block}
.tmph.logo img{object-fit:contain;padding:12px}
.tmcard .info{display:flex;flex-direction:column;gap:2px;min-width:0;padding-left:26px;flex:1}
.tmcard .info .nm1{font-size:16px;font-weight:500;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tmcard .info .pt{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--ink-2);font-weight:500}
.tmcard .info .mv{font-size:12.5px;color:var(--ink-2);line-height:1.35;white-space:nowrap}
.tmcard .info .mv b{color:var(--ink);font-weight:700;font-variant-numeric:tabular-nums}
.tmcard .areaspark{flex:none;margin-left:8px}
/* ---- player modal ------------------------------------------------------
   One dialog for every player on every page: identity and the headline numbers
   stay put while the tabs swap the body. */
.pm-back{position:fixed;inset:0;z-index:1000;background:rgba(3,10,24,.58);display:flex;align-items:center;justify-content:center;padding:20px}
.pm{width:min(1040px,100%);height:min(840px,100%);background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:18px;
  box-shadow:0 24px 70px rgba(0,0,0,.4);display:flex;flex-direction:column;overflow:hidden}
.pm-head{display:flex;align-items:center;gap:14px;padding:16px 20px 14px}
.pm-head .av{width:58px;height:58px}
.pm-id{display:flex;flex-direction:column;gap:3px;min-width:0;flex:1}
.pm-title{margin:0;font-size:22px;font-weight:700;line-height:1.2;letter-spacing:-.01em;text-transform:none;color:var(--ink)}
.pm-id .subt{gap:6px}
.pm-id .subt .tm{font-size:12.5px}
.pm-status{font-size:12px;color:var(--muted);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.pm-status b{color:var(--ink-2);font-weight:600}
.pm-acts{display:flex;gap:6px;align-items:center;flex:none}
.pm-x,.pm-star{font:inherit;width:34px;height:34px;border-radius:50%;border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);
  cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;font-size:17px;line-height:1}
.pm-x:hover,.pm-star:hover{background:var(--surface-2)}
.pm-star.on{color:var(--warn);border-color:var(--warn)}
.pm-x:focus-visible,.pm-star:focus-visible,.pm-tabs button:focus-visible{outline:2px solid var(--consensus);outline-offset:2px}
.pm-x svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round}
.pm-kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:1px;background:var(--line);border-block:1px solid var(--line)}
.pm-kpi{background:var(--surface-2);padding:9px 16px;display:flex;flex-direction:column;gap:1px;min-width:0}
.pm-kpi .k{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.09em;color:var(--muted)}
.pm-kpi .v{font-size:20px;font-weight:700;line-height:1.2;font-variant-numeric:tabular-nums}
.pm-kpi .s{font-size:11.5px;color:var(--ink-2);font-variant-numeric:tabular-nums}
/* Page-level tabs (My Team): the ESPN-style strip under the page title. */
.pgtabs{display:flex;gap:2px;border-bottom:1px solid var(--line);overflow-x:auto;margin:2px 0 4px}
.pgtabs button{font:inherit;font-size:14px;font-weight:600;color:var(--ink-2);background:none;border:0;border-bottom:3px solid transparent;
  padding:10px 16px 9px;margin-bottom:-1px;cursor:pointer;white-space:nowrap}
.pgtabs button:hover{color:var(--ink)}
.pgtabs button[aria-selected="true"]{color:var(--consensus);border-bottom-color:var(--consensus)}
.pgtabs button:focus-visible{outline:2px solid var(--consensus);outline-offset:-2px;border-radius:6px 6px 0 0}
.pm-tabs{display:flex;gap:2px;padding:0 14px;border-bottom:1px solid var(--line);overflow-x:auto;flex:none}
.pm-tabs button{font:inherit;font-size:13px;font-weight:600;color:var(--ink-2);background:none;border:0;border-bottom:2px solid transparent;
  padding:11px 14px 9px;cursor:pointer;white-space:nowrap}
.pm-tabs button:hover{color:var(--ink)}
.pm-tabs button[aria-selected="true"]{color:var(--consensus);border-bottom-color:var(--consensus)}
.pm-body{flex:1;min-height:0;overflow:auto;padding:16px 20px 22px;display:flex;flex-direction:column;gap:16px}
.pm-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:12px;align-items:start}
.pm-card{border:1px solid var(--line);border-radius:14px;padding:11px 16px 13px;background:var(--surface)}
.pm-card h3{margin:0 0 4px}
.pm-card dl{margin:0;display:grid;grid-template-columns:minmax(0,1fr) auto;column-gap:14px}
.pm-card dt,.pm-card dd{margin:0;padding:5px 0;border-bottom:1px solid var(--line);font-size:13px}
.pm-card dt{color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pm-card dd{text-align:right;font-weight:600;font-variant-numeric:tabular-nums;min-width:0}
.pm-card dt:nth-last-of-type(1),.pm-card dd:nth-last-of-type(1){border-bottom:0}
.pm-card .hostdot{margin-right:6px}
.pm-note{font-size:12px;color:var(--muted);margin:0}
.pm-body table{width:100%}
.pm-body .tmstats{display:flex;gap:26px;flex-wrap:wrap;margin:0}
.tmstat{display:flex;flex-direction:column;gap:1px}
.tmstat .k{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.09em;color:var(--muted)}
.tmstat .v{font-size:22px;font-weight:700;line-height:1.15;font-variant-numeric:tabular-nums}
tr.curwk td{background:var(--consensus-soft)}

.tierchip{display:inline-block;font-size:10px;font-weight:600;letter-spacing:.03em;padding:2px 8px;border-radius:99px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.tierchip.t1{background:var(--good-soft);color:var(--good)}
.tierchip.t2{background:var(--consensus-soft);color:var(--consensus)}
/* strength bars: fill colour follows the tier the FantasyPros grouped the team into */
.sbar{--c:var(--muted);height:8px;min-width:90px;border-radius:99px;background:var(--surface-2);overflow:hidden;box-shadow:inset 0 0 0 1px var(--line)}
.sbar i{display:block;height:100%;border-radius:99px;background:var(--c)}
.sbar.t1{--c:var(--good)} .sbar.t2{--c:var(--consensus)} .sbar.t3{--c:var(--market)}
.posrank{display:flex;flex-direction:column;gap:9px}
.prk{display:grid;grid-template-columns:64px 1fr 64px;align-items:center;gap:12px}
.prk.strong{padding-bottom:9px;border-bottom:1px solid var(--line)}
.prk .pl1{font-weight:600;font-size:12.5px}
.prk.strong .pl1{color:var(--consensus)}
.prk .pr1{text-align:right;font-size:12px;color:var(--ink-2)}
.tneeds{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:4px;padding-top:12px;border-top:1px solid var(--line)}
.tneeds .lbl{font-size:10px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);margin-right:4px}
/* every roster, slot by slot */
.agrid{border-collapse:separate;border-spacing:0;font-size:12px;width:auto;min-width:100%}
.agrid th,.agrid td{border-bottom:1px solid var(--line)}
.agrid th.slot,.agrid td.slot{position:sticky;left:0;z-index:2;background:var(--surface);min-width:64px;border-right:1px solid var(--line-strong)}
.agrid thead th{background:var(--surface-2)}
.agrid thead th.slot{background:var(--surface-2);z-index:3}
.agrid .ghead{min-width:128px;max-width:128px;padding:8px}
.agrid .gth{display:flex;align-items:center;gap:7px;min-width:0}
.agrid .gth .tav{width:24px;height:24px;border-radius:6px}
.agrid .gtx{display:flex;flex-direction:column;min-width:0;text-transform:none;letter-spacing:0}
.agrid .gtx b{font-size:11.5px;font-weight:600;color:var(--ink);overflow:hidden;text-overflow:ellipsis}
.agrid .gtx span{font-size:10px;font-weight:500;color:var(--muted)}
.agrid th.mineh{box-shadow:inset 0 -3px 0 var(--consensus)}
.agrid td.gcell{padding:6px 9px;border-left:1px solid var(--line);min-width:128px;max-width:128px}
.agrid td.gcell.mine{box-shadow:inset 2px 0 0 var(--consensus),inset -2px 0 0 var(--consensus)}
.gcell .gn{font-weight:600;font-size:11.5px;overflow:hidden;text-overflow:ellipsis}
.gcell .gs{display:flex;justify-content:space-between;gap:6px;font-size:10.5px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.gcell .gs b{font-weight:600;color:var(--ink)}
.agrid tr.totrow td{background:var(--surface-2)}
.agrid tr.totrow td.slot{background:var(--surface-2)}
.bar{position:relative;height:5px;border-radius:3px;background:var(--surface-2);overflow:hidden;min-width:54px}
.bar i{position:absolute;inset-block:0;left:0;background:var(--consensus);border-radius:3px}
.bar i.mk{background:var(--market)}
.grade{font-family:var(--font);font-weight:700;font-size:14px}
.note{color:var(--muted);font-size:12.5px;margin:0}
.empty{padding:26px 16px;text-align:center;color:var(--muted);font-size:13px;display:flex;flex-direction:column;gap:6px;align-items:center}
.empty b{color:var(--ink-2);font-weight:600}
/* league scoreboard: one card per matchup, two rows each */
.sbgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px;padding:14px}
.sbcard{border:1px solid var(--line);border-radius:9px;background:var(--surface);overflow:hidden}
.sbcard.mine{border-color:var(--consensus);box-shadow:inset 3px 0 0 var(--consensus)}
.sbrow{display:flex;align-items:center;gap:9px;padding:7px 11px;border-bottom:1px solid var(--line)}
.sbrow:last-of-type{border-bottom:0}
.sbn{flex:1;min-width:0;font-size:13.5px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sbp{font-size:15px;font-weight:600;font-variant-numeric:tabular-nums;color:var(--ink-2);min-width:56px;text-align:right}
.sbp.lead{color:var(--ink);font-weight:700}
.sbj{font-size:10.5px;color:var(--muted);font-variant-numeric:tabular-nums;min-width:42px;text-align:right}
.sbbye{color:var(--muted);font-size:12px;justify-content:center}
.sbfoot{display:flex;align-items:center;gap:8px;padding:6px 11px;background:var(--surface-2);font-size:11px;color:var(--muted)}
/* Fantasy-team crests: square, uncropped, never zoomed like a headshot. */
.tav{width:30px;height:30px;border-radius:8px;flex:none;overflow:hidden;display:block;
  background:var(--surface-2);border:1px solid var(--line)}
.tav img{width:100%;height:100%;object-fit:contain;display:block}
tr.mine .tav{border-color:var(--consensus)}
.seedno{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:6px;
  font-weight:700;font-size:12px;background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.seedno.in{background:var(--good-soft);color:var(--good);border-color:var(--good)}
/* The playoff seed only earns its own mark when it disagrees with the standing. */
.seedalt{display:block;font-size:9px;color:var(--muted);letter-spacing:.04em;margin-top:2px}
.scored.approx{color:var(--muted);font-weight:500}
/* A published number and one we derived by redistributing a season total are
   not the same claim, so they do not get the same weight on the page. */
.wkcell.derived{color:var(--ink-2);font-weight:400}
.wkcell.real{font-weight:600}
.wkcell.bye{color:var(--muted);font-weight:400}
td.wknow{background:var(--surface-2)}
th.sortable .sorth{display:inline-flex;align-items:center;gap:3px}
th.sortable:hover{color:var(--ink)}
th.sorted{color:var(--ink)}
th .arrow{font-size:8px;opacity:.7;margin-left:3px}
th.sortable{cursor:pointer;user-select:none}
th.sortable:focus-visible{outline:2px solid var(--consensus);outline-offset:-2px}
th.sorted{color:var(--consensus)}
table.stand td{padding-block:7px}
/* In vs out of the playoffs is a row FILL, not only a divider: sorting by
   points or by division breaks rank order, and a line drawn at a fixed index
   would then sit in the wrong place while still looking authoritative. */
tbody tr.inplay td{background:color-mix(in srgb,var(--good-soft) 45%,transparent)}
tbody tr.outplay td{background:transparent;color:var(--ink-2)}
tbody tr.outplay .tav{opacity:.65}
tbody tr.cutrow td{background:var(--surface-2);border-block:1px solid var(--line-strong);
  padding:3px 12px;font-size:9.5px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);font-weight:600}

<script id="payload" type="application/json">/*__DATA__*/null</script>
<script>
(function(){
"use strict";
const DATA = JSON.parse(document.getElementById('payload').textContent);
/* A league roster is ids plus that league's own live fields (points, slot, game
   state). Everything else about a player - projections, rank, injury, roster %,
   demand - lives on ONE row per player in DATA.pools, and is joined here, so the
   same player is the same object's worth of data on every page. */
DATA.leagues.forEach(l=>{
  const u=String(l.scoring||'PPR').toUpperCase();
  const pool=new Map((DATA.pools[u==='HALF'?'HALF':(u==='STD'?'STD':'PPR')]||[]).map(p=>[p.i,p]));
  l.teams.forEach(t=>{ t.players=t.players.map(r=> Object.assign({}, pool.get(r.i)||{n:'fpId '+r.i}, r)); });
});
const $ = (s,r)=> (r||document).querySelector(s);
const el = (t,c,txt)=>{const e=document.createElement(t); if(c)e.className=c; if(txt!=null)e.textContent=txt; return e;};
const num = (v,d)=> v==null||v===''? '—' : Number(v).toFixed(d==null?1:d);
/* Used where a string is concatenated into innerHTML, so it has to actually escape. */
const esc = s => String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

/* ---------- theme ---------- */
const store = {
  get(k,f){ try{ const v=localStorage.getItem(k); return v==null?f:v; }catch{ return f; } },
  set(k,v){ try{ localStorage.setItem(k,v); }catch{} }
};
const themeBtn = $('#themeBtn');
const savedTheme = store.get('gd.theme', null);
if(savedTheme) document.documentElement.setAttribute('data-theme', savedTheme);
themeBtn.addEventListener('click', ()=>{
  const cur = document.documentElement.getAttribute('data-theme');
  const isDark = cur ? cur==='dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  const next = isDark ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  store.set('gd.theme', next);
});

/* ---------- helpers ---------- */
const POS_ORDER = {QB:1,RB:2,WR:3,TE:4,K:5,DST:6};
const ACTION = {ADD:['Add','ok'],DROP:['Drop','gh'],TRADE_FOR:['Trade in','q'],TRADE_AWAY:['Trade out','q'],TRADE:['Trade','q']};
function actionPill(a){
  const [label,cls] = ACTION[String(a||'').toUpperCase()] || [String(a||'—').replace(/_/g,' ').toLowerCase(),'gh'];
  return el('span','pill '+cls, label);
}
const byPos = (a,b)=> (POS_ORDER[a.p]||9)-(POS_ORDER[b.p]||9) || (b.wk??-1)-(a.wk??-1);
const sum = (arr,f)=> arr.reduce((s,x)=> s + (Number(f(x))||0), 0);

/**
 * Injury designation, or nothing.
 *
 * ACTIVE is not a designation — it is the absence of one, and on a roster where
 * almost everyone is active a green pill on almost every row carries no
 * information while costing every row the space. Only a real flag renders.
 */
const INJ_ABBR = {QUESTIONABLE:'Q', DOUBTFUL:'D', PROBABLE:'P', OUT:'OUT', IR:'IR',
  SUSPENDED:'SUSP', PUP:'PUP', DNR:'DNR', NA:'NA'};
function injPill(p){
  if(!p.inj) return null;
  const s = String(p.inj).toUpperCase();
  if(s==='ACTIVE'||s==='HEALTHY') return null;
  const cls = (s==='OUT'||s==='IR'||s==='SUSPENDED'||s==='PUP') ? 'out' : 'q';
  const sp = el('span','pill '+cls, INJ_ABBR[s] || s);
  sp.title = [p.inj, p.injT].filter(Boolean).join(' — ');
  return sp;
}
function deltaCell(v){
  const td = el('td','r');
  if(v==null){ td.append(el('span','delta flat','—')); return td; }
  const s = (v>0?'+':'')+Number(v).toFixed(1);
  td.append(el('span','delta '+(v>0.4?'up':(v<-0.4?'dn':'flat')), s));
  return td;
}
const POS_VAR = {QB:'--p-qb',RB:'--p-rb',WR:'--p-wr',TE:'--p-te',K:'--p-k',DST:'--p-dst',DEF:'--p-dst',BN:'--p-bn'};
/**
 * Multi-position slots are written as the initials of what they accept:
 * WR/RB/TE -> WRT, QB/WR/RB/TE -> QWRT. Each gets one solid colour.
 */
function slotLabel(slot){
  const parts=String(slot||'').toUpperCase().split('/').map(x=>x.trim()).filter(Boolean);
  if(parts.length<2) return String(slot||'—').toUpperCase();
  const order=['QB','WR','RB','TE'];
  const set=new Set(parts);
  return order.filter(x=>set.has(x)).map(x=>x[0]).join('') || 'FLEX';
}
/** SF when a flex slot also takes a QB, otherwise FLEX. */
function slotKind(slot){
  const parts=String(slot||'').toUpperCase().split('/').map(x=>x.trim()).filter(Boolean);
  if(parts.length<2) return null;
  return parts.includes('QB') ? 'SF' : 'FLEX';
}
function posChip(pos, extraClass){
  const key=String(pos||'').toUpperCase();
  const known=['QB','RB','WR','TE','K','DST','DEF','BN'];
  const multi=key.includes('/');
  const sp=el('span','pos'+(extraClass?' '+extraClass:''), multi ? slotLabel(key) : (pos||'—'));
  sp.setAttribute('data-p', known.includes(key) ? key : (multi ? slotKind(key) : (key||'FLEX')));
  if(multi) sp.title=key;
  return sp;
}

const teamLogo = (t) => 'https://sleepercdn.com/images/team_logos/nfl/'+String(t||'').toLowerCase()+'.png';

/**
 * One lazy <img> that hides itself if the URL 404s.
 *
 * Four places were each re-implementing this — headshots, the team mark under a
 * name, matchup team heads, standings avatars — and only some of them set
 * loading="lazy" or handled the error, so a missing image left a broken-icon
 * box in some tables and nothing in others.
 */
function imgEl(src, cls){
  const i=el('img',cls||null); i.loading='lazy'; i.alt=''; i.decoding='async';
  if(!src){ i.style.visibility='hidden'; return i; }
  i.src=src;
  i.addEventListener('error',()=>{ i.style.visibility='hidden'; });
  return i;
}

/**
 * Headshot on a grey disc with a position badge on its corner; DSTs use the
 * team logo.
 *
 * Three layers rather than one because the image is scaled up inside the disc
 * and the badge has to sit outside its clip: frame (.av) > clipped face (.avf) >
 * image, with the badge a sibling of the face.
 */
function avatarFor(p){
  const box=el('span','av');
  const face=el('span','avf');
  const pos = String(p.p||'').toUpperCase();
  if((pos==='DST'||pos==='DEF') && p.t){
    box.classList.add('logo');
    face.append(imgEl(teamLogo(p.t)));
  } else {
    face.append(imgEl(p.s ? 'https://sleepercdn.com/content/nfl/players/thumb/'+p.s+'.jpg' : null));
  }

const SLOT_ELIG = {
  QB:['QB'], RB:['RB'], WR:['WR'], TE:['TE'], K:['K'], DST:['DST','DEF'], DEF:['DST','DEF'],
  'W/R':['WR','RB'], 'W/T':['WR','TE'], 'R/T':['RB','TE'],
  'W/R/T':['WR','RB','TE'], 'WR/RB/TE':['WR','RB','TE'], FLEX:['WR','RB','TE'],
  OP:['QB','WR','RB','TE'], SUPERFLEX:['QB','WR','RB','TE'], 'Q/W/R/T':['QB','WR','RB','TE']
};
function slotEligible(slot){
  const k=String(slot||'').toUpperCase().trim();
  if(SLOT_ELIG[k]) return SLOT_ELIG[k];
  if(k.includes('/')) return k.split('/').map(x=>x.trim()).filter(Boolean);
  return [k];
}
const isBench = s => /^(BN|BE|BENCH|IR|TAXI)$/i.test(String(s||'').trim());

/**
 * The real lineup when MyPlaybook serves it; otherwise a best-fit lineup built
 * from the league's slot template and week projections. The two are labelled
 * differently — a computed lineup is not what the manager actually set.
 */
function lineupFor(l, team){
  const M = l.adv && l.adv.matchup;
  if(M && M.ok && team && team.mine){
    const side = [M.team1,M.team2].find(t=> t && String(t.id)===String(l.myTeamId)) || M.team1;
    if(side){
      const byId = new Map(team.players.map(p=>[p.i,p]));
      const map = s => Object.assign({}, byId.get(s.fpId)||{i:s.fpId,n:s.name,t:s.team,p:s.pos}, {slot:s.slot, live:s.proj, gameTime:s.time, gameStatus:s.game});
      return { source:'actual', starters: side.starters.map(map), bench: side.bench.map(x=>Object.assign(map(x),{slot:'BN'})) };
    }
  }
  const slots = (l.rosterSlots||[]).filter(x=>x);
  if(!slots.length || !team) return { source:'none', starters:[], bench:(team?team.players:[]).map(p=>Object.assign({slot:'BN'},p)) };
  const pool = team.players.slice().sort((a,b)=> (b.wk??-1)-(a.wk??-1));
  const used = new Set();
  const starters = [];
  slots.filter(sl=>!isBench(sl)).forEach(sl=>{
    const elig = slotEligible(sl);
    const pick = pool.find(p=> !used.has(p.i) && elig.includes(String(p.p||'').toUpperCase()));
    if(pick) used.add(pick.i);
    starters.push(Object.assign({slot:sl}, pick||{}));
  });
  const bench = pool.filter(p=>!used.has(p.i)).map(p=>Object.assign({slot:'BN'},p));
  return { source:'computed', starters, bench };
}

/* ---------- column sorting for tables that have no sorter of their own ----------
   Reads the cells back out of the DOM, so it works on every table built by
   table()/table2() without each page describing its sort. A cell sorts by its
   `data-v` when it has one (used where the text lies: a chart, a signed change),
   otherwise by the first number in its text, otherwise as text. Group headers and
   total rows stay where they are; rows sort within their own group. Blanks always
   go last. A click cycles first direction, the other, then back to the original
   order. The choice is remembered per set of column labels, so a table rebuilt by
   a search or filter keeps its sort. */
const sortMemo=new Map();
const NUM_LEAD=/^\D{0,4}(-?\d+(?:\.\d+)?)/;
function sortCell(td){
  if(td.dataset.v!=null && td.dataset.v!==''){
    const n=Number(td.dataset.v);
    return Number.isNaN(n)? {num:false, v:td.dataset.v.toLowerCase()} : {num:true, v:n};
  }
  const src=td.querySelector('.plink,.pn,.nm b');
  const raw=((src||td).textContent||'').replace(/\u2212/g,'-').trim();
  if(!raw || /^[\u2014\u2013-]$/.test(raw)) return null;
  const m=raw.match(NUM_LEAD);
  return m? {num:true, v:parseFloat(m[1])} : {num:false, v:raw.toLowerCase()};
}
function makeSortable(t, memoKey){
  const thead=t.tHead, tb=t.tBodies[0];
  if(!thead || !tb || !thead.rows.length) return t;
  const hr=thead.rows[thead.rows.length-1];
  if(hr.querySelector('th.sortable')) return t;
  const ths=Array.from(hr.cells), n=ths.length;
  const isData=tr=> tr.cells.length===n && !tr.classList.contains('totrow') && !tr.classList.contains('grouphdr');
  Array.from(tb.rows).filter(isData).forEach((tr,i)=>{ tr.dataset.o=i; });
  const rows=Array.from(tb.rows).filter(isData);
  const firstDir={};
  const state={col:-1, dir:0};

  const cmp=(a,b)=>{
    if(state.col<0) return a.dataset.o-b.dataset.o;
    const x=sortCell(a.cells[state.col]), y=sortCell(b.cells[state.col]);
    if(!x && !y) return a.dataset.o-b.dataset.o;
    if(!x) return 1;
    if(!y) return -1;
    const d = x.num&&y.num? x.v-y.v : String(x.v).localeCompare(String(y.v));
    return d? d*state.dir : a.dataset.o-b.dataset.o;
  };
  const apply=()=>{
    ths.forEach((th,ci)=>{
      const arrow=th.querySelector(':scope > .arrow');
      if(!arrow) return;
      const on=state.col===ci;
      arrow.textContent= on? (state.dir>0? '\u25B2' : '\u25BC') : '';
      th.classList.toggle('sorted',on);
      th.setAttribute('aria-sort', on? (state.dir>0?'ascending':'descending') : 'none');
    });
    let seg=[];
    const flush=()=>{
      if(!seg.length) return;
      const after=seg[seg.length-1].nextSibling;
      seg.slice().sort(cmp).forEach(r=> tb.insertBefore(r,after));
      seg=[];
    };
    Array.from(tb.rows).forEach(tr=>{ if(isData(tr)) seg.push(tr); else flush(); });
    flush();
    sortMemo.set(memoKey,{col:state.col, dir:state.dir});
  };

  ths.forEach((th,ci)=>{
    if(!th.textContent.trim() && !th.firstElementChild) return;
    const vals=rows.map(tr=>sortCell(tr.cells[ci])).filter(Boolean);
    if(vals.length<2) return;
    const numeric=vals.filter(v=>v.num).length>=vals.length/2;
    const label=th.textContent.trim();
    // Numbers open biggest-first, except ranks, where the best is the smallest.
    firstDir[ci] = numeric && !/^(rk|#|pr|posrk|ecr|adp|rank|opp)/i.test(label)? -1 : 1;
    th.classList.add('sortable');
    th.tabIndex=0;
    th.setAttribute('aria-sort','none');
    th.append(el('span','arrow'));
    const pick=()=>{
      if(state.col!==ci){ state.col=ci; state.dir=firstDir[ci]; }
      else if(state.dir===firstDir[ci]) state.dir=-firstDir[ci];
      else { state.col=-1; state.dir=0; }
      apply();
    };
    th.onclick=pick;
    th.onkeydown=ev=>{ if(ev.key==='Enter' || ev.key===' '){ ev.preventDefault(); pick(); } };
  });
  const saved=sortMemo.get(memoKey);
  if(saved && saved.col>=0 && ths[saved.col] && ths[saved.col].classList.contains('sortable')){
    state.col=saved.col; state.dir=saved.dir; apply();
  }
  return t;
}

/* ---------- local edits ----------
 *
 * This page is a static file with no server, so an edit has nowhere to go but
 * the browser. It goes to localStorage, layered OVER the overrides the build
 * baked in from data/league-overrides.json, and Export writes the merged result
 * back out as a file for `league:import`.
 *
 * The layering matters: a value you changed here and a value already committed
 * to the file must be distinguishable, or "Export" would silently re-assert
 * every default as if you had chosen it. Only genuinely changed keys are kept.
 */
const edits = (()=>{
  const KEY='gd.leagueEdits';
  let mem={};
  try{ mem=JSON.parse(localStorage.getItem(KEY)||'{}')||{}; }catch{ mem={}; }
  const persist=()=>{ try{ localStorage.setItem(KEY, JSON.stringify(mem)); }catch{ /* private window */ } };
  return {
    all: ()=>mem,
    forLeague: (key)=> mem[key] || {},
    /** How many fields this league has pending, for the nav badge. */
    count: (key)=>{
      const e=mem[key]; if(!e) return 0;
      let n=0;
      for(const [k,v] of Object.entries(e)){
        if(v==null) continue;
        if(k==='teams'||k==='scoring') n+=Object.keys(v).length;
        else if(k==='playoffs'||k==='waivers') n+=Object.values(v).filter(x=>x!=null&&x!=='').length;
        else if(Array.isArray(v)) n+= v.length?1:0;
        else n++;
      }
      return n;
    },
    set(key, patch){
      const cur=mem[key]||{};
      mem[key]={...cur, ...patch,
        playoffs:{...(cur.playoffs||{}), ...(patch.playoffs||{})},
        waivers:{...(cur.waivers||{}), ...(patch.waivers||{})},
        teams:{...(cur.teams||{}), ...(patch.teams||{})}};
      persist();
    },
    setTeam(key, teamId, patch){
      const cur=mem[key]||{}; const teams={...(cur.teams||{})};
      teams[String(teamId)]={...(teams[String(teamId)]||{}), ...patch};
      mem[key]={...cur, teams}; persist();
    },
    clear(key){ delete mem[key]; persist(); },
    clearAll(){ mem={}; persist(); },
  };
})();

/** The effective override for a league: what was built in, plus local edits. */
/** Per-team, field by field — a team's nickname, abbreviation and division are edited independently. */
function mergeTeamEdits(base, edits){
  const out={...(base||{})};
  for(const [id,f] of Object.entries(edits||{})) out[id]={...(out[id]||{}), ...f};
  return out;
}
function ovFor(l){
  const base=l.overrides||{}, e=edits.forLeague(l.key);
  return {
    ...base, ...e,

    waivers:{...(base.waivers||{}), ...(e.waivers||{})},
    scoring:{...(base.scoring||{}), ...(e.scoring||{})},
    teams: mergeTeamEdits(base.teams, e.teams),
    divisions: e.divisions || base.divisions || [],
    myTeamIds: e.myTeamIds || base.myTeamIds || [],
  };
}

    item.onclick=(e)=>{
      e.stopPropagation();
      switchOpen=false;
      current=lg;
      // A pairing id from one league means nothing in the next one.
      muPick=null;
      store.set('gd.league',current.key); writeHash(); renderChrome(); render();
    };
    panel.append(item);
  });
  root.append(panel);
  // On a phone the rail is a horizontally scrolling row, which would clip an
  // absolutely positioned panel — pin it to the viewport under the button.
  if(switchOpen && matchMedia('(max-width:860px)').matches){
    const r=btn.getBoundingClientRect();
    Object.assign(panel.style,{position:'fixed', top:(r.bottom+5)+'px', left:'16px', right:'16px'});
  }
}
document.addEventListener('click',()=>{ if(switchOpen){ switchOpen=false; renderLeagueSwitch(); } });
document.addEventListener('keydown',(e)=>{ if(e.key==='Escape' && switchOpen){ switchOpen=false; renderLeagueSwitch(); } });

function renderChrome(){
  renderLeagueSwitch();

  const group = groupOf(page);
  // Remember where you were in each group, so a tile takes you back to it.
  store.set('gd.grp.'+group, page);
  const goPage = (id)=>{ page=id; store.set('gd.page',page); writeHash(); renderChrome(); render(); };

  // Tier 1: one square tile per group; the single-page ones sit at the foot.
  const gnav = $('#groupNav');
  gnav.querySelectorAll('.gtile').forEach(n=>n.remove());
  let footed=false;
  GROUPS.forEach(g=>{
    const b = el('button','gtile'+(g.foot && !footed? ' first-foot':'')); b.type='button';
    if(g.foot) footed=true;
    b.innerHTML='<svg viewBox="0 0 24 24" aria-hidden="true">'+g.icon+'</svg>';
    b.append(el('span',null,g.label));
    b.setAttribute('aria-current', String(g.id===group));

    }

      goPage(back.id);
    };
    gnav.append(b);
  });

  // Tier 2: the pages of the current group, in sections. A single-page option has none,
  // and the page takes the width.
  const gInfo = GROUPS.find(g=>g.id===group);
  document.querySelector('.shell').classList.toggle('solo', !!gInfo.solo);
  const nav = $('#nav'); nav.innerHTML='';
  nav.setAttribute('aria-label', gInfo.label+' pages');
  const sections=[];
  PAGES.filter(p=>p.group===group).forEach(p=>{
    const name=p.section||gInfo.label;
    let sec=sections.find(x=>x.name===name);
    if(!sec){ sec={name, pages:[]}; sections.push(sec); }
    sec.pages.push(p);
  });
  sections.forEach(sec=>{
    const box=el('div','navsec');
    box.setAttribute('role','group'); box.setAttribute('aria-label',sec.name);
    box.append(el('h3','rail2-title',sec.name));

      const tag = pageTag(p.id);
      if(tag){ const s=el('span','tag',tag); b.append(s); }
      b.onclick = ()=>goPage(p.id);
      box.append(b);
    });
    nav.append(box);
  });

  const l = L();
  const chips = $('#lgChips'); chips.innerHTML='';
  const add=(k,v)=>{ const c=el('span','chip'); c.append(document.createTextNode(k+' ')); c.append(el('b',null,v)); chips.append(c); };
  // The league's own settings, on the pages that are about a league. All Leagues and Sync are not.
  if(!gInfo.solo){
    add('Scoring', l.scoring||'—');
    add('Teams', String(l.teams.length));
    if(l.playoffs&&l.playoffs.teams) add('Playoffs', l.playoffs.teams+' @ wk'+l.playoffs.startWeek);
    if(l.status!=='active') chips.append(el('span','pill gh', l.status));

  // With no second rail there is nowhere else to say when the data was last pulled.
  $('#wkLabel').textContent = 'Season '+DATA.season+' · Week '+DATA.week+' · Vegas: '+DATA.bookmaker
    + (gInfo.solo? ' · Synced '+new Date(DATA.generatedAt).toLocaleString() : '');

}
function pageTag(id){
  const l=L();
  if(id==='myteam'){ const t=myTeam(); return t? String(t.players.length) : '—'; }
  if(id==='moves') return String(l.transactions.length||0);
  if(id==='matchup')  return (l.adv&&l.adv.matchup&&l.adv.matchup.ok)? 'live' : (l.detail&&l.detail.supported? 'live' : '—');
  if(id==='analysis'){ const a=l.analysis&&l.analysis.ros; const m=a&&a.teams.find(t=>t.isMine); return m? '#'+m.rank : '\u2014'; }

/**
 * The Overview tab's summary: a stat strip first (out[0]), then the panels that
 * sit under the roster table. Split so the page can put the table between them.
 */
function overviewParts(l, t){
  const out=[];
  const withVg = t.players.filter(p=> p.vg!=null && p.vc);
  // Vegas prices only some players, so the market total must be compared against
  // the consensus total for THAT SAME subset — not against the whole roster.
  const mkTotal = sum(withVg,p=>p.vg), fpSame = sum(withVg,p=>p.wk);
  const gap = mkTotal - fpSame;
  // The same starters and the same consensus as the table below, so a tile can
  // never disagree with the totals row under it.
  const starters=lineupFor(l,t).starters.filter(p=>p.i);
  const wkH=parseHz('w-'+DATA.week), rosH=parseHz('ros');
  const strip = el('div','strip');
  strip.append(statTile('This week', num(scopeTotal(starters,wkH)), 'starters · '+consStore.active().name+' consensus','consensus'));
  strip.append(statTile('Rest of season', Math.round(scopeTotal(starters,rosH)).toLocaleString(), 'starters \u00b7 '+rosSpan()));
  strip.append(statTile('Market vs FP', num(mkTotal),
    'VegasEdge · '+withVg.length+' priced · FP '+num(fpSame)+' ('+(gap>0?'+':'')+num(gap)+')','market'));
  strip.append(statTile('Injury flags', String(t.players.filter(p=>p.inj&&p.inj!=='ACTIVE').length), 'on your roster'));
  out.push(strip);

  const cols = el('div','cols');

  // biggest market disagreements on my roster
  const edges = t.players.filter(p=>p.vd!=null).sort((a,b)=> Math.abs(b.vd)-Math.abs(a.vd)).slice(0,6);
  const rowsE = edges.map(p=>{
    const tr=el('tr');
    tr.append(playerCell2(p));
    tr.append(Object.assign(el('td','r num'),{textContent:num(p.wk)}));
    tr.append(Object.assign(el('td','r num'),{textContent:num(p.vg)}));
    tr.append(deltaCell(p.vd));
    return tr;
  });
  cols.append(panel('Market vs consensus', 'your roster',
    edges.length ? table([{label:'Player'},{label:'FP',r:1},{label:'Vegas',r:1},{label:'Δ',r:1}], rowsE)
                 : emptyState('No priced players', 'Vegas covers QB/RB/WR/TE only.')));

  // injuries
  const hurt = t.players.filter(p=>p.inj && p.inj!=='ACTIVE').sort((a,b)=>(b.wk??0)-(a.wk??0));
  const rowsI = hurt.map(p=>{
    const tr=el('tr'); tr.append(playerCell2(p));
    tr.append(Object.assign(el('td','r num'),{textContent:num(p.wk)}));
    return tr;
  });
  cols.append(panel('Injury watch', hurt.length?null:'all clear',
    hurt.length ? table([{label:'Player'},{label:'FP',r:1}], rowsI)
                : emptyState('Nobody flagged', 'No injury designations on your roster this week.')));
  out.push(cols);

  // The demand board, compressed to the one line that would make you act: who
  // is unrostered HERE and being added fastest everywhere else. It leads the
  // projection panels above it because it is the only thing on this page that
  // changes between now and kickoff.
  const pool = DATA.pools[ (l.scoring||'PPR').toUpperCase()==='HALF' ? 'HALF' : ((l.scoring||'PPR').toUpperCase()==='STD'?'STD':'PPR') ] || [];
  const taken = allRostered();
  const surging = pool.filter(p=> !taken.has(p.i) && p.sig && p.sig.v!=null)
    .sort((a,b)=> b.sig.v-a.sig.v).slice(0,6);
  if(surging.length){
    const rowsH = surging.map(p=>{
      const tr=el('tr');
      tr.append(playerCell2(p));
      tr.append(surgeCell(p.sig));
      const r=el('td','r num'); r.textContent = p.sig.r!=null? rate(p.sig.r) : '—'; tr.append(r);
      tr.append(rosteredCell(p.sig));
      tr.append(stackCell(fmt(p.wk),null,{sep:1}));
      return tr;
    });
    const S=DATA.signals||{};
    out.push(panel('Being added right now',
      S.trendFetchedAt? 'Sleeper add rate as of '+new Date(S.trendFetchedAt).toLocaleTimeString([], {hour:'numeric',minute:'2-digit'}) : null,
      table2(null,[{label:'Free agent'},
        {label:'Surge',r:1,w:62,title:'Recent add rate against the rate before it'},
        {label:'Adds/h',r:1,w:62},
        {label:'Rostered',r:1,w:108,title:'Share of Yahoo leagues already rostering him'},
        {label:'Wk',r:1,sep:1,w:PROJW}], rowsH)));
  }

  const recent = l.transactions.slice(0,8);
  const rowsT = recent.map(x=>{
    const tr=el('tr');
    tr.append(el('td', null, (x.date||'').slice(0,10)));
    const a=el('td'); a.append(actionPill(x.action)); tr.append(a);
    tr.append(el('td', null, x.playerName||'—'));
    tr.append(el('td', null, x.playerPos||''));
    tr.append(el('td', null, x.teamName||''));
    return tr;
  });
  out.push(panel('Recent activity', l.transactions.length+' total',
    recent.length? table([{label:'Date'},{label:''},{label:'Player'},{label:'Pos'},{label:'Team'}], rowsT)
                 : emptyState('No transactions', 'Nothing recorded for this league yet.')));
  return out;
}

/* ---------- roster tables ----------
   Each projection sits above its own positional rank, and the three sources
   (FantasyPros / Vegas / WinWithOdds) are banded together so they read as a set. */

const fmt=(v,d)=> v==null||v===''? '—' : Number(v).toFixed(d==null?1:d);

/**
 * The five projection sources, as they label their own columns.
 *
 * Spelled-out names set the column width from the HEADER rather than from the
 * number underneath, which is backwards: "WinWithOdds" is eleven characters
 * holding up a column whose widest value is four. The abbreviation plus the
 * site's favicon identifies the source in the width a number actually needs,
 * and the full name stays on the cell's tooltip.
 */
const SOURCES = {
  fp:  {ab:'FP',  full:'FantasyPros — expert consensus',        dom:'fantasypros.com'},
  vg:  {ab:'VE',  full:'VegasEdge — sportsbook-derived',        dom:'vegasedgefantasy.com'},
  wwo: {ab:'WWO', full:'WinWithOdds — sportsbook-derived',      dom:'winwithodds.com'},
  fd:  {ab:'1D',  full:'First Down Studio',                     dom:'firstdown.studio'},
  fdl: {ab:'FD',  full:'FanDuel / numberFire',                  dom:'fanduel.com'},
  sl:  {ab:'SL',  full:'Sleeper — published weekly projection, not a ratio', dom:'sleeper.com'},
  ds:  {ab:'DS',  full:'Draft Sharks — weekly rankings, independent of Sleeper', dom:'draftsharks.com'},
  yh:  {ab:'YH',  full:'Yahoo — this league’s own week-to-week projection, not a ratio', dom:'yahoo.com'},
};
/** Sources that publish a real number for every week rather than a season total spread on a curve. */
const PUBLISHED_WEEKLY = ['sl', 'ds', 'yh'];
/** Column width every source column shares. Wide enough for "-12.3". */
const PROJW = 58;

function srcHead(key){
  const s=SOURCES[key];
  const d=el('div','srcth');
  d.append(imgEl('https://www.google.com/s2/favicons?domain='+s.dom+'&sz=32'));
  d.append(el('b',null,s.ab));
  const stale=staleSet().has(key);
  if(stale) d.append(el('i','stalemark','\u25CF'));
  const age=srcAge(key);
  return {node:d, title: s.full + (stale? ' \u2014 last updated '+Math.round(age)+'h ago, so it is left out of the consensus (Sources \u2192 Consensus to change)' : '')};
}
const srcCol = (key) => Object.assign({r:1, w:PROJW}, srcHead(key));

const hzOf = scope=> scope && typeof scope==='object'? scope : parseHz(scope==='ros'?'ros':('w-'+DATA.week));

/** Which column groups the projection tables show. One setting for every page, so a table looks the same wherever a player appears. */
const COL_GROUPS = [
  {id:'cons', label:'Consensus', title:'Your weighted consensus: points, rank and position rank'},
  {id:'src',  label:'Sources',   title:'One column per source, as published for the window'},
  {id:'mkt',  label:'Trade',     title:'FantasyPros trade market: what managers actually pay for him, and which way it is moving'},
  {id:'info', label:'Info',      title:'Opponent, trend, start/sit grade and FantasyPros roster %'},
  {id:'buzz', label:'Buzz',      title:'Adds, drops, starts and roster % across Sleeper and Yahoo'},
];
let colGroups = new Set(String(store.get('gd.cols','cons,src,mkt,info,buzz')).split(',').filter(x=>COL_GROUPS.some(g=>g.id===x)));
if(!colGroups.size) colGroups = new Set(['cons']);
function colGroupControl(){

    b.type='button'; b.title=cg.title; b.setAttribute('aria-pressed', String(colGroups.has(cg.id)));

/** "wk 2\u201318", the weeks a rest-of-season number spans. */
const rosSpan = ()=> 'wk '+DATA.week+'\u2013'+LAST_WEEK;

/* ---------- ranges and the trade market ---------- */
/** A column that opens a group: draws the divider on its header and every cell. */
function sepCol(c){
  const inner=c.cell, tot=c.total;
  c.sep=1;
  c.cell=p=>{ const td=inner(p); td.classList.add('tsep'); return td; };
  if(tot) c.total=l=>{ const td=tot(l); td.classList.add('tsep'); return td; };
  return c;
}
const dashCell=(tip)=>{ const td=el('td','r'); const d=el('span','delta flat','—'); if(tip) d.title=tip; td.append(d); return td; };

/** FantasyPros' own rank on the board this window reads: weekly, or rest of season. */
function ecrOf(p,h){ return hzMode(h)==='ros'? p.rosRk : p.rk; }
function ecrCell(p,h){
  const v=ecrOf(p,h), td=el('td','r num');
  td.textContent = v==null? '—' : String(v);
  return td;
}
/**
 * The expert spread: the best and worst rank any FantasyPros expert gave him,
 * with a bar for how CONTESTED that is.
 *
 * A spread of 5 means something different at rank 2 than at rank 150, and weekly
 * boards spread far wider than rest-of-season ones, so no fixed threshold is
 * right for both. The bar is therefore a PERCENTILE: his spread (against where
 * he is ranked) among every player on the same board. Full means more contested
 * than nearly everyone; a sliver means the experts are close to unanimous.
 */
const spreadRatio=(lo,hi,avg)=> (hi-lo)/Math.max(avg!=null? avg : (lo+hi)/2, 6);
const spreadScaleCache={};
function spreadScale(ros){
  const sc=scoringKey(L()), key=sc+(ros?'|ros':'|wk');
  if(spreadScaleCache[key]) return spreadScaleCache[key];
  const lo=ros?'rosMin':'rmin', hi=ros?'rosMax':'rmax', av=ros?'rosAve':'rave';
  const all=(DATA.pools[sc]||[]).filter(x=>x[lo]!=null && x[hi]!=null)
    .map(x=>spreadRatio(x[lo],x[hi],x[av])).sort((a,b)=>a-b);
  // Share of the board with a strictly smaller ratio than `r`.
  const pct=r=>{ if(!all.length) return .5; let a=0,b=all.length; while(a<b){ const m=(a+b)>>1; if(all[m]<r) a=m+1; else b=m; } return a/all.length; };
  return spreadScaleCache[key]={pct};
}
function ecrRangeCell(p,h){
  const ros=hzMode(h)==='ros';
  const lo=ros? p.rosMin : p.rmin, hi=ros? p.rosMax : p.rmax, avg=ros? p.rosAve : p.rave;
  if(lo==null || hi==null) return dashCell('No expert spread on this board');
  const q=spreadScale(ros).pct(spreadRatio(lo,hi,avg));
  const cls = lo===hi || q<=.33 ? 'tight' : (q<=.67 ? 'mid' : 'wide');
  const td=el('td','r'), w=el('div','rng '+cls);
  w.append(el('span','rt', lo===hi? String(lo) : lo+'\u2013'+hi));
  const bar=el('span','rbar'), f=el('i');
  f.style.width=Math.max(10,Math.round(q*100))+'%';
  bar.append(f); w.append(bar); td.append(w);
  td.title='FantasyPros experts rank him '+(lo===hi? lo+' \u2014 unanimous' : lo+' to '+hi)+(avg!=null? ' (average '+Number(avg).toFixed(1)+')' : '')
    +(lo===hi? '' : '. More contested than '+Math.round(q*100)+'% of players on this board');
  return td;
}

function tradeDates(){ const t=DATA.trade && DATA.trade[scoringKey(L())]; return t? (t.dates||[]) : []; }
const tmNums = p=> (p.tm && p.tm.s)? p.tm.s.filter(x=>x!=null) : [];
/** Latest minus earliest priced day in the window, or null with fewer than two days. */
function tmChange(p){ const v=tmNums(p); return v.length<2? null : v[v.length-1]-v[0]; }
const UNPRICED='Not priced on the trade market: FantasyPros gives no value for kickers, defenses or fringe players';

function tmValueCell(p){
  if(!p.tm || p.tm.v==null){ return dashCell(UNPRICED); }
  const td=stackCell(String(p.tm.v), p.tm.pr!=null? (p.p||'')+p.tm.pr : '', {});
  td.title='Trade value '+p.tm.v+(p.tm.rk!=null? ' — #'+p.tm.rk+' overall' : '')+(p.tm.pr!=null? ', '+(p.p||'')+p.tm.pr+' at his position' : '')
    +(p.tm.x!=null? '. Experts value him '+(p.tm.x<0? Math.abs(p.tm.x)+' less' : p.tm.x+' more')+' than the market does' : '');
  return td;
}
function tmChangeCell(p){
  if(!p.tm) return dashCell(UNPRICED);
  const d=tmChange(p);
  if(d==null) return dashCell('Fewer than two days of trade history');
  const td=el('td','r'); td.dataset.v=String(d);
  const sp=el('span','delta '+(d>0?'up':d<0?'dn':'flat'), d===0? '0' : (d>0?'▲':'▼')+Math.abs(d));
  const n=(p.tm.n||[]).filter(x=>x!=null).reduce((a,b)=>a+b,0);
  sp.title='Trade value '+(d>0?'rose':d<0?'fell':'did not move')+' by '+Math.abs(d)+' over '+tmNums(p).length+' days'+(p.tm.n? '; '+n+' trades involved him' : '');
  td.append(sp); return td;
}
const SVGNS='http://www.w3.org/2000/svg';
/** A bare line: no axes, no fill. It answers "up, down or flat", nothing more. */
function sparkline(vals, dates){
  const W=70,H=20,pad=2, pts=vals.map((v,i)=>[i,v]).filter(x=>x[1]!=null);
  const svg=document.createElementNS(SVGNS,'svg');
  svg.setAttribute('viewBox','0 0 '+W+' '+H); svg.setAttribute('width',W); svg.setAttribute('height',H);
  svg.setAttribute('class','spark'); svg.setAttribute('aria-hidden','true');
  if(pts.length<2) return svg;
  const lo=Math.min(...pts.map(x=>x[1])), hi=Math.max(...pts.map(x=>x[1])), span=hi-lo;
  const X=i=> pad+(vals.length>1? i/(vals.length-1) : 0)*(W-2*pad);
  // A flat series is drawn along the middle rather than stretched to fill.
  const Y=v=> span===0? H/2 : H-pad-((v-lo)/span)*(H-2*pad);
  const path=document.createElementNS(SVGNS,'path');
  path.setAttribute('d', pts.map((x,k)=>(k?'L':'M')+X(x[0]).toFixed(1)+' '+Y(x[1]).toFixed(1)).join(' '));
  svg.append(path);
  const last=pts[pts.length-1], dot=document.createElementNS(SVGNS,'circle');
  dot.setAttribute('cx',X(last[0]).toFixed(1)); dot.setAttribute('cy',Y(last[1]).toFixed(1)); dot.setAttribute('r','2');
  svg.append(dot);
  const dir=pts[pts.length-1][1]-pts[0][1];
  svg.setAttribute('class','spark '+(dir>0?'up':dir<0?'dn':'flat'));
  return svg;
}
function tmSparkCell(p){
  if(!p.tm || !p.tm.s) return dashCell(p.tm? 'No daily history for him' : UNPRICED);
  const td=el('td','r'); td.append(sparkline(p.tm.s, tradeDates()));
  const dates=tradeDates();
  td.title=p.tm.s.map((v,i)=> (dates[i]||('day '+(i+1)))+': '+(v==null? '—' : v)).join('\n');
  const ch=tmChange(p); if(ch!=null) td.dataset.v=String(ch);
  return td;
}

/**
 * The one list of projection columns, for every table that shows players against
 * the sources: My Team (lineup and by-position), All Rosters, matchup rosters and
 * the Players page. Each descriptor carries its own header, width, band, cell and
 * (where it means anything) total, so a page cannot show a column another page
 * lacks or order the same groups differently. Which groups appear is `colGroups`.
 *
 *   Consensus   your weighted average, its overall rank and its rank in position
 *   sources     each source's own number for the window, as published
 *   Info        opponent, and on Players the trend and grade; the % rostered
 *   Buzz        adds, drops, starts and roster % from Sleeper and Yahoo
 *   Actual      points scored so far this week (rosters only)
 */
function columnsFor(scope, o){
  o=o||{};
  const h=hzOf(scope), mode=hzMode(h);
  const prof=consStore.active();
  const ranked = h.kind==='ros' || mode==='week';
  const consBand='Consensus \u00b7 '+prof.name;
  const cols=[];
  // `o.groups` pins the column groups for a tab that decides its own; otherwise the shared chips do.
  const on=g=> o.groups? o.groups.includes(g) : colGroups.has(g);

  if(on('cons')){
    cols.push({key:'cons', label:'Pts', w:PROJW, r:1, sep:1, band:consBand,
      title:'Weighted average of the sources that have a number, with the weights on the Sources page',
      cell:p=> consPtsCell(p,h),
      total:list=> stackCell(fmt(sum(list,p=>{ const c=consFor(p,h); return c? c.v : 0; })),'',{sep:1,big:1})});
    if(ranked){
      cols.push({key:'consrk', label:'Rk', w:44, r:1, band:consBand, title:'Rank of the consensus across every player',
        cell:p=> consRankCell(p,h,'rk'), total:()=> el('td','r')});

      cols.push(sepCol({key:'ecr', label:'ECR', w:44, r:1, band:'FantasyPros experts',

      cols.push({key:'ecrrng', label:'Range', w:92, r:1, band:'FantasyPros experts',

        cell:p=> ecrRangeCell(p,h), total:()=> el('td','r')});
    }
  }

  if(on('src')){

  if(on('mkt')){
    const nd=tradeDates().length;
    const band='Trade market \u00b7 FantasyPros';
    cols.push(sepCol({key:'tm', label:'Value', w:58, r:1, band,
      title:'What managers actually trade for on FantasyPros, on a ~1000 scale (the most valued player is about 1000). Blank means unpriced.',
      cell:tmValueCell, total:()=> el('td','r')}));
    cols.push({key:'tmd', label:nd? nd+'d' : 'Chg', w:52, r:1, band,

    cols.push({key:'tms', label:'Chart', w:78, r:1, band,
      title:'Daily trade value across the window', cell:tmSparkCell, total:()=> el('td','r')});
  }

  if(on('info')){
    const info=(c)=> cols.push(Object.assign({band:'Info', r:1}, c));
    if(mode!=='ros') info({key:'opp', label:'Opp', w:72, r:0, title: mode==='week'? 'This week\u2019s opponent' : 'Opponent for the first week in this window',

    if(o.players && mode==='week') info({key:'trend', label:'Trend', w:56, title:'Change in the expert consensus rank since the last update', cell:trendCell});
    if(o.players) info({key:'grade', label:'Grade', w:56, title:'FantasyPros start/sit grade', cell:gradeBadgeCell});
    info({key:'own', label:'FP %', w:PROJW, title:'Rostered across FantasyPros leagues (the weekly board)',
      cell:p=> stackCell(p.own==null?'\u2014':Math.round(p.own)+'%','',{}) });
    // The Info group opens with a divider, whichever column happens to lead it.
    const lead=cols.find(c=>c.band==='Info');
    if(lead){
      lead.sep=1;
      const inner=lead.cell;
      lead.cell=p=>{ const td=inner(p); td.classList.add('tsep'); return td; };

  if(on('buzz')) buzzColumns().forEach(c=> cols.push(c));

  if(!o.players && mode==='week' && !o.noActual){
    cols.push({key:'pts', label:'PTS', w:PROJW, r:1, sep:1, band:'Actual', title:'Actual points this week, under THIS league\u2019s scoring',
      cell:scoredCell,
      total:list=>{
        const sc=el('td','r tsep');
        const tot=sum(list, p=> p.lp!=null? p.lp : ((p.lslot!=null||p.lgame!=null)? 0 : ((p.wwo&&p.wwo.actual)||0)));
        sc.append(Object.assign(el('div','scored'+(tot>0?'':' zero')),{textContent:fmt(tot)}));

      }});

  return cols;

/**

const signed = v=> (v>0?'+':(v<0?'\u2212':''))+rate(Math.abs(v));
function sigNumCell(get, fmtFn, tip){

function consTip(p,h){
  const c=consFor(p,h);
  if(!c) return '';
  const head='Weighted average of '+c.n+' source'+(c.n===1?'':'s')+' \u00b7 '+consStore.active().name
    +(c.n>1 && c.lo!=null? ' \u00b7 sources range '+fmt(c.lo)+'\u2013'+fmt(c.hi) : '');
  const parts=consBreakdown(p,h);
  if(!parts || !parts.length) return head;
  return head+'\n'+parts.map(x=> SOURCES[x.k].ab+' '+fmt(x.v)
    + (Math.abs(x.cal-x.v)>=0.05? ' \u2192 '+fmt(x.cal)+' on FP level' : '')
    + (x.raw!=null? ' (published '+fmt(x.raw)+', played game taken out)' : '')
    + (x.why? '  \u2014 left out: '+x.why : '')).join('\n');
}
function consPtsCell(p,h){
  const c=consFor(p,h);
  const td=stackCell(fmt(c&&c.v), null, {sep:1, big:1});
