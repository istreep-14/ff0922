function field(label, control, hint){
  const d=el('div','fld');
  d.append(el('label','lbl',label));
  d.append(control);
  if(hint) d.append(el('div','fhint',hint));
  return d;
}
function textInput(value, onCommit, placeholder){
  const i=el('input'); i.type='text'; i.value=value??''; if(placeholder) i.placeholder=placeholder;
  // Commit on blur and on Enter, not on every keystroke: a re-render per
  // character would take the focus out of the field being typed into.
  const commit=()=>{ const v=i.value.trim(); onCommit(v===''? null : v); };
  i.addEventListener('blur',commit);
  i.addEventListener('keydown',e=>{ if(e.key==='Enter'){ e.preventDefault(); i.blur(); } });
  return i;
}
function numInput(value, onCommit, {min,max,placeholder}={}){
  const i=el('input'); i.type='number'; i.value=value??''; i.style.maxWidth='90px';
  if(min!=null) i.min=min; if(max!=null) i.max=max; if(placeholder) i.placeholder=placeholder;
  const commit=()=>{ const v=i.value.trim(); onCommit(v===''? null : Number(v)); };
  i.addEventListener('blur',commit);
  i.addEventListener('keydown',e=>{ if(e.key==='Enter'){ e.preventDefault(); i.blur(); } });
  return i;
}
function selectInput(options, value, onPick){
  const sel=el('select');
  options.forEach(o=>{ const op=el('option',null,o.label); op.value=o.value==null?'':o.value; sel.append(op); });
  sel.value = value==null? '' : String(value);
  sel.onchange=()=> onPick(sel.value===''? null : sel.value);
  return sel;
}

/**
 * The league's scoring table, and the corrections to it.
 *
 * Two sources disagree here, and both are shown rather than merged silently:
 *
 *   scraped  MyPlaybook's reading of the league's rules. Available for ESPN,
 *            Yahoo and Sleeper, and complete for none of them — its Sleeper
 *            reading carries no defensive stats for a league that scores them.
 *   host     the host's own table, where the host publishes one. Sleeper does;
 *            ESPN and Yahoo do not expose one reachable from here.
 *
 * You edit the third column, which wins over both. Nothing here changes the
 * points on the rest of the page — those come from the host itself, per player,
 * off the live board — so this is the reference that explains WHY a number
 * differs from a generic PPR projection, and the place to record a rule the
 * scrape got wrong.
 */
const SLEEPER_STAT = {
  'PassYds':'pass_yd', 'PassTD':'pass_td', 'IntQB':'pass_int', 'Pass2pt':'pass_2pt',
  'RushYds':'rush_yd', 'RushTD':'rush_td', 'Rush2pt':'rush_2pt',
  'RecYds':'rec_yd', 'RecTD':'rec_td', 'Rec':'rec', 'RecWR':'rec', 'RecRB':'rec', 'RecTE':'rec',
  'FumLost':'fum_lost', 'FumRec':'fum_rec', '2-PT':'pass_2pt',
  'PAT':'xpm', 'IntDef':'int', 'Sack':'sck', 'Safety':'safe', 'DefTD':'def_td',
};
const STAT_LABEL = {
  'PassYds':'Passing yards', 'PassTD':'Passing TD', 'IntQB':'Interception thrown',
  'RushYds':'Rushing yards', 'RushTD':'Rushing TD',
  'RecYds':'Receiving yards', 'RecTD':'Receiving TD',
  'Rec':'Reception', 'RecWR':'Reception — WR', 'RecRB':'Reception — RB', 'RecTE':'Reception — TE',
  'FumLost':'Fumble lost', 'FumRec':'Fumble recovered', '2-PT':'Two-point conversion',
  'FG':'Field goal', 'PAT':'Extra point', 'IntDef':'Interception (D)', 'Sack':'Sack',
  'Safety':'Safety', 'DefTD':'Defensive TD', 'PtsAllow':'Points allowed',
};

function scoringPanel(l, o){
  const sys=l.scoringSystem;
  const host=(l.detail && l.detail.supported && l.detail.settings) ? l.detail.settings.scoring : null;
  const over=o.scoring||{};
  if(!sys && !host){
    return panel('Scoring', l.host,
      emptyState('No scoring table from this host', 'Per-player points still come from the host itself, so they are correct — there is just nothing here to show or correct.'));
  }

  const rules=(sys&&sys.rules)||[];
  const seen=new Set(rules.map(r=>r.stat));
  // A stat the host publishes and the scrape missed is exactly the gap this
  // panel exists for, so it gets a row of its own rather than being dropped.
  const extra=[];
  if(host){
    Object.entries(SLEEPER_STAT).forEach(([stat,key])=>{
      if(seen.has(stat) || host[key]==null) return;
      if(extra.some(e=>e.stat===stat)) return;
      extra.push({stat, tiers:[], missing:true});
    });
  }

  const rowFor=(r)=>{
    const tr=el('tr');
    if(r.missing) tr.classList.add('benchrow');

    const nc=el('td');
    const w=el('div','nm');
    w.append(el('b',null, STAT_LABEL[r.stat] || r.stat));
    w.append(el('small',null, r.stat + (r.tiers.length>1? ' · '+r.tiers.length+' bands' : '')));
    nc.append(w); tr.append(nc);

    // Banded stats (FG by distance, PtsAllow by bracket) are a table, not a
    // number, so they are shown whole and left uneditable rather than flattened
    // to whichever band happened to come first.
    const sc=el('td','r');
    if(r.tiers.length>1){
      sc.append(Object.assign(el('div','ss'),{textContent:r.tiers.map(t=>t.points+' @ '+t.lower+'–'+t.upper).join('  ·  ')}));
    } else if(r.tiers.length===1){
      sc.append(Object.assign(el('div','num'),{textContent:String(r.tiers[0].points)}));
    } else sc.append(el('span','note','—'));
    tr.append(sc);

    const hc=el('td','r');
    const hv=host? host[SLEEPER_STAT[r.stat]] : undefined;
    if(hv==null) hc.append(el('span','note', host? '—' : ''));
    else{
      const sp=el('span','num', String(hv));
      // A disagreement is the whole reason both columns are here.
      if(r.tiers.length===1 && Number(hv)!==Number(r.tiers[0].points)) sp.style.color='var(--warn)';
      hc.append(sp);
    }
    tr.append(hc);

    const oc=el('td','r');
    if(r.tiers.length>1) oc.append(el('span','note','banded'));
    else oc.append(numInput(over[r.stat], v=>{
      const next={...over}; if(v==null) delete next[r.stat]; else next[r.stat]=v;
      edits.set(l.key,{scoring:next}); render();
    }, {placeholder: r.tiers[0]? String(r.tiers[0].points) : (hv!=null? String(hv) : '')}));
    tr.append(oc);
    return tr;
  };

  const all=[...rules, ...extra].sort((a,b)=>String(a.stat).localeCompare(String(b.stat)));
  const body=table(
    [{label:'Stat'},{label:'MyPlaybook',r:1},{label:l.host+' direct',r:1},{label:'Yours',r:1}],
    all.map(rowFor));

  const notes=[];
  if(sys) notes.push('Format: '+(sys.format||'—')+(sys.custom? ' · custom scoring on' : ''));
  if(extra.length) notes.push(extra.length+' stat(s) the '+l.host+' table has and the MyPlaybook read does not.');
  notes.push('Per-player points elsewhere in this app come from the host’s own scoring, not from this table — this is the reference, and the place to record what the scrape got wrong.');
  const wrap=el('div');
  wrap.append(body);
  const nb=el('div','pbody');
  notes.forEach(n=> nb.append(Object.assign(el('p','note'),{textContent:n})));
  wrap.append(nb);
  return panel('Scoring', sys? (sys.basic||sys.format||null) : l.host, wrap);
}

  }
  out.push(panel('Playoffs', pf.rule? null : 'not configured — Standings will not show a bracket', pb));

  /* --- waivers -------------------------------------------------------- */
  const wv=o.waivers||{};
  const wb=el('div','pbody');
  const wg=el('div','fgrid');
  wg.append(field('Waiver type',
    selectInput([{value:null,label:l.waiverType? 'Host: '+l.waiverType : '— not set —'},
      {value:'rolling',label:'Rolling list'},{value:'faab',label:'FAAB'},{value:'reverse',label:'Reverse standings'},{value:'none',label:'No waivers'}],
      wv.type, v=>{ edits.set(l.key,{waivers:{type:v}}); render(); })));
  wg.append(field('Claim period (days)',
    numInput(wv.claimDays, v=>{ edits.set(l.key,{waivers:{claimDays:v}}); render(); }, {min:0,max:7,placeholder:'2'}),
    'How long a dropped player sits before clearing to free agency.'));
  wg.append(field('Claims process on',
    selectInput([{value:null,label:'—'},...['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'].map((d,i)=>({value:i,label:d}))],
      wv.processDay, v=>{ edits.set(l.key,{waivers:{processDay: v==null?null:Number(v)}}); render(); }),
    'Used to say when a player clears.'));
  wg.append(field('at hour',
    numInput(wv.processHour, v=>{ edits.set(l.key,{waivers:{processHour:v}}); render(); }, {min:0,max:23,placeholder:'3'}),
    '24h, your local time.'));
  wb.append(wg);
  if(wv.processDay!=null){
    const d=el('p','note'); d.style.marginTop='10px';
    d.textContent='→ '+describeWaivers(wv);
    wb.append(d);
  }
  out.push(panel('Waivers', null, wb));

  /* --- scoring -------------------------------------------------------- */
  out.push(scoringPanel(l, o));
  return out;
}

/** Plain-English restatement of the configured seeding rule. */
function describeSeedRule(c){
  const tb=(DATA.rules.tiebreak[c.tiebreak]||'Points for').toLowerCase();
  const n=c.playoffTeams ?? '?';
  if(c.rule==='record') return 'Seeds 1–'+n+' by record, ties broken by '+tb+'.';
  if(c.rule==='division-first') return 'Top '+(c.divisionSeeds ?? 2)+' seeds are division winners; the rest by record, ties broken by '+tb+'.';
  if(c.rule==='points-wildcard') return 'Seeds 1–'+(Number(n)-(c.wildcards ?? 1))+' by record; the final '+(c.wildcards ?? 1)+' by most points for among everyone who missed.';
  return '';
}
const DAYS=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
function describeWaivers(w){
  const hr=w.processHour!=null? ' at '+(w.processHour%12||12)+(w.processHour<12?'am':'pm') : '';
  return 'Claims process '+DAYS[w.processDay]+hr+(w.claimDays!=null? '; dropped players sit '+w.claimDays+' day(s) before clearing.' : '.');
}

/**
 * Save every league's local edits straight to data/league-overrides.json,
 * for everyone under `node src/cli.js serve` — no file to download, no
 * `league:import` to remember. Only works when the dashboard is actually
 * being served (fetch to a relative /api/ path 404s or errors outright on a
 * file:// page), so a failure here falls back to telling the user to use
 * Export instead rather than pretending it worked.
 */
async function saveEditsToServer(btn){
  const body={ leagues: edits.all() };
  const n=Object.keys(body.leagues).length;
  if(!n){ alert('No local edits to save.'); return; }
  const prev=btn.textContent; btn.disabled=true; btn.textContent='Saving…';
  try{
    const res=await fetch('/api/overrides',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
    const r=await res.json().catch(()=>null);
    if(!res.ok || !r || !r.ok) throw new Error((r&&r.message)||('HTTP '+res.status));
    edits.clearAll();
    location.reload();
  }catch(e){
    alert('Could not save to the server — is `node src/cli.js serve` running, and is this page open from http://localhost (not a downloaded file)?\n\n'+e.message+'\n\nUse Export edits instead if you’re running the dashboard as a static file.');
  }finally{
    btn.disabled=false; btn.textContent=prev;
  }
}

/**
 * Write the local edits out as the file `league:import` reads.
 *
 * A download is the only way off a page with no server. Anchor downloads are
 * blocked in some embedded viewers, so the JSON is also dropped into a
 * selectable box — a copy-paste always works.
 */
function exportEdits(){
  const body={ exportedAt:new Date().toISOString(), leagues: edits.all() };
  const json=JSON.stringify(body,null,2);
  const n=Object.keys(body.leagues).length;
  if(!n){ alert('No local edits to export.'); return; }
  try{
    const url=URL.createObjectURL(new Blob([json],{type:'application/json'}));
    const a=el('a'); a.href=url; a.download='league-overrides.patch.json';
    document.body.append(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),1000);
  }catch{ /* download blocked; the box below still works */ }
  const dlg=el('div','exportbox');
  dlg.append(el('h3',null,'Edits for '+n+' league(s)'));
  dlg.append(Object.assign(el('p','note'),{textContent:'Save as league-overrides.patch.json, then: node src/cli.js league:import league-overrides.patch.json'}));
  const ta=el('textarea'); ta.value=json; ta.readOnly=true; ta.rows=14;
  dlg.append(ta);
  const close=el('button','iconbtn','Close'); close.type='button'; close.onclick=()=>dlg.remove();
  dlg.append(close);
  $('#page').prepend(dlg);
  ta.focus(); ta.select();
}

/**
 * Turns sync commands into buttons — only works when the dashboard is
 * actually being served (`node src/cli.js serve`), not opened as a static
 * file: relative fetch()es to /api/ have nowhere to go otherwise. The page
 * renders a loading state synchronously (render() has no async contract)
 * and fills itself in once /api/steps answers or fails.
 */
async function apiJson(path, opts){
  let res;
  try{ res=await fetch(path, opts); }
  catch{ throw new Error('No server answered at '+path+' — run `node src/cli.js serve` and open this page from http://localhost, not a downloaded file.'); }
  const body=await res.json().catch(()=>null);
  if(!res.ok) throw new Error((body&&(body.error||body.message))||('HTTP '+res.status));
  return body;
}
function pageSync(){
  const out=[];
  const h=el('div','head');
  h.append(el('h1',null,'Sync'));
  h.append(el('p',null,'Buttons here run the same commands as the CLI, against this machine’s own data — not a hosted service. Needs `node src/cli.js serve` running; opened as a downloaded file, nothing here can do anything.'));
  out.push(h);

  const body=el('div');
  const status=el('div','note'); status.textContent='Checking for a running server…';
  body.append(status);
  const results=el('div');

  function showResults(title, rows){
    results.innerHTML='';
    const box=el('div','exportbox');
    box.append(el('h3',null,title));
    if(rows && rows.length){
      const trs=rows.map(r=>{
        const tr=el('tr');
        tr.append(el('td',null,r.label||r.name||''));
        const okish = r.status==='ok'||r.status==='fresh';
        tr.append(el('td', okish?null:'r', r.status||''));
        tr.append(el('td',null, r.seconds!=null? r.seconds+'s' : (r.error||r.reason||'')));
        return tr;
      });
      box.append(table([{label:'Step'},{label:'Status'},{label:'Detail'}], trs));
    } else {
      box.append(el('p','note','Done.'));
    }
    results.append(box);
  }
  function showError(msg){
    results.innerHTML='';
    results.append(Object.assign(el('div','note'),{textContent:msg}));
  }
  function actionBtn(label, run){
    const b=el('button','iconbtn',label); b.type='button';
    b.onclick=async()=>{
      const prev=b.textContent; b.disabled=true; b.textContent='Running…';
      try{ await run(); }
      catch(e){ showError(e.message); }
      finally{ b.disabled=false; b.textContent=prev; }
    };
    return b;
  }
  const post=(path, payload)=> apiJson(path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload||{})});

  (async()=>{
    let steps;
    try{ steps=(await apiJson('/api/steps')).steps; }
    catch(e){ status.textContent=e.message; return; }
    status.remove();

    const presets=el('div','toggles');
    presets.append(actionBtn('Sync (skip what’s fresh)', async()=>{
      const r=await post('/api/sync',{}); showResults('Sync', r.results);
    }));
    presets.append(actionBtn('Force full sync', async()=>{
      const r=await post('/api/sync',{force:true}); showResults('Force full sync', r.results);
    }));
    presets.append(actionBtn('Live sources only', async()=>{
      const r=await post('/api/sync',{only:'trend,buzz,matchups,sleeper-proj,draftsharks'});
      showResults('Live sources', r.results);
    }));
    presets.append(actionBtn('Yahoo weekly projections', async()=>{
      const r=await post('/api/yahoo-sync',{});
      if(r.blocked) return showError(r.message);
      showResults('Yahoo weekly', [{label:'yahoo', status:'ok'}]);
    }));
    body.append(presets);
    body.append(Object.assign(el('p','note'),{textContent:'Yahoo can get blocked (HTTP 999, its own bot-mitigation) — that shows here rather than failing silently. The browser-console fallback (`yahoo:script` / `yahoo:ingest`) still needs the terminal; there is no button for a step that runs in someone else’s tab.'}));

    const grid=el('div','strip');
    grid.append(...steps.map(s=> actionBtn(s.label, async()=>{
      const r=await post('/api/sync',{only:s.name, force:true});
      showResults(s.label, r.results);
    })));
    body.append(grid);
    body.append(results);
    body.append(Object.assign(el('p','note'),{textContent:'A run rebuilds dist/dashboard.html on the server. Reload the page to see the new data on every other tab, not just the result table above.'}));
  })();

  out.push(panel('Actions', null, body));
  out.push(freshnessPanel());
  return out;
}

/* ---------- league analysis ----------
 *
 * FantasyPros valuing EVERY roster in the league (see src/leagueanalysis.js). It
 * is the one league-specific valuation of other managers' players, so it answers
 * questions the boards cannot: who is strong where, and what is my weakest spot
 * measured against the people I actually play.
 *
 * Two periods: `ros` scores the whole roster (bench depth counts over a season),
 * `week` scores the starters only. The sync checks that each team's score is the
 * sum of its players' values and this page says so when it is not.
 */
let anPeriod = store.get('gd.an.period','ros')==='week' ? 'week' : 'ros';
let anMetric = store.get('gd.an.metric','vorp')==='value' ? 'value' : 'vorp';
const AN_PERIODS = {ros:'Rest of season', week:'This week'};
const anSigned = (v,d)=> v==null? '—' : (v>0?'+':(v<0?'−':''))+Math.abs(v).toFixed(d==null?1:d);
const shortName = (n,pos)=>{
  if(!n) return '—';
  const w=String(n).trim().split(/\s+/);
  if(String(pos||'').toUpperCase()==='DST' || w.length<2) return w[w.length-1];
  return w[0][0]+'. '+w.slice(1).join(' ');
};
const tierChip = t=> el('span','tierchip t'+(t==null?'x':t), t==null? '—' : 'Tier '+t);
/** A slot label as the position chip's colour key: RB1 -> RB, FLX -> FLEX, SFLX -> SF. */
const slotKey = sl=>{ const k=String(sl||'').toUpperCase().replace(/\d+$/,''); return k==='FLX'? 'FLEX' : (k==='SFLX'? 'SF' : k); };

function pageAnalysis(){
  const l=L(), out=[];
  const head=el('div','head');
  head.append(el('h1',null,'League Analysis'));
  head.append(el('p',null,'FantasyPros values every roster in '+leagueLabel(l)+' against a replacement level, under this league’s own scoring and lineup slots — so you can see who is strong where, not just who is ranked high.'));
  out.push(head);

  const A=l.analysis;
  if(!A){
    out.push(panel('League analysis',null,emptyState('Not synced yet','Run `npm run scrape` — MyPlaybook serves this for every league on the account, ESPN, Yahoo and Sleeper alike.')));
    return out;
  }

  const bar=el('div','toggles');
  bar.append(segmented(Object.keys(AN_PERIODS).map(k=>({label:AN_PERIODS[k],value:k})), anPeriod, v=>{ anPeriod=v; store.set('gd.an.period',v); render(); }));
  bar.append(segmented([{label:'Points over replacement',value:'vorp'},{label:'Trade value',value:'value'}], anMetric, v=>{ anMetric=v; store.set('gd.an.metric',v); render(); }));
  out.push(bar);

  const P=A[anPeriod];
  if(!P){
    out.push(panel(AN_PERIODS[anPeriod],null,emptyState('No '+AN_PERIODS[anPeriod].toLowerCase()+' analysis','FantasyPros did not return this period on the last sync. Run `npm run scrape` again.')));
    return out;
  }

  const uni=universe(scoringKey(l));
  const ltOf=id=> l.teams.find(t=>String(t.id)===String(id)) || null;
  const nameOf=a=>{ const t=ltOf(a.teamId); return t? teamLabel(l,t) : (a.name||('Team '+a.teamId)); };
  const N=P.teams.length;
  const mine=P.teams.find(t=>{ const lt=ltOf(t.teamId); return (lt&&lt.mine) || t.isMine; }) || P.teams.find(t=>t.isMine) || null;
  const me=P.me;

  // ---- the read at a glance

  if(mine){
    strip.append(statTile(P.basis==='roster'?'Roster strength':'Starter strength','#'+mine.rank+' of '+N,
      'Tier '+mine.tier+' · '+anSigned(mine.vorpPct-100)+'% vs league mean','consensus'));
  }

  if(me&&me.benchOnly) strip.append(statTile('Bench','#'+me.benchOnly.rank+' of '+N,'Tier '+me.benchOnly.tier));
  const weak=me&&me.tradeNeeds&&me.tradeNeeds[0];
  if(weak) strip.append(statTile('Weakest spot',weak.position,'#'+weak.rank+' of '+N+' at the position','market'));
  out.push(strip);

  const note=el('div','note');
  note.append(document.createTextNode(P.basis==='roster'
    ? 'Team scores add up every rostered player’s points over replacement, bench included — depth counts over a season. '
    : 'Team scores add up the starters’ points over replacement only — a benched player scores nothing this week. '));
  note.append(P.ok
    ? el('span','pill ok','scores match the player values')
    : Object.assign(el('span','pill out','scores do not match'),{title:'Each team’s score should equal the sum of its players’ values; here it is off by up to '+P.drift+'. FantasyPros may have changed what these numbers mean — treat the ranking as unverified.'}));
  if(A.asOf) note.append(el('span','wk',' · synced '+new Date(A.asOf).toLocaleString()));
  out.push(note);

  // ---- team strength
  const rows=P.teams.map(a=>{
    const lt=ltOf(a.teamId), isMine=(lt&&lt.mine)||a.isMine;
    const tr=el('tr', isMine?'mine':null);
    tr.append(Object.assign(el('td','num'),{textContent:String(a.rank)}));
    const tc=el('td'); const w=el('div','pl'); w.append(teamAvatar(lt&&lt.logo));
    const nm=el('div','nm'); nm.append(el('b',null,nameOf(a))); w.append(nm); tc.append(w); tr.append(tc);
    const ti=el('td'); ti.append(tierChip(a.tier)); tr.append(ti);
    const sb=el('td'); const bx=el('div','sbar t'+a.tier); const fi=el('i'); fi.style.width=Math.max(4,a.index)+'%'; bx.append(fi); sb.append(bx); tr.append(sb);
    tr.append(Object.assign(el('td','r num'),{textContent:fmt(a.score,0)}));

    const dc=el('td','r'); dc.append(el('span','delta '+(dv>0?'up':dv<0?'dn':'flat'), dv==null?'—':anSigned(dv)+'%')); tr.append(dc);

  out.push(panel('Team strength', AN_PERIODS[anPeriod]+' · '+N+' teams',

  if(me){

      row.append(el('span','pr1 num','#'+r.rank+' of '+N));

    if(me.startersOnly) add('Starters',me.startersOnly,true);

    cols.append(panel('Your team by position', 'rank among '+N+' teams', list));

    const lrows=(me.lineup||[]).map(x=>{
      const tr=el('tr');

      sc.firstChild.setAttribute('data-p',slotKey(x.slot)); tr.append(sc);
      const pr=uni.get(Number(x.fpId));
      if(pr) tr.append(playerCell2(pr)); else tr.append(Object.assign(el('td'),{textContent:x.name||'—'}));
      tr.append(Object.assign(el('td','r num'),{textContent:'#'+x.rank}));
      const ti=el('td'); ti.append(tierChip(x.tier)); tr.append(ti);
      return tr;
    });
    cols.append(panel('Your lineup, slot by slot','FantasyPros’ optimal lineup',
      lrows.length? table([{label:'Slot'},{label:'Player'},{label:'League rank',r:1},{label:'Tier'}], lrows) : emptyState('No lineup','')));
    out.push(cols);
  }

  out.push(analysisGrid(l,P,uni,nameOf,ltOf));
  return out;
}

/**
 * Every team's roster, one column per team, one row per lineup slot.
 *
 * Each cell is shaded against the rest of ITS row, so a strong quarterback
 * reads as strong next to other quarterbacks and a weak bench reads as weak
 * next to other benches. Where a slot appears twice (RB, RB) the better player
 * goes first: the payload keys players by id and drops the grid's own order.
 */
function analysisGrid(l,P,uni,nameOf,ltOf){
  const key = anMetric==='value'? 'value' : 'vorp';
  const byTeam=new Map();
  Object.entries(P.players).forEach(([id,p])=>{
    const k=String(p.tid); if(!byTeam.has(k)) byTeam.set(k,[]);
    byTeam.get(k).push(Object.assign({id:Number(id)},p));
  });
  const slotList=(tid,slot)=> (byTeam.get(String(tid))||[]).filter(p=>p.slot===slot).sort((a,b)=>(b[key]??-1e9)-(a[key]??-1e9));

  const t=el('table','agrid');
  const thead=el('thead'), hr=el('tr');
  hr.append(el('th','slot','Slot'));
  P.teams.forEach(a=>{
    const lt=ltOf(a.teamId), isMine=(lt&&lt.mine)||a.isMine;
    const th=el('th','ghead'+(isMine?' mineh':''));
    const w=el('div','gth'); w.append(teamAvatar(lt&&lt.logo));
    const tx=el('div','gtx'); tx.append(el('b',null,nameOf(a))); tx.append(el('span',null,'#'+a.rank+' · Tier '+a.tier)); w.append(tx);
    th.append(w); hr.append(th);
  });
  thead.append(hr); t.append(thead);

  const tb=el('tbody'), seen={};
  P.slots.forEach(slot=>{
    const k=seen[slot]=(seen[slot]??-1)+1;
    const cells=P.teams.map(a=> slotList(a.teamId,slot)[k] || null);
    const vals=cells.filter(Boolean).map(c=>c[key]).filter(v=>v!=null);
    const lo=Math.min(...vals), hi=Math.max(...vals), span=hi-lo;
    const tr=el('tr');
    const sc=el('td','slot'); const chip=el('span','pos slot',slot==='BN'?'BN':slot); chip.setAttribute('data-p',slotKey(slot)); sc.append(chip); tr.append(sc);
    cells.forEach((c,i)=>{
      const a=P.teams[i], lt=ltOf(a.teamId), isMine=(lt&&lt.mine)||a.isMine;
      const td=el('td','gcell'+(isMine?' mine':''));
      if(c){
        const pr=uni.get(c.id);
        const h=span>0 && c[key]!=null ? (c[key]-lo)/span : 0.5;
        td.style.background='color-mix(in srgb, var(--consensus) '+Math.round(5+h*34)+'%, var(--surface))';
        td.append(Object.assign(el('div','gn'),{textContent:shortName(pr&&pr.n,pr&&pr.p)}));
        const gs=el('div','gs');
        gs.append(el('b',null,c[key]==null?'—':(key==='vorp'? Math.round(c[key]) : c[key].toFixed(1))));
        gs.append(el('span',null,(pr&&pr.p||'')+(c.pRank!=null? c.pRank : '')));
        td.append(gs);
        td.title=(pr&&pr.n||'fpId '+c.id)+' — '+(c.vorp!=null? Math.round(c.vorp)+' pts over replacement' : '')+(c.value!=null? ' · trade value '+c.value : '')+(c.oRank!=null? ' · #'+c.oRank+' overall' : '');
      } else td.append(el('span','delta flat','—'));
      tr.append(td);
    });
    tb.append(tr);
  });
  const fr=el('tr','totrow'); fr.append(el('td','slot','Score'));
  P.teams.forEach(a=>{
    const v = key==='vorp'? a.score : (byTeam.get(String(a.teamId))||[]).filter(p=>P.basis==='roster'||p.slot!=='BN').reduce((s,p)=>s+(p.value||0),0);
    fr.append(Object.assign(el('td','r num'),{textContent: key==='vorp'? fmt(v,0) : fmt(v,1)}));
  });
  tb.append(fr); t.append(tb);

  const wrap=el('div','scroll'); wrap.append(t);
  return panel('Every roster, slot by slot',
    (key==='vorp'? 'points over replacement' : 'trade value')+' · shaded against the rest of the row',
    wrap);
}

/* ---------- trade market ----------
   FantasyPros' trade market as its own page: what managers actually pay for a
   player, which way that price moved, and who else costs the same. The value
   is a price on a ~1000 scale, not a projection, so nothing here feeds the
   consensus. Every player comes from the same pool as the Players page, so a
   card's headshot, badge and team are the ones used everywhere else. */

let tradePos   = store.get('gd.tradePos','ALL');
let tradeSort  = store.get('gd.tradeSort','value');
let tradeQuery = '';
let tradeMine  = false;
let tradeAll   = false;
const TRADE_ROWS = 75;
let tradeGrad  = 0;

const svgEl=(tag, attrs, parent)=>{
  const n=document.createElementNS(SVGNS,tag);
  Object.entries(attrs||{}).forEach(([k,v])=> n.setAttribute(k,v));
  if(parent) parent.append(n);
  return n;
};
/** "Bhayshul Tuten" -> "B. Tuten", the way the similar-value cards label a player. */
const tmShortName = n=>{ const s=String(n||'').trim(), i=s.indexOf(' '); return i<0? s : s[0]+'. '+s.slice(i+1); };
const dayLabel = d=> new Date(d+'T00:00:00Z').toLocaleDateString('en-US',{month:'short',day:'numeric',timeZone:'UTC'});
const dayShort = d=> { const m=String(d).match(/^\d{4}-(\d{2})-(\d{2})$/); return m? (+m[1])+'/'+(+m[2]) : String(d); };
const dirOf = d=> d>0? 'up' : d<0? 'dn' : 'flat';

/**
 * A smooth line through the points. Catmull-Rom converted to cubic segments, with
 * every control point held inside [lo,hi] so a sharp turn cannot overshoot the
 * plot and draw a value the series never had.
 */
function smoothPath(pts, lo, hi){
  if(pts.length<2) return '';
  const cl=y=> Math.max(lo,Math.min(hi,y));
  let d='M'+pts[0][0].toFixed(1)+' '+pts[0][1].toFixed(1);
  for(let i=0;i<pts.length-1;i++){
    const p0=pts[i-1]||pts[i], p1=pts[i], p2=pts[i+1], p3=pts[i+2]||p2;
    const c1=[p1[0]+(p2[0]-p0[0])/6, cl(p1[1]+(p2[1]-p0[1])/6)];
    const c2=[p2[0]-(p3[0]-p1[0])/6, cl(p2[1]-(p3[1]-p1[1])/6)];
    d+=' C'+c1[0].toFixed(1)+' '+c1[1].toFixed(1)+' '+c2[0].toFixed(1)+' '+c2[1].toFixed(1)+' '+p2[0].toFixed(1)+' '+p2[1].toFixed(1);
  }
  return d;
}
/** Adds the gradient the area under a line fades through; returns its id. */
function areaGradient(svg){
  const id='tmg'+(++tradeGrad);
  const defs=svgEl('defs',null,svg), g=svgEl('linearGradient',{id, x1:'0', y1:'0', x2:'0', y2:'1'},defs);
  svgEl('stop',{offset:'0','stop-color':'currentColor','stop-opacity':'.20'},g);
  svgEl('stop',{offset:'1','stop-color':'currentColor','stop-opacity':'0'},g);
  return id;
}

/** The small filled trend line used in the table and on the cards. */
function areaSpark(vals, W, H){
  const pts=vals.map((v,i)=>[i,v]).filter(x=>x[1]!=null);
  const svg=svgEl('svg',{viewBox:'0 0 '+W+' '+H, width:W, height:H, 'aria-hidden':'true'});
  svg.setAttribute('class','areaspark');
  if(pts.length<2) return svg;
  const lo=Math.min(...pts.map(x=>x[1])), hi=Math.max(...pts.map(x=>x[1])), span=hi-lo;
  const padY=3, X=i=> (vals.length>1? i/(vals.length-1) : 0)*W;
  const Y=v=> span===0? H/2 : H-padY-((v-lo)/span)*(H-2*padY);
  const xy=pts.map(x=>[X(x[0]),Y(x[1])]);
  const id=areaGradient(svg);
  const line=smoothPath(xy,padY,H-padY);
  svgEl('path',{d:line+' L'+xy[xy.length-1][0].toFixed(1)+' '+H+' L'+xy[0][0].toFixed(1)+' '+H+' Z', fill:'url(#'+id+')'},svg);
  svgEl('path',{d:line, class:'ln'},svg);
  svg.setAttribute('class','areaspark '+dirOf(pts[pts.length-1][1]-pts[0][1]));
  return svg;
}

/**
 * Market Value History: a smooth line over dashed gridlines with a faded fill,
 * a dot on the latest day, and a tooltip that follows the pointer to the nearest
 * day. It draws exactly the days the payload carries; the y range is padded out
 * to round ticks so the line never touches the frame.
 */
function tmChart(p){
  const dates=tradeDates(), vals=p.tm.s||[];
  const pts=vals.map((v,i)=>[i,v]).filter(x=>x[1]!=null);
  const wrap=el('div','tmplot');
  if(pts.length<2){ wrap.append(el('p','note','Fewer than two days of history for him.')); return wrap; }
  const W=1000, H=290, pl=54, pr=18, pt=18, pb=36;
  const lo=Math.min(...pts.map(x=>x[1])), hi=Math.max(...pts.map(x=>x[1]));
  // Never finer than 5 a tick: a series that barely moves should read as barely
  // moving, not as a staircase of 1-point gridlines.
  const raw=Math.max(5,(hi-lo)/4);
  const step=[5,10,25,50,100,250].find(x=>x>=raw) || 500;
  let t0=Math.floor(lo/step)*step, t1=Math.ceil(hi/step)*step;
  // A flat (or near-flat) line is centred in the plot rather than pinned to an edge.
  if(t1-t0<2*step){ t0-=step; t1+=step; }
  const n=vals.length;
  const X=i=> pl+(n>1? i/(n-1) : 0)*(W-pl-pr);
  const Y=v=> pt+(1-(v-t0)/(t1-t0))*(H-pt-pb);
  const base=H-pb;
  const dir=dirOf(pts[pts.length-1][1]-pts[0][1]);
  wrap.classList.add(dir);

  const svg=svgEl('svg',{viewBox:'0 0 '+W+' '+H, role:'img',
    'aria-label':'Market value history: '+pts[0][1]+' on '+dayLabel(dates[pts[0][0]]||'')+' to '+pts[pts.length-1][1]+' on '+dayLabel(dates[pts[pts.length-1][0]]||'')});
  const id=areaGradient(svg);
  for(let v=t0; v<=t1; v+=step){
    svgEl('line',{x1:pl, x2:W-pr, y1:Y(v).toFixed(1), y2:Y(v).toFixed(1), class: v===t0? 'axis' : 'grid'},svg);
    const tx=svgEl('text',{x:pl-12, y:(Y(v)+4).toFixed(1), 'text-anchor':'end'},svg); tx.textContent=String(v);
  }
  for(let i=n-1;i>=0;i-=2){
    const tx=svgEl('text',{x:X(i).toFixed(1), y:H-10, 'text-anchor':'middle'},svg); tx.textContent=dayShort(dates[i]||'');
  }
  const xy=pts.map(x=>[X(x[0]),Y(x[1])]);
  const line=smoothPath(xy,pt,base);
  svgEl('path',{d:line+' L'+xy[xy.length-1][0].toFixed(1)+' '+base+' L'+xy[0][0].toFixed(1)+' '+base+' Z', fill:'url(#'+id+')'},svg);
  svgEl('path',{d:line, class:'ln'},svg);
  const last=xy[xy.length-1];
  const halo=svgEl('circle',{class:'halo', r:'11', cx:last[0].toFixed(1), cy:last[1].toFixed(1), visibility:'hidden'},svg);
  svgEl('circle',{class:'dot', r:'4.5', cx:last[0].toFixed(1), cy:last[1].toFixed(1)},svg);
  const mark=svgEl('circle',{class:'dot', r:'4.5', visibility:'hidden'},svg);
  wrap.append(svg);

  const tip=el('div','tmtip'); tip.hidden=true;
  const tipD=el('small'), tipV=el('b'), tipN=el('small');
  tip.append(tipD,tipV,tipN); wrap.append(tip);
  const show=ev=>{
    const r=svg.getBoundingClientRect(); if(!r.width) return;
    const x=(ev.clientX-r.left)/r.width*W;
    let best=pts[0], bd=Infinity;
    pts.forEach(q=>{ const d=Math.abs(X(q[0])-x); if(d<bd){ bd=d; best=q; } });
    const cx=X(best[0]), cy=Y(best[1]);
    mark.setAttribute('cx',cx.toFixed(1)); mark.setAttribute('cy',cy.toFixed(1));
    halo.setAttribute('cx',cx.toFixed(1)); halo.setAttribute('cy',cy.toFixed(1));
    mark.setAttribute('visibility','visible'); halo.setAttribute('visibility','visible');
    tipD.textContent=dayLabel(dates[best[0]]||''); tipV.textContent=String(best[1]);
    const tn=p.tm.n && p.tm.n[best[0]];
    tipN.textContent = tn!=null? tn+(tn===1?' trade':' trades') : '';
    tipN.hidden = tn==null;
    tip.style.left=(cx/W*r.width+10)+'px';
    tip.style.top=(cy/H*r.height+12)+'px';
    tip.hidden=false;
  };
  const hide=()=>{ tip.hidden=true; mark.setAttribute('visibility','hidden'); halo.setAttribute('visibility','hidden'); };
  svg.addEventListener('pointermove',show);
  svg.addEventListener('pointerdown',show);
  svg.addEventListener('pointerleave',hide);
  return wrap;
}

function pageTrade(){
  const l=L(), out=[];
  const h=el('div','head');
  h.append(el('h1',null,'Trade Market'));
  h.append(el('p',null,'What managers actually pay for each player on FantasyPros’ trade analyzer, on a scale where the most valued player is about 1000. Open a player for his price history and the players priced closest to him. Priced in this league’s scoring format.'));
  out.push(h);

  const meta=(DATA.trade||{})[scoringKey(l)];
  const pool=(DATA.pools[scoringKey(l)]||[]).filter(p=>p.tm && p.tm.v!=null);
  if(!pool.length){ out.push(panel('Trade Market', null, emptyState('No trade market data','Run `npm run trade:sync`, then rebuild the dashboard.'))); return out; }

  const filterPanel=el('div','panel'), body=el('div','pfilter'), line=el('div','prowbar');
  const q=el('input','psearch'); q.type='search'; q.placeholder='Search players…'; q.value=tradeQuery;
  q.addEventListener('input',()=>{ tradeQuery=q.value.trim().toLowerCase(); buildRows(); });
  line.append(q);
  line.append(segmented([{label:'Highest value',value:'value'},{label:'Rising',value:'up'},{label:'Falling',value:'dn'}], tradeSort, v=>{
    tradeSort=v; store.set('gd.tradeSort',v); render();
  }));
  const mine=el('button','iconbtn'+(tradeMine?' watchon':''),'My Team'); mine.type='button';
  mine.setAttribute('aria-pressed',String(tradeMine)); mine.title='Only players on your roster in this league';
  mine.onclick=()=>{ tradeMine=!tradeMine; tradeAll=false; render(); };
  line.append(mine);
  body.append(line);
  const chips=el('div','fgroup'); chips.append(el('span','ftitle','Position'));
  ['ALL','QB','RB','WR','TE'].forEach(pos=>{
    const on = pos==='ALL'? tradePos==='ALL' : tradePos===pos;
    const b=el('button','fchip'+(on?' on':''), pos==='ALL'?'All':pos); b.type='button';
    b.setAttribute('aria-pressed',String(on));
    if(pos!=='ALL'){ b.setAttribute('data-p',pos); b.style.setProperty('--p','var('+(POS_VAR[pos]||'--p-flex')+')'); }
    b.onclick=()=>{ tradePos=pos; tradeAll=false; store.set('gd.tradePos',pos); render(); };
    chips.append(b);
  });
  body.append(chips);
  filterPanel.append(body); out.push(filterPanel);

  const LISTBOX=panel('Market values', meta&&meta.sourceAt? 'FantasyPros as of '+new Date(meta.sourceAt).toLocaleString([], {month:'short',day:'numeric',hour:'numeric',minute:'2-digit'}) : null, null);
  out.push(LISTBOX);

  const move=p=>{ const v=p.tm.s? p.tm.s.filter(x=>x!=null):[]; return v.length<2? null : v[v.length-1]-v[0]; };
  function buildRows(){
    let rows=pool.slice();
    if(tradePos!=='ALL') rows=rows.filter(p=>p.p===tradePos);
    if(tradeMine){ const t=myTeam(), ids=new Set(t? t.players.map(x=>x.i) : []); rows=rows.filter(p=>ids.has(p.i)); }
    if(tradeQuery) rows=rows.filter(p=> String(p.n||'').toLowerCase().includes(tradeQuery) || String(p.t||'').toLowerCase()===tradeQuery);
    if(tradeSort==='up') rows=rows.filter(p=>move(p)!=null).sort((a,b)=>move(b)-move(a));
    else if(tradeSort==='dn') rows=rows.filter(p=>move(p)!=null).sort((a,b)=>move(a)-move(b));
    else rows.sort((a,b)=>b.tm.v-a.tm.v);
    const shown = tradeAll? rows : rows.slice(0,TRADE_ROWS);

    const cols=[
      {label:'Player', w:250},
      {label:'Market', r:1, w:104, title:'What managers pay for him in trades, on a ~1000 scale'},
      {label:'Experts', r:1, w:104, title:'What FantasyPros’ experts would pay, where published'},
      {label:'Value gap', r:1, w:92, title:'Expert value minus market value'},
      {label:'Market history', r:1, w:150, title:'Market value over the window'},
      {label:'Trades L10D', r:1, w:120, title:'Trades that involved him, per day'},
      {label:'', r:1, w:110}
    ];
    const trs=shown.map(p=>{
      const tr=el('tr');
      tr.append(playerCell2(p), tmMarketCell(p), tmExpertCell(p), tmGapCell(p), tmHistCell(p), tmVolCell(p));
      const td=el('td','r'), bt=el('button','tmbtn','View Details'); bt.type='button';
      bt.setAttribute('aria-label','View details for '+(p.n||'player'));
      bt.onclick=()=> openPlayer(p.i,'trade');
      td.append(bt); tr.append(td);
      return tr;
    });
    const host=LISTBOX;
    Array.from(host.children).slice(1).forEach(n=>n.remove());
    if(!shown.length){ host.append(emptyState('Nobody matches','Loosen the position, search or roster filter.')); return; }
    host.append(table2(null,cols,trs));
    if(!tradeAll && rows.length>shown.length){
      const more=el('button','iconbtn','Show all '+rows.length+' players'); more.type='button';
      more.style.margin='12px 14px'; more.onclick=()=>{ tradeAll=true; buildRows(); };
      host.append(more);
    }
  }
  buildRows();
  return out;
}

/* ---------- player modal ----------
   Any player, anywhere: a name (or its cell) carrying `data-pid` opens this.
   Identity and the headline numbers stay fixed; tabs swap the body. Everything
   is read from the same rows the tables use, so a number here is the number in
   the table he was clicked from. */
let modalPid=null, modalTab='overview', modalFrom=null;
const MODAL_TABS=[['overview','Overview'],['proj','Projections'],['outlook','Outlook'],['trade','Trade market'],['buzz','Buzz']];
const poolIdx={key:null, map:null};
function playerById(id){
  const k=L().key+'|'+scoringKey(L());
  if(poolIdx.key!==k){ poolIdx.key=k; poolIdx.map=new Map((DATA.pools[scoringKey(L())]||[]).map(x=>[x.i,x])); }
  const hit=poolIdx.map.get(id);
  if(hit) return hit;
  for(const t of L().teams){ const f=t.players.find(x=>x.i===id); if(f) return f; }

function openPlayer(id, tab){

function mdProjections(p){
  const wkH=parseHz('w-'+DATA.week), rosH=parseHz('ros');
  const parts=new Map((consBreakdown(p,wkH)||[]).map(x=>[x.k,x]));
  const rangeOf=k=>{
    const r = k==='wwo'? p.wwo : k==='ds'? p.ds : k==='vg'? p.vdist : null;
    return r && r.floor!=null && r.ceiling!=null? fmt(r.floor)+'–'+fmt(r.ceiling) : null;
  };
  const cols=[{label:'Source'},{label:'Week '+DATA.week,r:1},{label:'Rest of season',r:1},{label:'Floor–ceiling',r:1},{label:'In consensus',r:1}];
  const rows=[];
  CONS_SRC.forEach(sr=>{
    const k=sr.k, w=srcValue(p,k,wkH).v, r=srcValue(p,k,rosH).v;
    if(w==null && r==null) return;
    const tr=el('tr');
    const nm=el('td'); nm.append(el('b',null,SOURCES[k].ab)); nm.append(document.createTextNode('  '+SOURCES[k].full.split(' —')[0])); tr.append(nm);
    tr.append(stackCell(fmt(w),null,{}), stackCell(fmt(r),null,{}));
    const rg=rangeOf(k); tr.append(rg? stackCell(rg,null,{}) : dashCell());
    const part=parts.get(k);
    tr.append(part? stackCell(part.why? 'left out' : (part.w>0? 'weight '+part.w : '—'), part.why||null, {}) : dashCell());
    rows.push(tr);
  });
  const cw=consFor(p,wkH), cr=consFor(p,rosH);
  const tot=el('tr','totrow');
  tot.append(el('td',null,'Consensus · '+consStore.active().name));
  tot.append(stackCell(fmt(cw&&cw.v),null,{big:1}), stackCell(fmt(cr&&cr.v),null,{big:1}), el('td','r'), el('td','r'));
  rows.push(tot);
  const out=[];
  out.push(rows.length>1? panel('Every source, this week and rest of season', null, table(cols,rows)) : panel('Projections', null, emptyState('No projections','No source has published a number for him.')));
  const vd=p.vdist;
  if(vd || p.rmin!=null){
    out.push(mdCard('Spread',[
      p.rmin!=null? ['FantasyPros expert ranks (week)', p.rmin===p.rmax? String(p.rmin) : p.rmin+'–'+p.rmax] : null,
      vd&&vd.floor!=null? ['Sportsbook floor / ceiling', fmt(vd.floor)+' / '+fmt(vd.ceiling)] : null,
      vd&&vd.boom!=null? ['Boom chance', Math.round(vd.boom*100)+'%'] : null,
      vd&&vd.bust!=null? ['Bust chance', Math.round(vd.bust*100)+'%'] : null
    ]));
  }
  return out;
}

function mdOutlook(p){
  const srcs=CONS_SRC.map(x=>x.k).filter(k=>{
    for(let w=DATA.week; w<=LAST_WEEK; w++) if(weekValue(p,k,w).v!=null) return true;
    return false;
  });
  const cols=[{label:'Wk'},{label:'Opp'},{label:'Consensus',r:1}].concat(srcs.map(k=>({label:SOURCES[k].ab,r:1,title:SOURCES[k].full})));
  const rows=[];
  for(let w=DATA.week; w<=LAST_WEEK; w++){
    const tr=el('tr', w===DATA.week? 'curwk' : null);
    tr.append(Object.assign(el('td','num'),{textContent:String(w)}));
    tr.append(Object.assign(el('td','num'),{textContent:oppLabel(p,w)}));
    const c=weekConsensus(p,w);
    tr.append(c.bye? stackCell('BYE',null,{}) : stackCell(fmt(c.v),null,{big:1}));
    srcs.forEach(k=>{ const v=weekValue(p,k,w); tr.append(v.bye? stackCell('BYE',null,{}) : stackCell(fmt(v.v),null,{})); });
    rows.push(tr);
  }
  return [panel('Week by week', 'consensus and each source that published the week', table(cols,rows)),
          el('p','pm-note','A blank is a week that source has not published. Sources that only publish a season total are not spread across weeks.')];
}

function mdTrade(p){
  if(!p.tm || p.tm.v==null) return [panel('Trade market', null, emptyState('Not priced', UNPRICED))];
  const pool=(DATA.pools[scoringKey(L())]||[]).filter(x=>x.tm && x.tm.v!=null);
  const st=el('div','tmstats');
  const stat=(k,v)=>{ const d=el('div','tmstat'); d.append(el('span','k',k), el('span','v',String(v))); return d; };
  st.append(stat('Market',p.tm.v));
  if(p.tm.xv!=null) st.append(stat('Experts',p.tm.xv));
  if(p.tm.x!=null) st.append(stat('Value gap',(p.tm.x>0?'+':'')+p.tm.x));
  if(p.tm.rk!=null) st.append(stat('Overall rank','#'+p.tm.rk));
  if(p.tm.pr!=null) st.append(stat('Position rank',(p.p||'')+p.tm.pr));
  const hist=el('section','tmsec');
  const hh=el('header'); hh.append(el('h2',null,'Market Value History'), el('span','spacer'));
  const n=tradeDates().length; if(n) hh.append(el('span','tmwin','Last '+n+' days'));
  hist.append(hh, tmChart(p));
  return [st, hist, tmSimilar(pool,p)];
}

function mdBuzz(p){
  const g=p.sig;
  if(!g) return [panel('Buzz', null, emptyState('Not on either board','Neither Sleeper nor Yahoo lists him among their fastest-moving players. That is not the same as zero.'))];
  const W=DATA.signals&&DATA.signals.windows? DATA.signals.windows : [6,24,72];
  const n=v=> v==null? null : rate(v);
  const grid=el('div','pm-grid');
  grid.append(mdCard('Sleeper',[
    ['Adds per hour (last '+W[0]+'h)', n(g.r)],
    ['Surge vs the window before', g.v!=null? (g.v>0?'+':'')+Number(g.v).toFixed(1)+'×' : null],
    ['Adds (last '+W[1]+'h)', n(g.a)],
    ['Drops (last '+W[1]+'h)', n(g.d)]
  ]));
  grid.append(mdCard('Yahoo'+(g.dt? ' · '+g.dt : ''),[
    ['Adds', n(g.ya)],
    ['Drops', n(g.yd)],
    ['Net', g.yn!=null? signed(g.yn) : null],
    ['Started in', g.ys!=null? Math.round(g.ys)+'% of leagues' : null],
    ['Rostered in', g.yr!=null? Math.round(g.yr)+'%'+(g.yrc? ' ('+(g.yrc>0?'+':'')+Number(g.yrc).toFixed(1)+' pts)' : '') : null]
  ]));
  const out=[grid];
  if(g.nt) out.push(el('p','pm-note','Yahoo note: '+g.nt));
  return out;
}

function renderModal(){
  const p=playerById(modalPid);
  if(!p){ closeModal(); return; }
  let back=document.getElementById('pmodal');
  const fresh=!back;
  if(fresh){
    back=el('div','pm-back'); back.id='pmodal';
    back.addEventListener('mousedown',e=>{ if(e.target===back) closeModal(); });
    document.body.append(back);
    document.body.style.overflow='hidden';
  }
  back.innerHTML='';
  const dlg=el('div','pm'); dlg.setAttribute('role','dialog'); dlg.setAttribute('aria-modal','true'); dlg.setAttribute('aria-labelledby','pm-title');
  back.append(dlg);

  const head=el('header','pm-head');
  head.append(avatarFor(p));
  const id=el('div','pm-id');
  const t=el('h2','pm-title',p.n||('fpId '+p.i)); t.id='pm-title';
  id.append(t, subLine(p));
  const own=rosterIndex(L()).get(p.i);
  const st=el('div','pm-status');
  if(own){ st.append(document.createTextNode('On '), el('b',null,own.name), document.createTextNode(own.mine? ' · your team' : '')); }
  else { st.append(el('b',null,'Free agent'), document.createTextNode(' in '+L().name)); }
  id.append(st);
  head.append(id);
  const acts=el('div','pm-acts');
  const star=el('button','pm-star'+(watch.has(String(p.i))?' on':''), watch.has(String(p.i))?'★':'☆'); star.type='button';
  star.setAttribute('aria-label','Toggle watch list'); star.title='Add to or remove from your watch list';
  star.onclick=()=>{ watch.toggle(String(p.i)); const on=watch.has(String(p.i)); star.classList.toggle('on',on); star.textContent=on?'★':'☆'; if(LIST) buildList(); };
  const x=el('button','pm-x'); x.type='button'; x.setAttribute('aria-label','Close');
  x.innerHTML='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>';
  x.onclick=closeModal;
  acts.append(star,x); head.append(acts);
  dlg.append(head);
  dlg.append(mdKpis(p));

  const tabs=el('div','pm-tabs'); tabs.setAttribute('role','tablist');
  MODAL_TABS.forEach(([k,label])=>{
    const b=el('button',null,label); b.type='button'; b.setAttribute('role','tab'); b.id='pm-tab-'+k;
    b.setAttribute('aria-selected',String(k===modalTab)); b.tabIndex=k===modalTab? 0 : -1;
    b.onclick=()=>{ modalTab=k; renderModal(); const nb=document.getElementById('pm-tab-'+k); if(nb) nb.focus(); };
    tabs.append(b);
  });
  tabs.addEventListener('keydown',e=>{
    if(e.key!=='ArrowRight' && e.key!=='ArrowLeft') return;
    const i=MODAL_TABS.findIndex(x=>x[0]===modalTab), n=MODAL_TABS.length;
    modalTab=MODAL_TABS[(i+(e.key==='ArrowRight'?1:n-1))%n][0];
    renderModal(); const nb=document.getElementById('pm-tab-'+modalTab); if(nb) nb.focus();
    e.preventDefault();
  });
  dlg.append(tabs);

  const body=el('div','pm-body'); body.setAttribute('role','tabpanel'); body.setAttribute('aria-labelledby','pm-tab-'+modalTab);
  const build={overview:mdOverview, proj:mdProjections, outlook:mdOutlook, trade:mdTrade, buzz:mdBuzz}[modalTab];
  build(p).forEach(n=> body.append(n));
  dlg.append(body);
  if(fresh) x.focus();
}

/* One listener for every player on every page: anything carrying data-pid opens
   his modal, unless the click landed on another control inside it. */
document.addEventListener('click',e=>{
  const hit=e.target.closest && e.target.closest('[data-pid]');
  if(!hit || hit.closest('.pm-back')) return;
  if(e.target.closest('button:not(.plink), a, input, select, label')) return;
  openPlayer(hit.dataset.pid);
});
document.addEventListener('keydown',e=>{
  if(modalPid==null) return;
  if(e.key==='Escape'){ e.preventDefault(); closeModal(); return; }
  if(e.key==='Tab'){
    const dlg=document.querySelector('#pmodal .pm'); if(!dlg) return;
    const f=Array.from(dlg.querySelectorAll('button,[href],input,select,[tabindex]:not([tabindex="-1"])')).filter(n=>!n.disabled && n.offsetParent!==null);
    if(!f.length) return;
    const first=f[0], last=f[f.length-1];
    if(e.shiftKey && document.activeElement===first){ e.preventDefault(); last.focus(); }
    else if(!e.shiftKey && document.activeElement===last){ e.preventDefault(); first.focus(); }
  }
});

const RENDER={leagues:pageLeagues,manage:pageManage,myteam:pageMyTeam,matchup:pageMatchup,standings:pageStandings,analysis:pageAnalysis,players:pagePlayers,trade:pageTrade,waivers:pageWaivers,sources:pageSources,moves:pageMoves,league:pageLeague,sync:pageSync};

function render(){
  const host=$('#page');
  host.innerHTML='';
  /* The Team/Roster popover is portalled onto <body> (see filterPopover), so
     tearing down #page doesn't remove it — clear any leftover copy before
     the next page (possibly a fresh one) builds its own. */
  document.querySelectorAll('body > .filterpop').forEach(n=> n.remove());
  const nodes=(RENDER[page]||pageMyTeam)();
  nodes.forEach(n=> host.append(n));
  window.scrollTo({top:0});
}
/* Close the Team/Roster popover on an outside click, Escape, or a page
   scroll (it's fixed to the viewport, so scrolling would otherwise leave it
   hanging over the wrong spot) — checked generically rather than wired
   per-page, since `render()` tears down and rebuilds the whole page and any
   page-specific handler would go with it. */
function closeFilterPop(){
  if(!filterPopOpen) return;
  filterPopOpen=false;
  const pop=document.querySelector('body > .filterpop');
  if(pop) pop.hidden=true;
  const btn=document.querySelector('.filterbar .filterbtn');
  if(btn) btn.setAttribute('aria-expanded','false');
}
addEventListener('click', closeFilterPop);
addEventListener('keydown', e=>{ if(e.key==='Escape') closeFilterPop(); });
addEventListener('scroll', closeFilterPop, true);
addEventListener('hashchange',()=>{
  const h=readHash();
  if(h.league){ const m=leagues.find(l=>l.key===h.league); if(m) current=m; }
  const hp = h.page==='edge' ? 'sources' : h.page;
  if(hp==='overview'||hp==='weeks'){ page='myteam'; teamTab=hp; }
  else if(hp && PAGES.some(p=>p.id===hp)) page=hp;
  if(h.tab && validTeamTab(h.tab)) teamTab=h.tab;
  if(h.hz) horizonKey=parseHz(h.hz).key;
  renderChrome(); render();
});
writeHash();
renderChrome();
render();
})();
</script>
