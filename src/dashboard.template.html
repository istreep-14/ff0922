/**
 * This week: what they have scored, over what they are on track to finish with.
 *
 * The projection is the point of the column during a live week — the score
 * alone says nothing about whether a team with four players left is ahead.
 * MyPlaybook's own figure is used, which already counts banked points plus the
 * remaining projections rather than re-projecting the whole roster.
 */
function weekCell(r){
  const td=el('td','r');
  if(!r.wkResult){ td.append(el('span','note','—')); return td; }
  const k=r.wkResult;
  const d=el('div','stack');
  const v=el('div','sv');
  v.textContent = k.pre && k.pts==null? '—' : num(k.pts);
  if(!k.bye && !k.pre){
    v.style.color = k.tie? 'var(--ink-2)' : (k.win? 'var(--good)' : 'var(--bad)');
    if(k.final) v.style.fontWeight='700';
  }
  d.append(v);
  const proj = k.proj==null? null : num(k.proj);
  const sub = k.bye ? (k.final? 'bye' : 'bye · proj '+(proj||'—'))
    : k.pre ? 'proj '+(proj||'—')
    : k.final ? (k.tie? 'tied' : (k.win? 'W ' : 'L ')+num(Math.abs(k.gap)))
    : 'proj '+(proj||'—')+' · '+(k.tie?'tied':(k.win?'up ':'down ')+num(Math.abs(k.gap)));
  d.append(Object.assign(el('div','ss'),{textContent:sub}));
  td.append(d);
  if(!k.bye){
    td.title='vs '+k.opp+' '+num(k.oppPts)+(k.oppProj!=null? ' (proj '+num(k.oppProj)+')':'')
      +' · '+(k.final?'final':(k.pre?'not started':(k.m.minutesLeft??'?')+'m of game time left'));
  }
  return td;
}

function pageStandings(){
  const l=L(), out=[];
  const h=el('div','head'); h.append(el('h1',null,'Standings'));
  h.append(el('p',null,leagueLabel(l)+' · '+l.host+' · '+l.teams.length+' teams'));
  out.push(h);

  const sb=standingsBoard(l);
  const rows=standingsRows(l, sb);
  if(sb && !sb.live){
    out.push(Object.assign(el('p','note'),{textContent:
      'This week has no live board yet — these numbers are the last stored week with scores (week '+sb.week+'; '+sb.rows.length+' matchups), as captured. Run `matchups:sync` once games kick off for the live table.'}));
  }
  const divisions=[...new Set(rows.map(r=>r.division).filter(Boolean))].sort();
  const anyPf=rows.some(r=>r.pointsFor!=null);
  const anyOdds=rows.some(r=>r.oddsPct!=null);
  const anyWaiver=rows.some(r=>r.waiverPosition!=null || r.waiverBudgetUsed!=null);
  const anyWeek=rows.some(r=>r.wkResult);
  const anySeed=rows.some(r=>r.seed!=null);
  const anyHost=rows.some(r=>r.recordSource==='host');
  // The live-result counter only runs for hosts without official records, so a
  // toggle that re-counts unplayed games is only offered where it does anything.
  const anyLive=rows.some(r=>r.recordLive && r.wkResult && !r.wkResult.final);

  const bar=el('div','toggles');
  if(divisions.length>1){
    bar.append(segmented([{label:'Whole league',value:'all'},{label:'By division',value:'division'}], standView,
      v=>{ standView=v; store.set('gd.standView',v); writeHash(); render(); }));
  }
  if(anyLive){
    // The record does not move while a game is being played. This is the opt-in
    // to the other reading — "if everyone ahead right now holds on".
    bar.append(segmented([{label:'Completed games',value:'done'},{label:'If leaders hold',value:'proj'}], standMode,
      v=>{ standMode=v; store.set('gd.standMode',v); writeHash(); render(); }));
  }
  if(bar.childNodes.length) out.push(bar);

  const budget = l.faabBudget ?? (l.detail&&l.detail.supported? l.detail.settings.waiverBudget : null);
  const maxGames = rows.reduce((a,r)=>Math.max(a, r.games||0), 0);

  // Every column carries a width, including the name. Under fixed layout the
  // leftover is then shared out proportionally; leaving the name column
  // unsized handed it every spare pixel and crushed the numbers against the
  // right edge.
  const cols=[
    {key:'rank',   label:'#',       r:1, w:46, title:'Record, then points for'},
    {key:'name',   label:'Team',    w:250},
    {key:'record', label:'Record',  r:1, w:72, title: anyHost
        ? 'Official '+l.host+' record for the season to date'
        : (standMode==='proj'
          ? 'Official record plus every game this week, counted to whoever is ahead'
          : 'Official record plus this week’s finished games only')},
  ];
  if(anyPf) cols.push(
    {key:'pf', label:'PF', r:1, w:72, title: anyHost? 'Points for — '+l.host+'\u2019s official season total' : 'Points for, over '+maxGames+' finished game(s)'},
    {key:'pa', label:'PA', r:1, w:72, title: anyHost? 'Points against — same official total' : 'Points against, over the same games'});
  if(divisions.length && standView!=='division') cols.push({key:'div', label:'Division', w:104});
  cols.push({key:'gb', label:'GB', r:1, w:46, title:'Games back of the leader'});
  if(anyOdds) cols.push({key:'odds', label:'Playoff %', r:1, w:78, title:'MyPlaybook projected playoff odds'});
  if(anyWeek) cols.push({key:'week', label:(sb&&!sb.live)? 'Week '+sb.week+' · stored' : 'Week '+DATA.week, r:1, w:88, title:(sb&&!sb.live)?
    'Scores from the last stored board (week '+sb.week+'), as captured at sync time' : 'Scored so far, over the projected final'});
  if(anyWaiver) cols.push({key:'waiver', label:'Waiver', r:1, w:76, title:budget? 'Claim order, and FAAB remaining' : 'Claim order'});

  const onSort=(k)=>{
    if(standSort===k) standFlip=!standFlip; else { standSort=k; standFlip=false; }
    store.set('gd.standSort',standSort); store.set('gd.standFlip',standFlip?'1':'');
    writeHash(); render();
  };

  const buildRow=(r)=>{
    const tr=el('tr');
    if(r.mine) tr.classList.add('mine');
    // In vs out is a fill, not just a line: sorting by points-for or by
    // division breaks rank order, and a divider drawn at a fixed row index
    // would then sit in the wrong place while still looking authoritative.
    if(r.inPlayoffs===true) tr.classList.add('inplay');
    else if(r.inPlayoffs===false) tr.classList.add('outplay');

    const rk=el('td','r');
    const badge=el('span','seedno'+(r.inPlayoffs?' in':''), String(r.rank));
    badge.title=[
      'Standing #'+r.rank+' by record, then points for',
      r.seed!=null? 'Playoff seed '+r.seed+' — '+r.seedWhy : null,
      r.hostRank!=null && r.hostRank!==r.rank? l.host+' has them #'+r.hostRank : null,
    ].filter(Boolean).join('\n');
    rk.append(badge);
    // The seed only earns its own mark when it disagrees with the standing.
    if(r.seed!=null && r.seed!==r.rank) rk.append(el('span','seedalt','#'+r.seed));
    tr.append(rk);

    tr.append(teamCell(r));

    const rec=el('td','r');
    const rd=el('div','stack');
    const rv=el('div','sv'+(r.provisional?' prov':''));
    rv.textContent=r.effWins+'-'+r.effLosses+(r.effTies?'-'+r.effTies:'');
    rd.append(rv);
    if(r.counted) rd.append(Object.assign(el('div','ss'),{textContent:r.wins+'-'+r.losses+' official'}));
    rec.append(rd);
    if(r.counted) rec.title=(r.provisional? 'Counts a game still in progress. ':'')+'Official record is '+r.wins+'-'+r.losses+'.';
    tr.append(rec);

    if(anyPf){
      const mk=(v,g)=>{
        const td=el('td','r');
        const d=el('div','stack');
        d.append(Object.assign(el('div','sv'),{textContent: v==null? '—' : num(v)}));
        // Only the rows that are over fewer games than the rest say so; on a
        // table where everyone has played the same number it is just noise.
        if(v!=null && g!=null && g<maxGames) d.append(Object.assign(el('div','ss'),{textContent:g+' gm'}));
        td.append(d);
        if(v!=null && g) td.title=num(v)+' over '+g+' finished game'+(g>1?'s':'');
        return td;
      };
      tr.append(mk(r.pointsFor, r.games));
      tr.append(mk(r.pointsAgainst, r.games));
    }

    if(divisions.length && standView!=='division'){
      const dv=el('td');
      if(r.division) dv.append(el('span','pill gh', r.division));
      else dv.append(el('span','note','—'));
      tr.append(dv);
    }

    tr.append(Object.assign(el('td','r num'),{textContent: r.gb===0? '—' : (Number.isInteger(r.gb)? String(r.gb) : r.gb.toFixed(1))}));
    if(anyOdds){
      const od=el('td','r');
      if(r.oddsPct==null) od.append(el('span','note','—'));
      else{
        const sp=el('span','num odds');
        sp.textContent=r.oddsPct+'%';
        sp.style.color = r.oddsPct>=70? 'var(--good)' : (r.oddsPct>=35? 'var(--market)' : 'var(--bad)');
        od.append(sp);
      }
      if(r.projRecord) od.title='Projected finish '+r.projRecord[0]+'-'+r.projRecord[1]+' (#'+(r.rankProj??'—')+')';
      tr.append(od);
    }
    if(anyWeek) tr.append(weekCell(r));
    if(anyWaiver){
      const wv=el('td','r');
      const d=el('div','stack');
      d.append(Object.assign(el('div','sv'),{textContent: r.waiverPosition==null? '—' : '#'+r.waiverPosition}));
      if(r.waiverBudgetUsed!=null && budget) d.append(Object.assign(el('div','ss'),{textContent:'$'+(budget-r.waiverBudgetUsed)}));
      else if(r.totalMoves!=null) d.append(Object.assign(el('div','ss'),{textContent:r.totalMoves+' mv'}));
      wv.append(d); tr.append(wv);
    }
    return tr;
  };

  const cutIndex = rows.filter(r=>r.inPlayoffs).length || null;

  if(standView==='division' && divisions.length>1){
    divisions.forEach(dv=>{
      const sub=sortRows(rows.filter(r=>r.division===dv), standSort, standFlip);
      out.push(panel(dv, sub.length+' teams', sortableTable(cols, sub.map(buildRow), {sortKey:standSort, flip:standFlip, onSort})));
    });
    const none=rows.filter(r=>!r.division);
    if(none.length){
      const sub=sortRows(none, standSort, standFlip);
      out.push(panel('No division', none.length+' teams · assign them in League Setup',
        sortableTable(cols, sub.map(buildRow), {sortKey:standSort, flip:standFlip, onSort})));
    }
  } else {
    const sorted=sortRows(rows, standSort, standFlip);
    // The cut line is only drawn when the current sort actually puts the
    // qualifying teams on top; otherwise the fill carries it alone.
    const clean = cutIndex!=null && sorted.every((r,i)=> (i<cutIndex) === (r.inPlayoffs===true));
    const trs=[];
    sorted.forEach((r,i)=>{
      if(clean && i===cutIndex){
        const cut=el('tr','cutrow');
        const td=el('td'); td.colSpan=cols.length;
        td.append(el('span',null,'playoff cut · top '+cutIndex+(anySeed?' by this league’s rule':'')));
        cut.append(td); trs.push(cut);
      }
      trs.push(buildRow(r));
    });
    out.push(panel('Standings', standingsSource(l, rows, maxGames, sb), sortableTable(cols, trs, {sortKey:standSort, flip:standFlip, onSort})));
  }

  const notes=[];
  notes.push('Ranked on record, then points for. '+(anySeed
    ? 'Shaded rows are in under this league’s own rule — '+(l.seedRule.describe||'')+' A seed that differs from the standing is marked beside the number.'
    : (cutIndex? 'Shaded rows are the top '+cutIndex+'. Set a seeding rule in League Setup to mark them under your league’s actual rule.' : '')));
  if(anyLive){
    notes.push(standMode==='proj'
      ? 'Records count every game this week to whoever is currently ahead, or projected higher before kickoff.'
      : 'Records change only when a game finishes — a matchup in progress does not move the table.');
  } else if(anyHost){
    notes.push('Records and points are '+l.host+'\u2019s official season-to-date totals; this week joins them once the host finalizes it.');
  }
  if(!anyPf) notes.push('Points for and against appear as soon as a matchup finishes; none has yet this week.');
  else if(anyHost) notes.push('Points for and against are '+l.host+'\u2019s official season totals — the one host that publishes them, and the only complete number there is.');
  else if(rows.some(r=>r.pfSource==='ledger')) notes.push('Points are summed over every finished matchup this app has stored'
    +(standMode==='proj'? ', plus this week as it currently stands' : '')
    +' ('+maxGames+' game(s)) — neither ESPN nor Yahoo publishes a season total anywhere reachable, so weekly syncs are what build it.');
  notes.filter(Boolean).forEach(n=> out.push(Object.assign(el('p','note'),{textContent:n})));

  const P=l.adv&&l.adv.standings;
  if(P && !P.ok && P.inactive) out.push(inactiveNote(l,'Projected standings'));
  return out;
}

function standingsSource(l, rows, maxGames, sb){
  const bits=[];
  if(rows.some(r=>r.recordSource==='host')) bits.push('records + standings from '+l.host);
  else if(rows.some(r=>r.recordSource==='ledger')) bits.push('records from stored matchups');
  else if(rows.some(r=>r.recordSource==='mpb')) bits.push('records from MyPlaybook');
  if(rows.some(r=>r.wkResult)) bits.push((sb&&!sb.live)? 'scores from the stored week '+sb.week : 'live scores from all '+l.teams.length+' teams');
  if(rows.some(r=>r.pointsFor!=null)) bits.push('points over '+maxGames+' finished game'+(maxGames===1?'':'s'));
  if(rows.some(r=>r.waiverPosition!=null)) bits.push('waivers from '+l.host);
  return bits.join(' · ') || l.host;
}

/* ---------- waiver clock ----------
 *
 * "Is he a free agent or a waiver claim?" is a different question from "is he
 * unrostered", and it changes what you do: a free agent is first-come, a
 * waiver player costs a claim and processes on a schedule.
 *
 * No host exposes a per-player waiver state through anything reachable here.
 * It is derivable, though, from two things we do have: the drop that put him
 * there (transactions carry the date, and `viaWaivers` on the URL), and the
 * league's own claim period and process day, which you set in League Setup.
 *
 * When the period is not configured this returns null rather than guessing —
 * an invented clear time would be read as fact.
 */
const DAY_MS = 86400000;

function waiverClock(l){
  const o = ovFor(l);
  const w = o.waivers || {};
  const days = w.claimDays;
  const type = (w.type || l.waiverType || '').toLowerCase();
  if (type === 'none') return { configured:true, none:true, byPlayer:new Map() };
  if (days == null && w.processDay == null) return { configured:false, byPlayer:new Map() };

  // Most recent drop per player, across the whole league.
  const dropped = new Map();
  for (const t of l.transactions || []) {
    for (const d of t.drops || []) {
      const at = t.time ? new Date(t.time) : (t.date ? new Date(t.date) : null);
      if (!at || Number.isNaN(at.getTime())) continue;
      const prev = dropped.get(d.fpId);
      if (!prev || at > prev.at) dropped.set(d.fpId, { at, teamName: t.teamName });
    }
  }

  const now = new Date();
  const byPlayer = new Map();
  for (const [fpId, rec] of dropped) {
    let clearsAt = null;
    if (days != null) clearsAt = new Date(rec.at.getTime() + days * DAY_MS);
    if (w.processDay != null) {
      // Claims process on a fixed weekday; a player sits until the first
      // processing run at or after his claim period ends.
      const from = clearsAt || rec.at;
      const c = new Date(from);
      c.setHours(w.processHour ?? 3, 0, 0, 0);
      while (c.getDay() !== w.processDay || c < from) c.setDate(c.getDate() + 1);
      clearsAt = c;
    }
    if (!clearsAt) continue;
    byPlayer.set(fpId, {
      droppedAt: rec.at, droppedBy: rec.teamName, clearsAt,
      onWaivers: now < clearsAt,
      hoursLeft: Math.max(0, (clearsAt - now) / 3600000),
    });
  }
  return { configured:true, none:false, type, byPlayer };
}

/* ---------- demand signal ----------
   Everything else in this dashboard answers "how many points". This answers
   "how long is the window open", which is the question a waiver claim actually
   turns on — and it is the only data here that moves by the hour. */

/** Adds per hour, abbreviated: 16428 -> 16.4k/h. */
function rate(v){
  if(v==null) return '—';
  if(v>=10000) return (v/1000).toFixed(0)+'k';
  if(v>=1000) return (v/1000).toFixed(1)+'k';
  return String(Math.round(v));
}

/**
 * The acceleration cell, which is the one number on this page worth acting on.
 *
 * Volume tells you a player has already been claimed; acceleration tells you he
 * is being claimed NOW. Michael Mayer at 380k adds and 0.33x is a wave that
 * broke hours ago and a claim you are late to; Devin Singletary at 100k and
 * 200x is the wave itself.
 */
function surgeCell(sig){
  const td=el('td','r');
  if(!sig){ td.append(el('span','delta flat','—')); return td; }
  if(sig.v==null){
    const sp=el('span','pill '+(sig.fresh?'ok':'gh'), sig.r!=null?'new':'—');
    sp.title = sig.fresh? 'No measurable activity before the last few hours — this is the start of the wave.' : 'Not enough history to measure a rate.';
    td.append(sp); return td;
  }
  const cls = sig.v>=2 ? 'up' : (sig.v<0.7 ? 'dn' : 'flat');
  const sp=el('span','delta '+cls, sig.v>=10? Math.round(sig.v)+'x' : sig.v.toFixed(1)+'x');
  sp.title = 'Adds per hour over the last '+(DATA.signals.windows?DATA.signals.windows[0]:6)+'h against the rate before it. '+
    (sig.v>=2? 'Accelerating — claim now.' : (sig.v<0.7? 'Decelerating — the wave has passed.' : 'Steady.'));
  td.append(sp); return td;
}

/** How much of the market already has him — the size of the window remaining. */
function rosteredCell(sig){
  const td=el('td','r');
  if(!sig || sig.yr==null){ td.append(el('span','delta flat','—')); return td; }
  const box=el('div'); box.style.display='flex'; box.style.alignItems='center'; box.style.gap='7px'; box.style.justifyContent='flex-end';
  box.append(Object.assign(el('span','num'),{textContent:sig.yr+'%'}));
  const bar=el('div','bar'); const i=el('i');
  i.style.width=Math.max(0,Math.min(100,sig.yr))+'%';
  if(sig.yrc!=null && sig.yrc>0) i.className='mk';
  bar.append(i); box.append(bar);
  td.append(box);
  td.title=sig.yr+'% of Yahoo leagues roster him'+(sig.yrc!=null?' ('+(sig.yrc>0?'+':'')+sig.yrc+' pts since the previous day)':'')+
    (sig.ys!=null?'; started in '+sig.ys+'%':'');
  return td;
}

/* ---------- players page ----------
   The full pool, browsed the way Sleeper's Players tab reads: every player
   FantasyPros ranks, or just the ones nobody in this league owns, with a
   projection column that switches between this week and rest of season.
   Filters compose — position, NFL team, league roster and the watch list all
   AND together, and the demand tile is back to being a per-row column rather
   than the whole page. */

/** The watch list: plain player ids in localStorage, toggled by the star. */
const watch = (()=>{
  const KEY='gd.watchlist';
  let set=new Set();
  try{ const v=localStorage.getItem(KEY); if(v) set=new Set(String(v).split(',').filter(Boolean)); }catch{}
  const persist=()=>{ try{ localStorage.setItem(KEY,[...set].join(',')); }catch{} };
  return {
    has: id => set.has(String(id)),
    toggle(id){ const s=String(id); if(set.has(s)) set.delete(s); else set.add(s); persist(); },
    all: ()=>[...set],
    count: ()=>set.size,
  };
})();

const GRADE_ORDER=['F','D-','D','D+','C-','C','C+','B-','B','B+','A-','A','A+'];

/**
 * The players table's sort table.
 *
 * Keys are the same names the column headers use, so clicking a header shows
 * the sort that made the row order. Projection sorts read the selected
 * look-ahead window rather than freezing week-1 or rest-of-season.
 */
const PLAYER_SORTS = {
  name:    {label:'Name', of:p=>String(p.n||'').toLowerCase(), text:true},
  roster:  {label:'Roster', of:p=>(ROSTER.get(p.i)?.name||'~').toLowerCase(), text:true},
  cons:    {label:'Consensus', of:p=> (consFor(p)||{}).v??-1, dir:-1},
  consrk:  {label:'Consensus rank', of:p=> (consFor(p)||{}).rk??9999, dir:1},
  conspos: {label:'Consensus pos rank', of:p=> (consFor(p)||{}).pr??9999, dir:1},
  opp:     {label:'Opponent', of:p=>String(oppLabel(p,hz().from)||'~').replace('@',''), text:true},
  trend:   {label:'Trend', of:p=> p.tr ?? 9999, dir:1},
  grade:   {label:'Grade', of:p=> GRADE_ORDER.indexOf(String(p.g||'')), dir:-1},
  own:     {label:'Rostered %', of:p=> p.own ?? -1, dir:-1},
  surge:   {label:'Surge', of:p=> p.sig?.v??(p.sig?.r!=null?0:-1), dir:-1},
  adds:    {label:'Adds/h', of:p=> p.sig?.r??-1, dir:-1},
  rostered:{label:'Rostered', of:p=> p.sig?.yr??-1, dir:-1},
  slAdds:  {label:'Sleeper adds', of:p=> p.sig?.a??-1, dir:-1},
  slDrops: {label:'Sleeper drops', of:p=> p.sig?.d??-1, dir:-1},
  yAdds:   {label:'Yahoo adds', of:p=> p.sig?.ya??-1, dir:-1},
  yDrops:  {label:'Yahoo drops', of:p=> p.sig?.yd??-1, dir:-1},
  yNet:    {label:'Yahoo net', of:p=> p.sig?.yn??-Infinity, dir:-1},
  yStart:  {label:'Yahoo started', of:p=> p.sig?.ys??-1, dir:-1},
};
PLAYER_SORTS.ecr   = {label:'ECR', of:p=> ecrOf(p,hz())??9999, dir:1};
PLAYER_SORTS.ecrrng= {label:'Expert range', of:p=>{ const ros=hzMode(hz())==='ros', lo=ros?p.rosMin:p.rmin, hi=ros?p.rosMax:p.rmax; return lo!=null&&hi!=null? hi-lo : -1; }, dir:-1};
PLAYER_SORTS.tm    = {label:'Trade value', of:p=> p.tm&&p.tm.v!=null? p.tm.v : -1, dir:-1};
PLAYER_SORTS.tmd   = {label:'Trade value change', of:p=> tmChange(p)??-Infinity, dir:-1};
PLAYER_SORTS.tms   = PLAYER_SORTS.tmd;
CONS_SRC.forEach(s=>{ PLAYER_SORTS['s-'+s.k]={label:s.k, of:p=> srcValue(p,s.k,hz()).v??-1, dir:-1}; });

function byPlayers(a,b){
  const s=PLAYER_SORTS[playerSort]||PLAYER_SORTS.cons;
  const d=(s.dir||1)*(playerFlip?-1:1);
  const x=s.of(a), y=s.of(b);
  if(x===y) return byPlayerFallback(a,b);
  if(s.text) return String(x).localeCompare(String(y))*d;
  return (x<y?-1:1)*d;
}
function byPlayerFallback(a,b){
  return (POS_ORDER[a.p]||9)-(POS_ORDER[b.p]||9)
    || String(a.n||'').localeCompare(String(b.n||''))
    || (((consFor(b)||{}).v??-1)-((consFor(a)||{}).v??-1));
}

/** The star that keeps a player on the watch list. */
function starBtn(p){
  const on=watch.has(String(p.i));
  const b=el('button','star'+(on?' on':''), on?'★':'☆');
  b.type='button'; b.title = on? 'Remove from watch list' : 'Add to watch list';
  b.setAttribute('aria-label',b.title);
  b.onclick=()=>{ watch.toggle(String(p.i)); buildList(); };
  return b;
}

/** Generic filter chip; click toggles it in/out of the set.
    `fullRender` chips (roster, free-agent) switch scope to All first, so a
    team chip can never be silently ignored by the scope toggle. `cls` picks
    the visual: a pill chip, a checkbox row (Roster popover), or a logo tile
    (Team popover). */
function filterChip(label, active, onClick, decorate, fullRender, cls){
  const b=el('button',(cls||'fchip')+(active?' on':''), label);
  b.type='button'; b.setAttribute('aria-pressed',String(active));
  if(decorate) decorate(b);
  b.onclick=()=>{
    const next=onClick();
    b.classList.toggle('on',next); b.setAttribute('aria-pressed',String(next));
    // `fullRender` may also be the specific refresh to run (the Sources page
    // rebuilds its own list, not the Players one).
    if(typeof fullRender==='function') fullRender(); else if(fullRender) render(); else buildList();
  };
  return b;
}
function chipGroup(title, chips){
  const g=el('div','fgroup');
  g.append(el('span','ftitle',title));
  chips.forEach(c=>g.append(c));
  return g;
}

/** Position chips carry the Sleeper slot colour when active, like the cells do. */
function posChipFilter(pos){
  return filterChip(pos, playerPos.has(pos), ()=>{
    if(playerPos.has(pos)) playerPos.delete(pos); else playerPos.add(pos);
    store.set('gd.playerPos',[...playerPos].join(','));
    return playerPos.has(pos);
  }, b=>{
    b.setAttribute('data-p',pos);
    b.style.setProperty('--p','var('+(POS_VAR[pos]||'--p-flex')+')');
  });
}

/** NFL-team tile for the "Team" column of the filter popover: logo over abbrev. */
function teamGridTile(t){
  return filterChip('', playerTeams.has(t), ()=>{
    if(playerTeams.has(t)) playerTeams.delete(t); else playerTeams.add(t);
    store.set('gd.playerTeams',[...playerTeams].join(','));
    return playerTeams.has(t);
  }, b=>{ b.append(imgEl(teamLogo(t),'tml'), document.createTextNode(t)); }, false, 'tgrid-item');
}

/** League-roster row for the "Roster" column: checkbox + team mark + name. */
function rosterRow(t){
  const id=String(t.id);
  return filterChip('', playerRoster.has(id), ()=>{
    playerScope='all'; store.set('gd.playerScope', playerScope);
    if(playerRoster.has(id)) playerRoster.delete(id); else playerRoster.add(id);
    store.set('gd.playerRoster',[...playerRoster].join(','));
    return playerRoster.has(id);
  }, b=>{ b.append(el('span','cb'), imgEl(t.logo,'tml'), document.createTextNode(teamLabel(PLAYER_L,t))); }, true, 'frow');
}
function faRow(){
  return filterChip('', playerRoster.has('__FA__'), ()=>{
    playerScope='all'; store.set('gd.playerScope', playerScope);
    if(playerRoster.has('__FA__')) playerRoster.delete('__FA__'); else playerRoster.add('__FA__');
    store.set('gd.playerRoster',[...playerRoster].join(','));
    return playerRoster.has('__FA__');
  }, b=>{ b.append(el('span','cb'), document.createTextNode('Free agents')); }, true, 'frow');
}

/** Sets a fixed-position popover's top/left from its trigger button, clamped
    so it never runs off the right edge of the viewport. */
function positionFilterPop(btn, pop){
  const r = btn.getBoundingClientRect();
  const w = Math.min(560, innerWidth*0.88);
  pop.style.left = Math.max(12, Math.min(r.left, innerWidth - w - 12)) + 'px';
  pop.style.top = (r.bottom + 6) + 'px';
}

/** The "Filters" button + its Team/Roster popover, Sleeper's players-tab pattern:
    one control that opens onto a leaguemate checklist and an NFL-team grid,
    instead of two chip rows sitting open on the page at all times.
    The popover is appended to <body>, not to the button's own panel — that
    panel has `overflow:hidden` (for its rounded corners), which would clip
    an absolutely-positioned popover to the panel's own short height. */
function filterPopover(l){
  const activeCount = playerTeams.size + playerRoster.size;
  const wrap = el('div','filterbar');
  const btn = el('button','iconbtn filterbtn','Team & Roster'); btn.type='button';
  btn.setAttribute('aria-haspopup','true'); btn.setAttribute('aria-expanded', String(filterPopOpen));
  if(activeCount) btn.append(el('span','fbadge',String(activeCount)));
  wrap.append(btn);

  const pop = el('div','filterpop'); pop.hidden=!filterPopOpen;
  pop.onclick=(e)=> e.stopPropagation();
  const head = el('div','filterpop-head');
  head.append(el('h4',null,'Filtered by'));
  const clear = el('button','linkbtn','Clear'); clear.type='button';
  clear.onclick=()=>{
    playerTeams.clear(); playerRoster.clear(); playerScope='all';
    store.set('gd.playerTeams',''); store.set('gd.playerRoster',''); store.set('gd.playerScope','all');
    render();
  };
  head.append(clear);
  pop.append(head);

  const cols = el('div','filterpop-cols');
  const rosterCol = el('div','filterpop-col');
  rosterCol.append(el('span','ftitle','Roster'));
  const rosterList = el('div','rosterlist');
  rosterList.append(faRow(), ...l.teams.map(rosterRow));
  rosterCol.append(rosterList);
  cols.append(rosterCol);

  const teamCol = el('div','filterpop-col');
  teamCol.append(el('span','ftitle','NFL Teams'));
  const nflTeams=[...new Set(PLAYER_POOL.map(p=>p.t).filter(t=> t && t!=='FA'))].sort();
  const grid = el('div','teamgrid');
  grid.append(...nflTeams.map(teamGridTile));
  teamCol.append(grid);
  cols.append(teamCol);
  pop.append(cols);

  btn.onclick=(e)=>{
    e.stopPropagation();
    filterPopOpen=!filterPopOpen;
    if(filterPopOpen) positionFilterPop(btn,pop);
    pop.hidden=!filterPopOpen;
    btn.setAttribute('aria-expanded',String(filterPopOpen));
  };
  if(filterPopOpen) positionFilterPop(btn,pop);
  document.body.append(pop);
  return wrap;
}

/**
 * fpId -> the league team that rosters him, computed once per render so the
 * Players and Sources pages only do lookups. "Mine" follows the teams you
 * claimed in League Setup, not just the one team the host reports.
 */
function rosterIndex(l){
  const mine=new Set(myTeams(l).map(t=>String(t.id)));
  const idx=new Map();
  l.teams.forEach(t=>{
    const info={id:String(t.id), name:teamLabel(l,t), abbr:teamAbbrev(l,t), logo:t.logo, mine:mine.has(String(t.id))};
    t.players.forEach(p=> idx.set(p.i, info));
  });
  return idx;
}

/**
 * Who has him, for every league in one cell. A rostered player shows the team
 * that has him (crest + abbreviation, yours highlighted); anyone else shows FA,
 * or - when a claim period is configured and he was dropped inside it - that he
 * is on waivers and when he clears. This used to be two columns, and the second
 * (Status) said "free agent" for players who were on a roster.
 */
function rosterBadgeCell(p){
  const td=el('td');
  const w=el('div','rteam');
  const r=ROSTER.get(p.i);
  if(r){
    const b=el('span','teambadge '+(r.mine?'mine':'other'));
    b.title=r.name+(r.mine?' \u2014 your team':'');
    if(r.logo) b.append(imgEl(r.logo,'tblogo'));
    b.append(document.createTextNode(r.abbr));
    w.append(b); td.append(w); return td;
  }
  const claim=CLOCK && CLOCK.configured && !CLOCK.none? CLOCK.byPlayer.get(p.i) : null;
  if(claim && claim.onWaivers){
    const box=el('div','mvside');
    const b=el('span','teambadge wv','W'); b.textContent='Waivers';
    box.append(b);
    const hrs=claim.hoursLeft;
    box.append(Object.assign(el('div','ss'),{textContent: hrs<24? 'clears in '+Math.max(1,Math.round(hrs))+'h'
      : 'clears '+claim.clearsAt.toLocaleDateString([], {weekday:'short'})+' '+claim.clearsAt.toLocaleTimeString([], {hour:'numeric'})}));
    td.title='On waivers \u2014 dropped '+claim.droppedAt.toLocaleString()+(claim.droppedBy? ' by '+claim.droppedBy : '')+'; claims process before he reaches free agency.';
    td.append(box); return td;
  }
  const b=el('span','teambadge fa','FA');
  b.title = CLOCK && CLOCK.configured? 'Free agent \u2014 not on a roster in this league' : 'Free agent \u2014 set a claim period in League Setup to see waiver status';
  w.append(b); td.append(w);
  return td;
}

/** Week-over-week move in the expert consensus rank; negative is an improved rank, so that direction is the good arrow. */
function trendCell(p){
  const td=el('td','r');
  const v=p.tr;
  if(v!=null) td.dataset.v=String(-v);
  if(v==null || v===0){ td.append(el('span','delta flat','\u2014')); return td; }
  const up=v<0;
  const sp=el('span','delta '+(up?'up':'dn'), (up?'\u25B2':'\u25BC')+Math.abs(v));
  sp.title='Consensus rank '+(up?'improved':'slipped')+' by '+Math.abs(v)+' since the last update';
  td.append(sp); return td;
}
/** The start/sit grade as a filled chip — the one column that is a verdict, not a number. */
function gradeBadgeCell(p){
  const td=el('td','r');
  if(!p.g){ td.append(el('span','gradebadge muted','\u2014')); return td; }
  const f=p.g[0];
  td.append(el('span','gradebadge '+(f==='A'?'good':f==='B'?'info':f==='C'?'mid':'bad'), p.g));
  return td;
}
function addsCell(p){
  const td=el('td','r num');
  td.textContent = p.sig?.r!=null? rate(p.sig.r) : '—';
  if(p.sig?.r!=null) td.title=Math.round(p.sig.r)+' adds per hour across Sleeper';
  return td;
}

/** The filtered pool, every rule ANDed. */
function playList(){
  let list=[...PLAYER_POOL];
  if(playerScope==='fa'){
    list=list.filter(p=> !ROSTER.has(p.i));
  } else if(playerRoster.size){
    const fa=playerRoster.has('__FA__');
    list=list.filter(p=>{
      const r=ROSTER.get(p.i);
      return r ? playerRoster.has(r.id) : fa;
    });
  }
  if(playerTeams.size) list=list.filter(p=> playerTeams.has(p.t));
  if(playerPos.size)   list=list.filter(p=> playerPos.has(p.p));
  if(playerWatchOnly)  list=list.filter(p=> watch.has(String(p.i)));
  if(playerQuery)      list=list.filter(p=> (p.n||'').toLowerCase().includes(playerQuery));
  list.sort(byPlayers);
  return list;
}

function onPlayerSort(key){
  if(playerSort===key) playerFlip=!playerFlip;
  else { playerSort=key; playerFlip=false; }
  store.set('gd.playerSort',playerSort); store.set('gd.playerFlip',playerFlip?'1':'');
  buildList();
}

/**
 * The Players table's columns. The consensus, source and info groups come from
 * `columnsFor` - the same list My Team and All Rosters draw from - so the two
 * cannot drift; only what belongs to the pool alone (who rosters him, the
 * waiver-market signal, his waiver status) is added here.
 */
function playerColumns(){
  return [
    {w:34,  band:'', cell:p=>{ const td=el('td','watch'); td.append(starBtn(p)); return td; }},
    {w:236, band:'', key:'name',   label:'Player', cell:playerCell2},
    {w:118, band:'', key:'roster', label:'Roster', cell:rosterBadgeCell},
    ...columnsFor(hz(), {players:true}),
  ];
}

function playersTable(list){
  const cols=playerColumns();
  const wrap=el('div','scroll');
  const t=el('table','fixed');
  const cg=el('colgroup');
  cols.forEach(c=>{ const co=el('col'); co.style.width=c.w+'px'; cg.append(co); });
  t.append(cg);
  const thead=el('thead');

  // Band row: names the clusters whose label carries information — which of
  // these numbers are about the projection, which are the waiver-market
  // signal. Player identity needs no invented label.
  const bands=el('tr');
  for(let k=0; k<cols.length;){
    let n=1; while(k+n<cols.length && cols[k+n].band===cols[k].band) n++;
    const th=el('th', cols[k].band? 'band' : '', cols[k].band);
    th.colSpan=n; bands.append(th);
    k+=n;
  }
  thead.append(bands);

  const hr=el('tr');
  cols.forEach(c=> hr.append( c.key? sortTh(c, playerSort, playerFlip, onPlayerSort) : el('th', (c.sep?'tsep':''), c.label||'')));
  thead.append(hr); t.append(thead);

  const tb=el('tbody');
  list.forEach(p=>{ const tr=el('tr'); cols.forEach(c=>tr.append(c.cell(p))); tb.append(tr); });
  t.append(tb);
  wrap.append(t); return wrap;
}

/** Rebuild only the list panel, so a search keeps its focus while typing. */
function buildList(){
  if(!LIST) return;
  while(LIST.firstChild) LIST.removeChild(LIST.firstChild);
  const list=playList();
  const header=el('header');
  header.append(el('h3',null,'Players'));
  header.append(el('div','spacer'));
  if(watch.count()) header.append(el('span','pcount','★ '+watch.count()+' watched'));
  header.append(el('span','pcount total', list.length+' players'));
  LIST.append(header);
  if(!list.length){
    const b=el('div','pbody'); b.append(emptyState('No players match','Loosen a filter, or clear the search.')); LIST.append(b);
    return;
  }
  const body=el('div'); body.append(playersTable(list)); LIST.append(body);
}

/* ---------- waiver wire ----------
   Your players against the best available, position by position, with this week
   AND rest of season side by side - the FantasyPros waiver cheat sheet, but on
   the consensus of every source instead of one. Every number is read from the
   same fixed tables as the Players page: a player's rank here is his rank there,
   never a rank within whatever list happens to be on screen (the "Avail #" column
   is the one deliberate exception, and is labelled as one). */

let waiverBy  = store.get('gd.waiverBy','ros')==='wk'? 'wk' : 'ros';
let waiverN   = Math.max(5, Math.min(40, Number(store.get('gd.waiverN','12'))||12));
let waiverPos = new Set(String(store.get('gd.waiverPos','')).split(',').filter(Boolean));

/** A player's consensus for the two anchor windows at once. */
function bothWindows(p){
  return {wk:consFor(p, parseHz('w-'+DATA.week)), ros:consFor(p, parseHz('ros'))};
}
function rankText(c){ return c && c.rk!=null? (c.pos||'')+c.pr : '—'; }

function pageWaivers(){
  const l=L(), out=[];
  const head=el('div','head');
  head.append(el('h1',null,'Waiver Wire'));
  head.append(el('p',null,'Your players and the best free agents at each position, on the consensus of every source — this week and rest of season together. A free agent who beats your weakest player at his position is flagged as an upgrade.'));
  out.push(head);

  const sc=scoringKey(l);
  const pool=DATA.pools[sc]||[];
  if(!pool.length){ out.push(panel('Waiver Wire', null, emptyState('No player pool','Run `npm run fp:sync`, then rebuild the dashboard.'))); return out; }
  leagueContext(l);
  const mineIds=new Set(); myTeams(l).forEach(t=> t.players.forEach(p=> mineIds.add(p.i)));

  // controls
  const fp=el('div','panel'), body=el('div','pfilter'), line=el('div','prowbar');
  line.append(el('span','lbl','Rank by'));
  line.append(segmented([{label:'This week',value:'wk'},{label:'Rest of season',value:'ros'}], waiverBy,
    v=>{ waiverBy=v; store.set('gd.waiverBy',v); render(); }));
  line.append(el('span','lbl','Show'));
  const nSel=el('select','hz');
  [8,12,20,30,40].forEach(n=>{ const o=document.createElement('option'); o.value=String(n); o.textContent='Top '+n+' available'; nSel.append(o); });
  nSel.value=String(waiverN);
  nSel.onchange=()=>{ waiverN=Number(nSel.value); store.set('gd.waiverN',String(waiverN)); render(); };
  line.append(nSel);
  line.append(consensusSelect());
  body.append(line);
  const positions=['QB','RB','WR','TE','K','DST'].filter(x=> pool.some(p=>p.p===x));
  body.append(chipGroup('Position', positions.map(pos=> filterChip(pos, waiverPos.has(pos), ()=>{
    if(waiverPos.has(pos)) waiverPos.delete(pos); else waiverPos.add(pos);
    store.set('gd.waiverPos',[...waiverPos].join(','));
    return waiverPos.has(pos);
  }, b=>{ b.setAttribute('data-p',pos); b.style.setProperty('--p','var('+(POS_VAR[pos]||'--p-flex')+')'); }, true))));
  fp.append(body); out.push(fp);

  if(!mineIds.size){ out.push(panel('Your roster', null, emptyState('No roster yet','Claim a team in League Setup, or wait for the host to sync rosters.'))); return out; }

  // per position: mine + top-N available, by the chosen window
  const val=(c)=> c? c.v : null;
  const sections=[];
  positions.filter(x=> !waiverPos.size || waiverPos.has(x)).forEach(pos=>{
    const rows=pool.filter(p=>p.p===pos).map(p=>({p, c:bothWindows(p), mine:mineIds.has(p.i), free:!ROSTER.has(p.i)}));
    const mine=rows.filter(r=>r.mine && val(r.c[waiverBy])!=null).sort((a,b)=> val(b.c[waiverBy])-val(a.c[waiverBy]));
    const free=rows.filter(r=>r.free && val(r.c[waiverBy])!=null).sort((a,b)=> val(b.c[waiverBy])-val(a.c[waiverBy])).slice(0,waiverN);
    free.forEach((r,i)=>{ r.avail=i+1; });
    const worst=mine.length? mine[mine.length-1] : null;
    sections.push({pos, mine:rows.filter(r=>r.mine), free, worst, base:{wk: worst? val(worst.c.wk):null, ros: worst? val(worst.c.ros):null}});
  });

  // best upgrades across positions
  const ups=[];
  sections.forEach(sec=>{
    if(!sec.worst) return;
    sec.free.forEach(r=>{
      const d=val(r.c[waiverBy])-val(sec.worst.c[waiverBy]);
      if(d>0) ups.push({r, sec, d});
    });
  });
  ups.sort((a,b)=> b.d-a.d);
  if(ups.length){
    const rows=ups.slice(0,10).map(({r,sec,d})=>{
      const tr=el('tr');
      tr.append(playerCell2(r.p));
      tr.append(rosterBadgeCell(r.p));
      tr.append(Object.assign(el('td','r num'),{textContent:fmt(val(r.c.wk))}));
      tr.append(Object.assign(el('td','r num'),{textContent:rankText(r.c.wk)}));
      tr.append(Object.assign(el('td','r num'),{textContent:fmt(val(r.c.ros),0)}));
      tr.append(Object.assign(el('td','r num'),{textContent:rankText(r.c.ros)}));
      tr.append(deltaCell(waiverBy==='wk'? d : val(r.c.wk)-val(sec.worst.c.wk)));
      tr.append(deltaCell(waiverBy==='ros'? d : val(r.c.ros)-val(sec.worst.c.ros)));
      tr.append(Object.assign(el('td'),{textContent:sec.worst.p.n}));
      tr.append(surgeCell(r.p.sig));
      return tr;
    });
    out.push(panel('Best upgrades', 'over your weakest player at the position · ranked by '+(waiverBy==='wk'?'this week':'rest of season'),
      table2([{label:'',span:2},{label:'Consensus',span:4},{label:'vs your weakest',span:2},{label:'',span:2}],
        [{label:'Player'},{label:'Roster'},{label:'Wk',r:1,w:52},{label:'PosRk',r:1,w:56},{label:'ROS',r:1,w:52},{label:'PosRk',r:1,w:56},
         {label:'Wk Δ',r:1,w:56,title:'This week, against your weakest at the position'},{label:'ROS Δ',r:1,w:56,title:'Rest of season, against your weakest at the position'},
         {label:'Drop'},{label:'Surge',r:1,w:62}], rows)));
  } else {
    out.push(panel('Best upgrades', null, emptyState('No upgrades on the wire','Nobody available beats your weakest player at any position, on this ranking.')));
  }

  // Who the rest of fantasy football is adding right now, among players still available here.
  const hot=pool.filter(p=> !ROSTER.has(p.i) && p.sig && p.sig.h!=null && (!waiverPos.size || waiverPos.has(p.p)))
    .sort((a,b)=> (b.sig.h-a.sig.h) || ((b.sig.r??-1)-(a.sig.r??-1)) || (a.i<b.i?-1:1)).slice(0,15);
  if(hot.length){
    const bz=buzzColumns();
    const S=DATA.signals||{};
    const rows=hot.map(p=>{
      const tr=el('tr');
      tr.append(playerCell2(p), rosterBadgeCell(p));
      const w=bothWindows(p);
      tr.append(Object.assign(el('td','r num tsep'),{textContent:fmt(val(w.wk))}));
      tr.append(Object.assign(el('td','r num'),{textContent:fmt(val(w.ros),0)}));
      bz.forEach(c=> tr.append(c.cell(p)));
      return tr;
    });
    out.push(panel('Most added right now \u00b7 available in this league',
      [S.trendFetchedAt? 'Sleeper as of '+new Date(S.trendFetchedAt).toLocaleTimeString([], {hour:'numeric',minute:'2-digit'}) : null, S.buzzDate? 'Yahoo day '+S.buzzDate : null].filter(Boolean).join(' \u00b7 '),
      table2([{label:'',span:2},{label:'Consensus',span:2},{label:'Buzz',span:bz.length}],
        [{label:'Player',w:236},{label:'Roster',w:118},{label:'Wk',r:1,w:52,sep:1},{label:'ROS',r:1,w:52}].concat(bz), rows)));
  }

  sections.forEach(sec=>{
    const merged=sec.mine.concat(sec.free).sort((a,b)=>{
      const d=(val(b.c[waiverBy])??-1)-(val(a.c[waiverBy])??-1);
      return d || (a.p.i<b.p.i?-1:1);
    });
    const cols=[{label:'Player'},{label:'Roster'},
      {label:'Wk',r:1,w:52,sep:1},{label:'PosRk',r:1,w:56},{label:'ROS',r:1,w:52,sep:1},{label:'PosRk',r:1,w:56},
      {label:'Wk Δ',r:1,w:56,sep:1,title:'Against your weakest player at this position, this week'},{label:'ROS Δ',r:1,w:56,title:'Against your weakest player at this position, rest of season'},
      {label:'Avail #',r:1,w:56,sep:1,title:'Rank among the players available in this league at this position, by the ranking chosen above (not his overall position rank)'},
      {label:'Opp',w:64,sep:1},{label:'FP %',r:1,w:56},{label:'YH %',r:1,w:108},{label:'Surge',r:1,w:62},{label:'Adds/h',r:1,w:62}];
    const bands=[{label:'',span:2},{label:'This week',span:2},{label:'Rest of season · '+rosSpan(),span:2},{label:'Upgrade over weakest',span:2},{label:'',span:1},{label:'Info',span:2},{label:'Buzz',span:3}];
    const trs=merged.map(r=>{
      const tr=el('tr'); if(r.mine) tr.className='mine';
      tr.append(playerCell2(r.p));
      tr.append(rosterBadgeCell(r.p));
      const wk=r.c.wk, ros=r.c.ros;
      const tw=el('td','r num tsep'); tw.textContent=fmt(val(wk)); tw.title=consTip(r.p, parseHz('w-'+DATA.week)); tr.append(tw);
      tr.append(Object.assign(el('td','r num'),{textContent:rankText(wk)}));
      const tro=el('td','r num tsep'); tro.textContent=fmt(val(ros),0); tro.title=consTip(r.p, parseHz('ros')); tr.append(tro);
      tr.append(Object.assign(el('td','r num'),{textContent:rankText(ros)}));
      const dW=!r.mine && sec.base.wk!=null && val(wk)!=null? val(wk)-sec.base.wk : null;
      const dR=!r.mine && sec.base.ros!=null && val(ros)!=null? val(ros)-sec.base.ros : null;
      const cw=deltaCell(dW); cw.classList.add('tsep'); tr.append(cw);
      tr.append(deltaCell(dR));
      tr.append(Object.assign(el('td','r num tsep'),{textContent: r.avail? String(r.avail) : '—'}));
      tr.append(Object.assign(el('td','num tsep'),{textContent:oppLabel(r.p, DATA.week)}));
      tr.append(stackCell(r.p.own==null?'—':Math.round(r.p.own)+'%','',{}));
      tr.append(rosteredCell(r.p.sig));
      tr.append(surgeCell(r.p.sig));
      tr.append(addsCell(r.p));
      return tr;
    });
    const sub = sec.worst
      ? 'weakest of yours: '+sec.worst.p.n+' ('+fmt(val(sec.worst.c[waiverBy]), waiverBy==='wk'?1:0)+')'
      : 'nobody of yours at this position';
    out.push(panel(sec.pos+' · '+sec.mine.length+' yours, top '+sec.free.length+' available', sub,
      trs.length? table2(bands, cols, trs) : emptyState('Nobody with a projection','No player at this position has a consensus number.')));
  });

  const lg=el('div','legend');
  lg.append(el('span',null,'PosRk is the fixed consensus rank within position over every player, so it matches the Players and My Team pages. Yours are shaded; everyone else is available (FA) or on waivers, with the clearing time when a claim period is set in League Setup.'));
  lg.append(el('span',null,'Rest of season counts games still to come: a game already played this week is taken out of each source’s total (Sources → Health shows which sources still count it).'));
  out.push(lg);
  return out;
}

/* ---------- sources page ----------
   Every source's OWN numbers, unmixed with any other's — no blend, no
   rest-of-season spread, nothing computed by combining two sources. The Players
   page and the market edge reconcile sources into one view; this is where you
   judge each one on its own first. What each column holds, and why a source's
   season column is labelled ROS or Season Total, is in src/sourcetables.js. */

/** The pool a league's scoring format reads: PPR, HALF or STD. */
function scoringKey(l){
  const u=String(l.scoring||'PPR').toUpperCase();
  return u==='HALF'? 'HALF' : (u==='STD'? 'STD' : 'PPR');
}

const SRC_ORDER = DATA.sourceOrder || [];
/** Views that are not one source. Compare is the one to live in: every source side by side, per player. */
const SRC_VIEWS = {compare:'Compare', consensus:'Consensus', health:'Health', guide:'Guide', accuracy:'Accuracy'};
let srcTab   = (SRC_ORDER.includes(store.get('gd.srcTab','')) || store.get('gd.srcTab','') in SRC_VIEWS) ? store.get('gd.srcTab','') : 'compare';
let srcQuery = store.get('gd.srcQuery','');
let srcPos   = new Set(String(store.get('gd.srcPos','')).split(',').filter(Boolean));
let srcSort  = store.get('gd.srcSort','wk');
let srcAsc   = store.get('gd.srcAsc','')==='1';
let SRC_LIST=null, SRC_POOL=new Map();

const srcMeta = src => (DATA.sourceMeta && DATA.sourceMeta[src]) || {label:src};

/** Which columns apply to this source — they differ because the sources do: a betting market has no ROS, and only two sources publish an actual. */
function srcColumns(src){
  const m=srcMeta(src);
  const cols=[{key:'wk', label:'Wk '+DATA.week, asc:false}, {key:'wkRk', label:'Wk PosRk', asc:true}];
  if(m.hasActual) cols.push({key:'wkAct', label: m.hasActual==='weekly'? 'Actual' : 'Actual (szn)', asc:false});
  if(m.range){ cols.push({key:'floor',label:'Floor',asc:false}, {key:'ceiling',label:'Ceiling',asc:false}); }
  if(m.rosLabel){ cols.push({key:'ros', label:m.rosLabel, asc:false}, {key:'rosRk', label:m.rosLabel+' PosRk', asc:true}); }
  return cols;
}

function srcRows(){
  const table = (DATA.sourceTables && DATA.sourceTables[scoringKey(L())] && DATA.sourceTables[scoringKey(L())][srcTab]) || [];
  let list = table.filter(r=> SRC_POOL.has(r.i));
  if(srcPos.size)  list=list.filter(r=> srcPos.has(SRC_POOL.get(r.i).p));
  if(srcQuery)     list=list.filter(r=> (SRC_POOL.get(r.i).n||'').toLowerCase().includes(srcQuery));
  const val = r => srcSort==='name' ? String(SRC_POOL.get(r.i).n||'').toLowerCase() : r[srcSort];
  return list.slice().sort((a,b)=>{
    const x=val(a), y=val(b);
    if(x==null && y==null) return 0;
    if(x==null) return 1;
    if(y==null) return -1;
    const c = typeof x==='string' ? x.localeCompare(y) : x-y;
    return srcAsc? c : -c;
  });
}

function onSrcSort(key, asc){

let cmpSort  = store.get('gd.cmpSort','cons');
let cmpAsc   = store.get('gd.cmpAsc','')==='1';
const srcMapCache={};
/** Sources table name -> {fpId -> that source's own row}, for its own positional ranks. */
function sourceRowMaps(sc){
  if(srcMapCache[sc]) return srcMapCache[sc];
  const out={}, t=(DATA.sourceTables&&DATA.sourceTables[sc])||{};
  Object.keys(t).forEach(name=>{ out[name]=new Map(t[name].map(r=>[r.i,r])); });
  return srcMapCache[sc]=out;
}

function onCmpSort(key, asc){
  if(cmpSort===key) cmpAsc=!cmpAsc; else { cmpSort=key; cmpAsc=!!asc; }

function cmpHead(key, content, o){

/**
 * Every source's number for every player, side by side, for this week or rest of
 * season - the table for judging the sources against each other. The number under
 * each source's value is that source's OWN rank at the position, so a source that
 * has a player far from where the others do stands out on both lines. Consensus,
 * its ranks and the range across sources come from the same fixed tables as every
 * other page; nothing here is ranked over the filtered list.
 */
function buildCompareList(){
  while(SRC_LIST.firstChild) SRC_LIST.removeChild(SRC_LIST.firstChild);
  const l=L(), sc=scoringKey(l), mode=cmpMode, prof=consStore.active();
  const matrix=consMatrix(sc), cons=consTable(sc,prof), maps=sourceRowMaps(sc), stale=staleSet();
  const mineIds=new Set(); myTeams(l).forEach(t=> t.players.forEach(p=> mineIds.add(p.i)));
  const srcs=CONS_SRC.filter(x=> mode==='wk' || x.ros);
  const rkKey = mode==='wk'? 'wkRk' : 'rosRk';

  let list=[...SRC_POOL.values()].filter(p=>{ const e=matrix.get(p.i); return e && Object.keys(e[mode]).length; });
  if(cmpScope==='mine') list=list.filter(p=> mineIds.has(p.i));
  else if(cmpScope==='fa') list=list.filter(p=> !ROSTER.has(p.i));
  if(srcPos.size) list=list.filter(p=> srcPos.has(p.p));
  if(srcQuery)    list=list.filter(p=> (p.n||'').toLowerCase().includes(srcQuery));

  const cOf = p=>{ const e=cons.get(p.i); return e && e[mode]; };
  const keyOf = {
    name:  p=> String(p.n||'').toLowerCase(),
    cons:  p=> (cOf(p)||{}).v,
    rk:    p=> (cOf(p)||{}).rk,
    pr:    p=> (cOf(p)||{}).pr,
    spread:p=>{ const c=cOf(p); return c && c.n>1? c.hi-c.lo : null; },
  };
  srcs.forEach(x=>{ keyOf['s-'+x.k]=p=>{ const e=matrix.get(p.i); return e? e[mode][x.k] : null; }; });
  const get=keyOf[cmpSort]||keyOf.cons;
  list.sort((a,b)=>{
    const x=get(a), y=get(b);
    if(x==null && y==null) return 0;
    if(x==null) return 1;
    if(y==null) return -1;
    const c = typeof x==='string'? x.localeCompare(y) : x-y;
    return cmpAsc? c : -c;
  });

  const header=el('header');
  header.append(el('h3',null,'Compare · '+(mode==='wk'? 'Week '+DATA.week : 'Rest of season ('+rosSpan()+')')));
  header.append(el('div','spacer'));
  header.append(el('span','pcount total', list.length+' players'));
  SRC_LIST.append(header);
  if(!list.length){ const b=el('div','pbody'); b.append(emptyState('No players match','Loosen a filter, or clear the search.')); SRC_LIST.append(b); return; }

  const wrap=el('div','scroll'), t=el('table','fixed'), cg=el('colgroup');
  const widths=[236,118,58,44,56,84].concat(srcs.map(()=>60));
  widths.forEach(w=>{ const co=el('col'); co.style.width=w+'px'; cg.append(co); });
  t.append(cg);
  const thead=el('thead'), br=el('tr');
  [['',2],['Consensus · '+prof.name,4],[(mode==='wk'? 'Week '+DATA.week : 'Rest of season')+' · each source as published',srcs.length]].forEach(([lab,n])=>{
    const th=el('th',lab?'band':'',lab); th.colSpan=n; br.append(th);
  });
  thead.append(br);
  const hr=el('tr');
  hr.append(cmpHead('name','Player',{asc:true}));
  hr.append(el('th',null,'Roster'));
  hr.append(cmpHead('cons','Pts',{r:1,sep:1,title:'Consensus points'}));
  hr.append(cmpHead('rk','Rk',{r:1,asc:true,title:'Consensus rank over every player'}));
  hr.append(cmpHead('pr','PosRk',{r:1,asc:true,title:'Consensus rank within position'}));
  hr.append(cmpHead('spread','Range',{r:1,title:'Lowest to highest source, each on the consensus level. Sort to find where the sources disagree most'}));
  srcs.forEach((x,i)=>{
    const h=srcHead(x.k);
    const th=cmpHead('s-'+x.k, h.node, {r:1, sep:i===0, title:h.title});
    if(stale.has(x.k)) th.classList.add('stalecol');
    hr.append(th);
  });
  thead.append(hr); t.append(thead);

  const tb=el('tbody');
  list.forEach(p=>{
    const tr=el('tr'), e=matrix.get(p.i), c=cOf(p);
    tr.append(playerCell2(p));
    tr.append(rosterBadgeCell(p));
    const pts=stackCell(fmt(c&&c.v, mode==='wk'?1:0), null, {sep:1, big:1});
    pts.title=consTip(p, parseHz(mode==='wk'? 'w-'+DATA.week : 'ros'));
    tr.append(pts);
    tr.append(Object.assign(el('td','r num'),{textContent: c&&c.rk!=null? String(c.rk) : '—'}));
    tr.append(Object.assign(el('td','r num'),{textContent: c&&c.rk!=null? (c.pos||'')+c.pr : '—'}));
    tr.append(Object.assign(el('td','r num note'),{textContent: c&&c.n>1? fmt(c.lo, mode==='wk'?1:0)+'–'+fmt(c.hi, mode==='wk'?1:0) : '—'}));
    srcs.forEach(x=>{
      const v=e? e[mode][x.k] : null;
      const row=maps[x.t] && maps[x.t].get(p.i);
      const rk=row? row[rkKey] : null;
      const td=stackCell(fmt(v, mode==='wk'?1:0), rk!=null? (p.p||'')+rk : '', {});
      if(stale.has(x.k) || !(Number(prof[mode][x.k])>0) || (e && e.partial[x.k])) td.classList.add('dim');
      if(v!=null){
        const parts=[SOURCES[x.k].full];
        if(mode==='ros' && e.rosRaw[x.k]!==v) parts.push('published '+fmt(e.rosRaw[x.k])+', this week’s game (already played) taken out');
        if(stale.has(x.k)) parts.push('stale — left out of the consensus');
        else if(!(Number(prof[mode][x.k])>0)) parts.push('weight 0 in this profile');
        else if(e.partial[x.k]) parts.push('partly priced — left out of the consensus');
        td.title=parts.join(' · ');
      }
      tr.append(td);
    });
    tb.append(tr);
  });
  t.append(tb); wrap.append(t); SRC_LIST.append(wrap);
}

function buildSourceList(){
  if(!SRC_LIST) return;
  if(srcTab==='consensus') return buildConsensusList();
  if(srcTab==='compare') return buildCompareList();

const SEASON_KIND = {

/**

    ['Rest of season','A total from this week through week 18. Revised means the source updates it as weeks pass; static means it is a full-season projection that ignores results, so this app subtracts what the source itself projected for the weeks already played, never the actual points.'],
    ['Actual','What a player really scored. Only the FantasyPros API (season to date and per week) and WinWithOdds (weekly) publish it.'],
  ].forEach(([k,v])=>{ const r=el('div','gline'); r.append(el('b',null,k)); r.append(el('span',null,v)); g.append(r); });

      ['Includes this week', ({yes:'Yes', no:'No', 'n/a':'Not applicable', unclear:'Unclear \u2014 see below'})[sc.includesThisWeek] || 'Unclear'],
      ['Rest of season here', sc.rosUsed],
      ['Actual points', sc.actuals],
      ['Scoring', sc.scoring],
      ['Last pulled', fr? fr.age+(fr.stale? ' — past its refresh window' : '') : 'no sync recorded'],
      ['Measured', sc.evidence],
    ];

/** Each source's error against what players actually scored, for every completed week. */
function accuracyPanels(){
  const acc = DATA.accuracy && DATA.accuracy[scoringKey(L())];
  const out=[];
  if(!acc){
    out.push(panel('Accuracy', null, emptyState('Nothing to score yet',
      'This needs a completed week and the FantasyPros API’s per-week actuals (`FP_API_KEY`, then `npm run fp:sync`).')));
    return out;
  }
  const rowsFor=(stats)=> SRC_ORDER.filter(k=>stats[k]).map(k=>({k, st:stats[k]}));
  const build=(stats, title, sub)=>{
    const rows=rowsFor(stats);
    const best=Math.min(...rows.map(r=>r.st.mae));
    const trs=rows.map(({k,st})=>{
      const tr=el('tr');
      tr.append(Object.assign(el('td'),{textContent:srcMeta(k).label}));
      tr.append(Object.assign(el('td','r num'),{textContent:String(st.n)}));
      const mae=el('td','r num'+(st.mae===best?' bestcell':'')); mae.textContent=fmt(st.mae,2); tr.append(mae);
      const bias=el('td','r num'); bias.textContent=(st.bias>0?'+':'')+fmt(st.bias,2);
      bias.title=st.bias>0? 'Runs high: projects more than players scored' : (st.bias<0? 'Runs low: projects less than players scored' : 'Unbiased');
      tr.append(bias);
      tr.append(Object.assign(el('td','r num'),{textContent:fmt(st.rmse,2)}));
      tr.append(Object.assign(el('td','r num'),{textContent:st.corr==null? '—' : fmt(st.corr,2)}));
      return tr;
    });
    return panel(title, sub, table([{label:'Source'},{label:'Players',r:1},{label:'MAE',r:1},{label:'Bias',r:1},{label:'RMSE',r:1},{label:'Corr',r:1}], trs));
  };
  out.push(build(acc.common.sources, 'Same players for every source', acc.common.n+' player-weeks all sources priced · week'+(acc.weeks.length>1?'s ':' ')+acc.weeks.join(', ')));
  out.push(build(acc.sources, 'Each source on the players it covers', 'a narrow source (Draft Sharks, First Down) prices mostly starters, so its errors are not comparable to a broad one’s'));
  const rd=el('div','pbody');
  [
    ['MAE','Mean absolute error in points per player-week — lower is better; the best is shaded.'],
    ['Bias','Projection minus actual, averaged. Positive runs high, negative low; a source with a steady bias can be corrected for, one with a large error cannot.'],
    ['RMSE','Like MAE but punishes big misses harder.'],
    ['Corr','How well it ranks players against their results, whatever its level. 1 is perfect.'],
    ['Caveat', acc.note],
  ].forEach(([k,v])=>{ const r=el('div','gline'); r.append(el('b',null,k)); r.append(el('span',null,v)); rd.append(r); });
  out.push(panel('Reading this', null, rd));
  return out;
}

/** The pool, with every profile's consensus points and positional rank side by side. */
function buildConsensusList(){
  while(SRC_LIST.firstChild) SRC_LIST.removeChild(SRC_LIST.firstChild);
  const sc=scoringKey(L());
  const profs=consStore.profiles();
  const tables=profs.map(pf=>consTable(sc,pf));
  const sortKey = consSort || consKeyFor(consStore.active().id,'wk');
  const valOf=(p,key)=>{
    const [pid,c]=key.split(':'); const idx=profs.findIndex(x=>x.id===pid); if(idx<0) return null;
    const e=tables[idx].get(p.i); if(!e) return null;
    const cell=(c==='wk'||c==='wkpos')? e.wk : e.ros; if(!cell) return null;
    return (c==='wk'||c==='ros')? cell.v : cell.pr;
  };
  let list=[...SRC_POOL.values()].filter(p=> tables.some(t=>t.has(p.i)));
  if(srcPos.size)  list=list.filter(p=> srcPos.has(p.p));
  if(srcQuery)     list=list.filter(p=> (p.n||'').toLowerCase().includes(srcQuery));
  const asc = consSort? consAsc : false;
  const isRank = /pos$/.test(sortKey);
  list.sort((a,b)=>{
    const x=valOf(a,sortKey), y=valOf(b,sortKey);
    if(x==null && y==null) return 0;
    if(x==null) return 1;
    if(y==null) return -1;
    // Points sort high-first, ranks low-first, unless the header was flipped.
    const c = isRank? x-y : y-x;
    return asc? -c : c;
  });
  const header=el('header');
  header.append(el('h3',null,'Consensus'));
  header.append(el('div','spacer'));
  header.append(el('span','pcount total', list.length+' players'));
  SRC_LIST.append(header);
  if(!list.length){
    const b=el('div','pbody'); b.append(emptyState('No consensus','Loosen the filters, or give at least one source a weight.')); SRC_LIST.append(b); return;
  }
  const wrap=el('div','scroll');
  const t=el('table','fixed');
  const cg=el('colgroup');
  [236,110].concat(profs.flatMap(()=>[64,64,64,64])).forEach(w=>{ const co=el('col'); co.style.width=w+'px'; cg.append(co); });
  t.append(cg);
  const thead=el('thead');
  const br=el('tr');
  br.append(el('th',null,'')); br.append(el('th',null,''));
  profs.forEach(pf=>{ const th=el('th','band',pf.name); th.colSpan=4; br.append(th); });
  thead.append(br);
  const hr=el('tr');
  const th0=el('th',null,'Player'); hr.append(th0);
  hr.append(el('th',null,'Roster'));
  const sortTh2=(pid,c,label,first)=>{
    const key=consKeyFor(pid,c), on=sortKey===key;

  };
  profs.forEach(pf=>{
    hr.append(sortTh2(pf.id,'wk','Wk',true)); hr.append(sortTh2(pf.id,'wkpos','Wk Rk')); hr.append(sortTh2(pf.id,'ros','ROS')); hr.append(sortTh2(pf.id,'ros'+'pos','ROS Rk'));

/** The three switches that decide how the consensus is built - see the top of src/consensus.js for why each exists. */
function consSettingsPanel(){

  };

  body.append(row(box('calibrate'), 'Scale each source to FantasyPros’ level before averaging',
    'without this a player’s rank depends on how many low-running sources happen to cover him (rest-of-season figures run 0.8–0.95× of FantasyPros’)'));

/** The source-by-source audit: is each one current, on the level it claims, and what does its ROS count. */
function healthPanels(){
  const out=[], sc=scoringKey(L()), matrix=consMatrix(sc), calib=consCalib(sc);
  const stats=sourceStats(matrix, posOfFor(sc), calib), stale=staleSet(), prof=consStore.active();
  const wk=DATA.week;

  // The week in progress: which games are final, and which sources still count them.
  const finals=[];
  Object.keys((DATA.schedule&&DATA.schedule.teams)||{}).forEach(t=>{
    const c=DATA.schedule.teams[t].weeks && (DATA.schedule.teams[t].weeks[wk]||DATA.schedule.teams[t].weeks[String(wk)]);
    if(c && c.final) finals.push(t);
  });
  const dropped=matrix.dropped||{};
  const still=CONS_SRC.filter(x=>x.ros && dropped[x.k]===false).map(x=>SOURCES[x.k].ab);
  const gone=CONS_SRC.filter(x=>x.ros && dropped[x.k]===true).map(x=>SOURCES[x.k].ab);
  const unk=CONS_SRC.filter(x=>x.ros && dropped[x.k]==null).map(x=>SOURCES[x.k].ab);
  const wb=el('div','pbody');
  const line=(k,v)=>{ const r=el('div','gline'); r.append(el('b',null,k)); r.append(el('span',null,v)); wb.append(r); };
  line('Rest of season means', 'Weeks '+wk+'–'+LAST_WEEK+' for every source that publishes one, as of each source’s own update time below. Nothing here includes week '+(wk-1)+' or earlier.');
  line('Week '+wk+' so far', finals.length? (finals.length/2)+' game'+(finals.length===2?'':'s')+' final ('+finals.sort().join(', ')+')' : 'no games final yet');
  if(finals.length){
    line('Still count them', still.length? still.join(', ')+' — their ROS still includes the finished game' + (consStore.settings().rollForward? ', which the consensus takes back out using each source’s own projection for it.' : '. Roll-forward is OFF, so the finished games are counted.') : 'none');
    if(gone.length) line('Already dropped them', gone.join(', '));
    if(unk.length) line('Cannot tell', unk.join(', ')+' — too few players to measure');
  }
  out.push(panel('Where the season stands', 'week '+wk, wb));

  const fmtAge=h=> h==null? 'unknown' : (h<1? Math.max(1,Math.round(h*60))+'m' : (h<48? Math.round(h)+'h' : Math.round(h/24)+'d'))+' ago';
  const rows=CONS_SRC.map(x=>{
    const st=stats[x.k], meta=srcMeta(x.t), basis=(DATA.rosBasis&&DATA.rosBasis[x.t])||{};
    const age=srcAge(x.k), isStale=stale.has(x.k), a=DATA.sourceAsOf&&DATA.sourceAsOf[x.k];
    const tr=el('tr');

    const upd=el('td'); upd.append(Object.assign(el('div'),{textContent:fmtAge(age)}));
    if(a&&a.asOf) upd.append(Object.assign(el('div','ss'),{textContent:new Date(a.asOf).toLocaleString([], {weekday:'short',hour:'numeric',minute:'2-digit'})+(a.siteAt?' · site clock':' · our pull')}));
    tr.append(upd);
    const stt=el('td');
    const wkW=Number(prof.wk[x.k])>0, rosW=x.ros && Number(prof.ros[x.k])>0;
    if(isStale) stt.append(el('span','pill out','stale'));
    else if(wkW||rosW) stt.append(el('span','pill ok','in consensus'));
    else stt.append(el('span','pill gh','weight 0'));
    if(!isStale && wkW && x.ros && !rosW) stt.append(el('div','ss','week only'));
    tr.append(stt);
    const numTd=(v,d,suffix)=> Object.assign(el('td','r num'),{textContent: v==null? '—' : (d==null? String(v) : fmt(v,d))+(suffix||'')});
    tr.append(numTd(st.n.wk)); tr.append(x.ros? numTd(st.n.ros) : numTd(null));
    tr.append(numTd(st.cover.wk==null? null : Math.round(st.cover.wk*100), null, '%'));
    tr.append(x.ros? numTd(st.cover.ros==null? null : Math.round(st.cover.ros*100), null, '%') : numTd(null));
    tr.append(numTd(st.scale.wk, 2, '×'));
    tr.append(x.ros? numTd(st.scale.ros, 2, '×') : numTd(null));
    tr.append(numTd(st.corr.wk, 2));
    tr.append(x.ros? numTd(st.impliedGames, 1) : numTd(null));
    const b=el('td','wrapcell'); b.append(el('div',null,(x.rosKind==='none'? 'no ROS' : x.rosKind)));
    b.append(Object.assign(el('div','ss'),{textContent:basis.note||''}));
    tr.append(b);

    if(!x.ros) pg.append(el('span','note','—'));

    else if(dropped[x.k]===false) pg.append(el('span','pill q','still counts'));
    else pg.append(el('span','pill gh','unknown'));
    tr.append(pg);
    return tr;
  });
  const cols=[{label:'Source'},{label:'Updated'},{label:'State'},
    {label:'Wk',r:1,title:'Players it prices this week'},{label:'ROS',r:1,title:'Players it has a rest-of-season figure for'},
    {label:'Top150 wk',r:1,title:'Share of FantasyPros’ top 150 players this week that this source also prices'},{label:'Top150 ROS',r:1,title:'Same, rest of season'},
    {label:'Level wk',r:1,title:'Median ratio to FantasyPros over shared players. 0.95× means it runs 5% below FantasyPros. Divided out before averaging when scaling is on'},
    {label:'Level ROS',r:1,title:'Same, rest of season'},
    {label:'Corr wk',r:1,title:'How closely it orders players the way FantasyPros does, whatever its level (1 = identical)'},
    {label:'Games left',r:1,title:'Median rest-of-season ÷ this week’s projection for the same source: how many games its ROS figure is worth. About 16 for weeks 2–18 with a bye; far below means it is regressed hard or missing weeks'},
    {label:'ROS is built as'},{label:'Played game',title:'Does its rest-of-season figure still count games already played this week?'}];
  out.push(panel('Source health', prof.name+' profile · '+(consStore.settings().calibrate? 'scaled to FantasyPros’ level' : 'unscaled'),
    table2([{label:'',span:3},{label:'Coverage',span:4},{label:'Level & agreement',span:3},{label:'Rest of season',span:3}], cols, rows)));

  const nb=el('div','pbody');
  [
    ['Updated','The site’s own recompute time where it publishes one, otherwise when this app last pulled it. Sleeper, Draft Sharks and Yahoo are stored per week, so this is the age of THIS week’s record. A source older than the stale limit is left out of every consensus.'],
    ['Level','Sources do not project on the same scale, and the gap is bigger over a season than over a week. FantasyPros is the anchor because it has the broadest board.'],
    ['Games left','A sanity check on a ROS total: it should be worth about as many games as remain. First Down, FanDuel, WinWithOdds and Yahoo run well below FantasyPros, Sleeper and Draft Sharks — they regress harder or count fewer weeks, which is why level is divided out.'],
    ['Played game','Measured, not assumed: for teams whose game this week is final, does the source’s ROS come out about one game lighter than for teams still to play? Only sources whose ROS is published as-is can be tested; the summed and derived ones are built from this week on, so they include it.'],
  ].forEach(([k,v])=>{ const r=el('div','gline'); r.append(el('b',null,k)); r.append(el('span',null,v)); nb.append(r); });
  out.push(panel('Reading this', null, nb));
  out.push(consSettingsPanel());
  return out;
}

/**
 * Transactions as the manager made them.
 *
 * One row is one MOVE, not one player: the add and the drop that paid for it

  add:   {label:'Add',   cls:'ok'},

// The hash wins over the stored preference, so a standings link carries its
// own view and sort — the same contract My Team already had.
/** Which source the week-by-week grid reads. The consensus by default. */
let weekSrc=(v=>(v==='bl'||!v)?'cons':v)(store.get('gd.weekSrc','cons'));
function migrateHorizon(v){
  if(!v || v==='week') return 'w-'+(DATA.week||1);
  if(v==='ros') return 'ros';
  return parseHz(v).key;
}
let horizonKey=migrateHorizon(H.hz || H.scope || store.get('gd.horizon','') || store.get('gd.teamScope','') || store.get('gd.playerProj',''));

let standView=(H.view==='division'||H.view==='all')? H.view : store.get('gd.standView','all');
let standSort=H.sort || store.get('gd.standSort','rank');
let standFlip=H.desc? true : !!store.get('gd.standFlip','');
/** 'done' counts finished games only; 'proj' also counts games in progress. */
let standMode=(H.mode==='proj'||H.mode==='done')? H.mode : store.get('gd.standMode','done');
/** Which pairing the Matchup page is showing: a team id on either side. */
let muPick=H.mu || null;
/* ---------- week picker (My Team + Matchup) ----------
   DATA.week is "live", but the app also stores whole past weeks on disk. These
   two pages now let you re-open a stored week — its matchup board, its actual
   points — so this is the week they are showing. `viewWeek` is DATA.week unless
   a past week was explicitly picked; it travels in the hash on both pages. */
let viewWeek = (()=>{ const v=Number(H.wk); return (Number.isInteger(v)&&v>=1&&v<=(Number(DATA.week)||1))? v : (Number(DATA.week)||1); })();
/** Weeks the picker can show for a league: stored past weeks plus the live one, ascending. */
function pickerWeeks(l){
  const set=[Number(DATA.week)||1];
  Object.keys((l&&l.scoreBoard)||{}).forEach(w=>{ const n=Number(w); if(n>=1&&n!==(Number(DATA.week)||1)&&!set.includes(n)) set.push(n); });
  return set.sort((a,b)=>a-b);
}
/** True once a stored (non-live) week is picked. */
const viewingPast=(l)=> viewWeek!==(Number(DATA.week)||1);
/** The board shown for the picked week, always in `l.matchups` row shape. */
function boardFor(l){
  if(!viewingPast(l)) return l.matchups || null;
  const b=(l.scoreBoard||{})[String(viewWeek)];
  if(!b||!b.matchups) return null;
  return { ok: (b.matchups||[]).length>0, week: viewWeek, rows: b.matchups.map(m=>({
    status:m.status, pre:m.pre, final:m.final, minutesLeft:m.minutesLeft,
    winProb:m.winProb, result:m.result,
    sides:m.sides.map(s=>({ id:s.id, name:s.name, logo:s.logo, pts:s.pts, proj:s.proj,
      starters:s.starters||[], bench:s.bench||[] })) })) };
}
/** Per-player actuals for the picked week, keyed by fpId. */
const playerPtsFor=(l)=>{ const b=(l.scoreBoard||{})[String(viewWeek)]; return (b&&b.playerPts)||{}; };
/** A segmented week control, or null when there is nothing to switch between. */
function weekPicker(l){
  const weeks=pickerWeeks(l);
  // A week picked on one league may not be stored for the next one the user
  // opens; rather than orphan the picker on an option that is not there, fall
  // back to live, which every league has.
  if(viewingPast(l) && !weeks.includes(viewWeek)){ viewWeek=(Number(DATA.week)||1); store.set('gd.viewWeek',''); }
  if(weeks.length<2) return null;
  const bar=el('div','toggles');
  bar.append(segmented(weeks.map(w=>({
    label: w===(Number(DATA.week)||1)? 'Live' : String(w),
    value: String(w),
  })), String(viewWeek), v=>{ viewWeek=Number(v); store.set('gd.viewWeek',String(viewWeek)); writeHash(); render(); }));
  if(viewingPast(l)) bar.append(Object.assign(el('span','note'),{textContent:'Stored week '+viewWeek+' \u2014 scores as captured by the last sync, not live.'}));
  return bar;
}
let movesMine=!!store.get('gd.movesMine','');
/* The players page keeps its own filter state — it is the one page where a
   filter is a persistent choice (watch list, roster scope) rather than a

/**
 * How old every number on this site actually is.
 *
 * Two clocks, and conflating them is the mistake: "fetched" is when we pulled
 * it, "site said" is when the source itself last recomputed. A source can be
 * fetched a minute ago and be publishing yesterday's numbers, and without both
 * columns there is no way to tell that from a source that genuinely just moved.
 * Where a site publishes no recompute time, the column is honestly blank rather
 * than echoing our own clock back.
 */
function freshnessPanel(){
  const rows=(DATA.freshness||[]).map(f=>{
    const tr=el('tr'); if(f.stale) tr.className='benchrow';
    tr.append(Object.assign(el('td'),{textContent:SOURCE_LABEL[f.source]||f.source}));
    const a=el('td','r');
    a.append(el('span','delta '+(f.stale?'dn':'up'), f.age));
    a.title=f.fetchedAt? new Date(f.fetchedAt).toLocaleString() : '';
    tr.append(a);
    const sa=el('td','r');
    if(f.sourceAge){ sa.append(el('span','num',f.sourceAge)); sa.title='The site\u2019s own last-recomputed time: '+new Date(f.sourceAt).toLocaleString(); }
    else { sa.append(el('span','note','—')); sa.title='This source publishes no update time; age is ours alone.'; }
    tr.append(sa);
    tr.append(Object.assign(el('td','r num'),{textContent:f.items==null?'—':String(f.items)}));
    const st=el('td');
    if(f.failed) st.append(el('span','pill out',f.failed+' failed'));
    else st.append(el('span','pill '+(f.stale?'q':'ok'), f.stale?'stale':'fresh'));
    tr.append(st);
    return tr;
  });
  if(!rows.length){
    return panel('Data freshness', null, emptyState('No sync recorded yet','Run `npm run sync` to populate the ledger.'));
  }
  const stale=(DATA.freshness||[]).filter(f=>f.stale).length;
  const wrap=el('div');
  const left=[...staleSet()];
  if(left.length){
    const n=el('div','pbody');
    n.append(Object.assign(el('p','note'),{textContent:
      'Left out of every consensus for being older than '+consStore.settings().staleHours+'h: '
      + left.map(k=> SOURCES[k].ab+' ('+Math.round(srcAge(k)/24*10)/10+'d old)').join(', ')
      + '. Refresh it, or change the limit under Sources \u2192 Consensus. Yahoo has no automatic sync \u2014 it needs a logged-in capture (`yahoo:sync`).'}));
    wrap.append(n);
  }
  wrap.append(table([{label:'Source'},{label:'Fetched',r:1},{label:'Site said',r:1},{label:'Rows',r:1},{label:''}], rows));
  return panel('Data freshness', stale? stale+' source(s) past their refresh window \u2014 `npm run sync`' : 'everything current', wrap);
}
