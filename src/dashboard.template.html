}
function consRankCell(p,h,kind){
  const c=consFor(p,h);
  const td=el('td','r num');
  if(!c || c.rk==null){ td.textContent='\u2014'; return td; }
  td.textContent = kind==='rk'? String(c.rk) : (c.pos||'')+c.pr;
  td.title = 'Overall #'+c.rk+(c.pos? ' \u00b7 '+c.pos+c.pr : '')+' \u2014 fixed ranks over every player, the same on every page';
  return td;
}

/** The hover text on a source cell: what that number is, where it adds something. */
function srcTip(p,k,h){
  const mode=hzMode(h);
  const w=p.wwo||{}, d=p.fd||{}, fdl=p.fdl||{}, sl=p.sl||{}, ds=p.ds||{}, yh=p.yh||{};
  if(mode==='week'){
    const vr=p.vdist;
    switch(k){
      case 'fp':  return p.pr||(p.rk?'overall #'+p.rk:'');
      case 'vg':  return [
        p.vd!=null? 'vs FP '+(p.vd>0?'+':'')+fmt(p.vd) : '',
        vr&&vr.floor!=null&&vr.ceiling!=null? 'range '+fmt(vr.floor,0)+'–'+fmt(vr.ceiling,0) : '',
        vr&&vr.boom!=null? 'boom '+Math.round(vr.boom*100)+'% / bust '+Math.round(vr.bust*100)+'%' : '',
        p.vc===false? 'partly priced — left out of the consensus' : '',
        p.vol||''].filter(Boolean).join(' · ');
      case 'wwo': return (w.floor!=null&&w.ceiling!=null)? 'range '+fmt(w.floor,0)+'–'+fmt(w.ceiling,0) : '';
      case 'fd':  return d.rank!=null? String(p.p||'')+d.rank : '';
      case 'fdl': return [fdl.posRank!=null? String(p.p||'')+fdl.posRank : '', fdl.oppRank!=null? 'vs D#'+fdl.oppRank : ''].filter(Boolean).join(' · ');
      case 'sl':  return [sl.bye? 'On bye' : (oppLabel(p, DATA.week) || (sl.opp? 'vs '+sl.opp : '')), 'Sleeper published weekly'].filter(Boolean).join(' · ');
      case 'ds':  return [ds.opp||'', ds.sos!=null? 'SOS '+ds.sos+'%' : '', 'Draft Sharks weekly rankings'].filter(Boolean).join(' · ');
      case 'yh':  return [yh.bye? 'On bye' : (yh.opp? 'vs '+yh.opp : ''), 'Yahoo re-projection · this league’s scoring'].filter(Boolean).join(' · ');
    }
    return '';
  }
  if(mode==='ros'){
    switch(k){
      case 'fp':  return p.rosPr||(p.rosRk?'overall #'+p.rosRk:'');
      case 'wwo': return w.seasonProj!=null? 'season total '+fmt(w.seasonProj,0)+' (static) less what it projected for weeks played' : '';
      case 'fd':  return d.seasonProj!=null? 'season total '+fmt(d.seasonProj,0)+' (static) less what it projected for weeks played' : '';
      case 'fdl': return 'FanDuel REMAINING, as published';
      case 'sl':  return sl.left!=null? sl.left+' games left' : 'sum of published weeks';
      case 'ds':  return ds.sos!=null? 'SOS '+ds.sos+'% · sum of stored weeks' : 'sum of stored weeks';
      case 'yh':  return 'sum of captured weeks';
    }
    return '';
  }
  return srcValue(p,k,h).v!=null? 'published weeks, summed' : (PUBLISHED_WEEKLY.indexOf(k)>=0? 'not every week in this window is published' : 'publishes this week only');
}
function srcCell(p,k,h,first){
  const r=srcValue(p,k,h);
  const td=stackCell(fmt(r.v), null, {sep:first});
  let tip=srcTip(p,k,h);
  if(r.raw!=null){
    // Published figure still counts this week's game, which is already played.
    td.classList.add('rolled');
    tip=(tip? tip+' \u00b7 ' : '')+'published '+fmt(r.raw)+', less this week\u2019s game (already played)';
  }
  if(tip) td.title=tip;
  return td;
}

/* The helpers below take an optional `cols` list: a page that owns its columns (a My Team tab)
   passes them; everything else gets the shared set for the scope. */
function projBands(scope, cols){
  const bands=[{label:'',span:1}];
  (cols||columnsFor(scope)).forEach(c=>{
    const last=bands[bands.length-1];
    if(last.label===c.band && bands.length>1) last.span++; else bands.push({label:c.band||'',span:1});
  });
  return bands;
}
function projCols(scope, cols){ return [{label:'Player', w:250}].concat(cols||columnsFor(scope)); }

function scoredCell(p){
  const td=el('td','r tsep');
  // On the board at all — a slot or a game status means the live fetch saw him,
  // whether or not he has points yet.
  const onBoard = p.lslot!=null || p.lgame!=null;
  const started = !!(p.lgame && p.lgame!=='Not Started');
  const v = onBoard? p.lp : (p.wwo? p.wwo.actual : null);
  // A kickoff that has not happened is not a zero. Falling through to the
  // generic file here printed 0.0 for every player yet to play.
  const show = (onBoard && !started) || v==null ? '—' : fmt(v);
  const d=el('div','scored'+(show==='—'||Number(v)===0? ' zero':'')+(onBoard?'':' approx'));
  d.textContent=show;
  td.append(d);
  td.title = onBoard
    ? (p.lgame||'')+(started? ' \u00b7 this league\u2019s scoring' : ' \u00b7 projected '+fmt(p.lproj))
    : (v==null? 'No actual yet' : fmt(v)+' \u00b7 generic PPR (not on any lineup in this league)');
  return td;
}

function projCells(tr,p,scope,cols){

function scopeTotal(players,scope){
  const h=hzOf(scope);

}
function totalsRow(list, scope, label, cols){
  const tr=el('tr','totrow');
  tr.append(el('td',null,label));

function lineupTableView(lu, scope, cols){
  const rows=[];
  const add=(p,bench)=>{
    const tr=el('tr'); if(bench) tr.className='benchrow';
    if(!p.i && !p.n){
      const td=el('td');
      const w=el('div','prow'); w.append(posChip(bench?'BN':p.slot,'slot')); w.append(el('span','note','empty'));
      td.append(w); tr.append(td);
      const n=projCols(scope,cols).length-1;
      for(let k=0;k<n;k++) tr.append(el('td','r','—'));
      rows.push(tr); return;
    }
    tr.append(rosterCell(p, bench?'BN':p.slot));
    projCells(tr,p,scope,cols);
    rows.push(tr);
  };
  lu.starters.forEach(p=>add(p,false));
  rows.push(totalsRow(lu.starters, scope, 'Starters', cols));

  return table2(projBands(scope,cols), projCols(scope,cols), rows);

function positionTableView(players, scope, cols){
  const groups=new Map();
  players.slice().sort(byPos).forEach(p=>{

    if(!groups.has(k)) groups.set(k,[]);
    groups.get(k).push(p);

  const rows=[];

  [...groups.entries()].forEach(([pos,list])=>{
    const hr=el('tr','grouphdr');

    list.forEach(p=>{ const tr=el('tr'); tr.append(rosterCell(p,null)); projCells(tr,p,scope,cols); rows.push(tr); });
  });
  return table2(projBands(scope,cols), projCols(scope,cols), rows);

function rosterTable(players, scope){

/**
 * Look-ahead window. Shared by My Team, Players, All Rosters and Week by Week so a
 * three-week spike is the same number everywhere, not a different toggle on each
 * page. Parsing, labelling and the option list are src/weekhorizon.js, inlined
 * (the same file the tests run); only what needs this page's `DATA` is here.
 *
 * Keys: w-7, n-3 (next 3 from now), p (playoffs 15\u201317), ros, szn.
 */
/*__HORIZON__*/
const parseHz = raw=> parseHorizon(raw, {now: DATA.week||1});
const hzWeeks = weeksIn;
const labelHz = h=> labelHorizon(h, {now: DATA.week||1});
const hzOptions = ()=> horizonOptions({now: DATA.week||1});
/** week: the current week alone; span: any other run of weeks; ros: rest of season or the full season. */
function hzMode(h){
  if(!h) return 'week';
  if(h.kind==='ros'||h.kind==='season') return 'ros';
  if(h.kind==='week' && h.from===DATA.week) return 'week';
  return 'span';
}
function hz(){ return parseHz(horizonKey); }
function setHorizon(v){
  horizonKey=parseHz(v).key;
  store.set('gd.horizon', horizonKey);
  writeHash(); render();
}
function horizonSelect(){

  wrap.append(document.createTextNode('Window'));

    s.append(opt);
  });

/** Which consensus profile the Consensus columns show. Weights are edited on the Sources page. */
function consensusSelect(){

  wrap.append(document.createTextNode('Consensus'));

/** The window and consensus pickers, side by side — the two things that decide what every projection column means. */
function viewControls(){

  w.append(horizonSelect(), consensusSelect());

}

function teamAbbr(t){
  const x=String(t||'').toUpperCase().replace(/[^A-Z]/g,'');
  return ({JAX:'JAC', WSH:'WAS', LA:'LAR', SD:'LAC', OAK:'LV'})[x] || x;
}
function schedFor(p, w){
  const rec=DATA.schedule && DATA.schedule.teams && DATA.schedule.teams[teamAbbr(p.t)];
  if(!rec) return null;
  if(rec.bye===w) return {bye:true, opp:null, home:null};
  const cell=rec.weeks && (rec.weeks[w]||rec.weeks[String(w)]);
  return cell? {bye:false, opp:cell.opp, home:!!cell.home} : null;
}
function isBye(p, w){
  const s=schedFor(p,w);
  if(s) return !!s.bye;
  if(p.sch && p.sch.bye===w) return true;
  if(p.sl && p.sl.byes && p.sl.byes.indexOf(w)>=0) return true;
  if(p.ds && p.ds.byes && p.ds.byes.indexOf(w)>=0) return true;
  if(p.yh && p.yh.byes && p.yh.byes.indexOf(w)>=0) return true;
  return false;
}
function oppLabel(p, w){
  if(isBye(p,w)) return 'BYE';
  const s=schedFor(p,w);
  if(s && s.opp) return s.home? s.opp : '@'+s.opp;
  if(w===DATA.week && p.opp) return p.opp;
  const ds=(p.ds&&p.ds.crv||[]).find(r=>r[0]===w);
  if(ds && ds[2]) return ds[2];
  const yh=(p.yh&&p.yh.crv||[]).find(r=>r[0]===w);
  if(yh && yh[2]) return yh[2];
  const sl=p.sl && p.sl.opp && w===DATA.week? p.sl.opp : null;
  return sl || '—';
}
function ptsFromCrv(crv, w){
  if(!crv) return null;
  const row=crv.find(r=>r[0]===w);
  return row && row[1]!=null? row[1] : null;
}
const ROS_OF = {
  fp:  p=> p.ros,
  wwo: p=> p.wwo && p.wwo.rosDerived,
  fd:  p=> p.fd && p.fd.rosDerived,
  fdl: p=> p.fdl && p.fdl.rosDerived,
  sl:  p=> p.sl && p.sl.ros,
  ds:  p=> p.ds && p.ds.ros,
  yh:  p=> p.yh && p.yh.ros,
};
const WEEK_OF = {
  fp:  p=> p.wk,
  vg:  p=> p.vg,
  wwo: p=> p.wwo && p.wwo.proj,
  fd:  p=> p.fd && p.fd.proj,
  fdl: p=> p.fdl && p.fdl.proj,
  sl:  p=> p.sl && !p.sl.bye && p.sl.wk,
  ds:  p=> p.ds && !p.ds.bye && p.ds.wk,
  yh:  p=> p.yh && !p.yh.bye && p.yh.wk,
};
/** The two sources whose own number IS a full-season total (static — see the Sources guide). Every other source's season figure is played + its rest-of-season. */
const SEASON_OF = {
  wwo: p=> p.wwo && p.wwo.seasonProj,
  fd:  p=> p.fd && p.fd.seasonProj,
};
const round2 = v=> Math.round(v*100)/100;

/**
 * Points already scored this season. Rostered players carry it; a pool row
 * gets it from the FantasyPros source table.
 */
function playedPts(p){
  if(p.pts!=null) return p.pts;
  const row=consMatrix(scoringKey(L())).get(p.i);
  return row && row.act!=null? row.act : 0;
}

/**
 * The number a source itself published for one week, or nothing.
 *
 * Sleeper, Draft Sharks and Yahoo publish a number for every remaining week.
 * Every other source publishes THIS week only, so any other week is blank for
 * them — there is deliberately no spreading of a season total across weeks: a
 * cell is either what the site said or it is empty.
 */
function weekValue(p, src, wk){
  if(isBye(p,wk)) return {v:null, bye:true};
  if(PUBLISHED_WEEKLY.indexOf(src)>=0){
    const o=p[src];
    if(!o) return {v:null};
    const v=ptsFromCrv(o.crv, wk);
    if(v!=null) return {v, real:true};
    if(wk===DATA.week && o.wk!=null && !o.bye) return {v:o.wk, real:true};
    return {v:null};
  }
  if(wk===DATA.week){
    const f=WEEK_OF[src], v=f && f(p);
    if(v!=null && v!==false) return {v, real:true};
  }
  return {v:null};
}

/**
 * A source over a window.
 *
 * Rest of season uses each source's rest-of-season figure as published (or, for
 * the sources that publish weeks not totals, the sum of those weeks). A span of
 * weeks sums published weeks and needs ALL of them: a three-week window with two
 * weeks published is not a smaller three-week number, it is a wrong one, so it
 * is left blank instead.
 */
function horizonValue(p, src, h){
  if(!h) h=hz();
  if(h.kind==='season'){
    const own=SEASON_OF[src], ros=ROS_OF[src];
    const v = own? own(p) : (ros && ros(p)!=null && ros(p)!==false? Number(ros(p))+playedPts(p) : null);
    return v!=null && v!==false? {v:round2(v), real:true} : {v:null};
  }
  if(h.kind==='ros'){
    const f=ROS_OF[src], v=f && f(p);
    return v!=null && v!==false? {v:round2(v), real:true} : {v:null};
  }
  let tot=0, need=0, have=0;
  const weeks=hzWeeks(h);
  weeks.forEach(w=>{
    const r=weekValue(p, src, w);
    if(r.bye) return;
    need++;
    if(r.v!=null){ tot+=r.v; have++; }
  });
  if(weeks.length && !need) return {v:null, bye:true};
  if(!need || have<need) return {v:null};
  return {v:round2(tot), real:true, n:have};
}

/* ---------- consensus ----------
   A weighted average of whichever sources have a number for a player, with the
   weights set by you. Several named profiles, each with its own weight per source
   for this week and for rest of season, all kept in this browser.

   The derivation itself is NOT in this file: it is src/consensus.js, inlined
   below, which is the same file the tests run. What it does that a plain average
   does not: each source is first scaled onto FantasyPros' level (their median
   ratio over shared players), stale sources are left out, and a rest-of-season
   figure that still counts a game already played is rolled forward. Ranks are
   computed ONCE per table, over every player, and only looked up afterwards - so
   a rank never depends on the sort, the filter or the page.

   The two anchor windows (this week, rest of season) read one universe-wide
   matrix, which is what makes every page agree. Other windows (next 3 weeks,
   playoffs, a specific week) average what the sources published for those weeks,
   without a rank. */

/*__CONSENSUS__*/

const weightSet = keys => Object.fromEntries(CONS_SRC.map(s=>[s.k, keys.indexOf(s.k)>=0? 1 : 0]));
const DEFAULT_PROFILES = [
  {id:'all',    name:'All sources',      wk:weightSet(['fp','vg','wwo','fd','fdl','sl','ds','yh']), ros:weightSet(['fp','wwo','fd','fdl','sl','ds','yh'])},
  {id:'expert', name:'Experts & feeds',  wk:weightSet(['fp','sl','ds','yh']),                       ros:weightSet(['fp','sl','ds','yh'])},
  {id:'market', name:'Sportsbook',       wk:weightSet(['vg','wwo','fd','fdl']),                     ros:weightSet(['wwo','fd','fdl'])},
];
/** How the consensus is built, beyond the weights. All three are on by default because each one fixes a way the plain average misleads. */
const DEFAULT_SETTINGS = {calibrate:true, rollForward:true, staleHours:DEFAULT_STALE_HOURS};
const consStore = (()=>{
  const KEY='gd.consensus';
  const fresh = ()=> ({profiles: JSON.parse(JSON.stringify(DEFAULT_PROFILES)), active:'all', settings:{...DEFAULT_SETTINGS}});
  // A stored profile is trusted only field by field: anything missing or not a
  // finite non-negative number falls back to the default for that slot.
  const clean = raw=>{
    const base=fresh();
    try{
      const j=JSON.parse(raw||'null');
      if(!j || !Array.isArray(j.profiles)) return base;
      const profiles=base.profiles.map((d,i)=>{
        const s=j.profiles[i]||{};
        const pick=(set)=> Object.fromEntries(CONS_SRC.map(x=>{ const v=Number(s[set] && s[set][x.k]); return [x.k, Number.isFinite(v)&&v>=0? v : d[set][x.k]]; }));
        return {id:d.id, name:String(s.name||d.name).slice(0,24), wk:pick('wk'), ros:pick('ros')};
      });
      const st=j.settings||{};
      const hours=Number(st.staleHours);
      const settings={
        calibrate: st.calibrate==null? DEFAULT_SETTINGS.calibrate : !!st.calibrate,
        rollForward: st.rollForward==null? DEFAULT_SETTINGS.rollForward : !!st.rollForward,
        staleHours: Number.isFinite(hours)&&hours>=0? hours : DEFAULT_SETTINGS.staleHours,
      };
      return {profiles, active: profiles.some(x=>x.id===j.active)? j.active : profiles[0].id, settings};
    }catch{ return base; }
  };
  let state=clean(store.get(KEY,''));
  let version=0;
  const persist=()=>{ version++; store.set(KEY, JSON.stringify(state)); };
  return {
    profiles: ()=>state.profiles,
    active: ()=> state.profiles.find(x=>x.id===state.active) || state.profiles[0],
    settings: ()=> state.settings,
    setActive: id=>{ state.active=id; persist(); },
    setSetting: (k,v)=>{ state.settings[k]=v; persist(); },
    rename: (id,name)=>{ const p=state.profiles.find(x=>x.id===id); if(p){ p.name=String(name||'').trim().slice(0,24)||p.name; persist(); } },
    setWeight: (id,set,k,v)=>{ const p=state.profiles.find(x=>x.id===id); if(p){ p[set][k]=v; persist(); } },
    reset: ()=>{ state=fresh(); persist(); },
    version: ()=>version,
  };
})();

/** fpId -> the one row for that player, for one scoring format. */
const universeCache={};
function universe(sc){ return universeCache[sc] || (universeCache[sc]=new Map((DATA.pools[sc]||[]).map(p=>[p.i,p]))); }
const posOfFor = sc => id=>{ const p=universe(sc).get(id); return p? p.p : null; };
/** True once this player's team has played its game for the current week. */
function gamePlayed(team, wk){
  const rec=DATA.schedule && DATA.schedule.teams && DATA.schedule.teams[teamAbbr(team)];
  const c=rec && rec.weeks && (rec.weeks[wk]||rec.weeks[String(wk)]);
  return !!(c && c.final);
}

/** How old a source's numbers for this week are, in hours, or null when unknown. */
function srcAge(k){
  const a=DATA.sourceAsOf && DATA.sourceAsOf[k];
  return a && a.asOf? (Date.now()-new Date(a.asOf).getTime())/3600000 : null;
}
/** Sources left out of every consensus for being older than the stale-after setting (0 turns this off). */
function staleSet(){
  const s=new Set(), h=consStore.settings().staleHours;
  if(!(h>0)) return s;
  CONS_SRC.forEach(x=>{ const a=srcAge(x.k); if(a!=null && a>h) s.add(x.k); });
  return s;
}

/**
 * fpId -> every source's number for this week and for rest of season, from the
 * Sources tables. See buildMatrix for how a played game is rolled out of ROS.
 */
const matrixCache={};
function consMatrix(sc){
  const rf=consStore.settings().rollForward, key=sc+'|'+(rf?1:0);
  if(matrixCache[key]) return matrixCache[key];
  const uni=universe(sc);
  matrixCache[key]=buildMatrix((DATA.sourceTables && DATA.sourceTables[sc]) || {}, {
    rollForward: rf,
    played: id=>{ const p=uni.get(id); return !!p && gamePlayed(p.t, DATA.week); },
  });
  return matrixCache[key];
}
const calibCache={};
function consCalib(sc){
  const key=sc+'|'+(consStore.settings().rollForward?1:0);
  return calibCache[key] || (calibCache[key]=calibration(consMatrix(sc), posOfFor(sc)));
}
/** The scale factor a source is divided by before it is averaged; 1 when scaling is off. */
function srcFactor(sc, mode, k, pos){
  return consStore.settings().calibrate? factorFor(consCalib(sc), mode, k, pos) : 1;
}

/** Every player's consensus for one profile, ranked once across the whole universe: overall and within position. */
const consCache={};
function consTable(sc, prof){
  const st=consStore.settings(), stale=staleSet();
  const key=[sc, prof.id, consStore.version(), [...stale].sort().join('+')].join('|');
  if(consCache[key]) return consCache[key];
  consCache[key]=consensusTable(consMatrix(sc), posOfFor(sc), prof, consCalib(sc), {calibrate:st.calibrate, exclude:{wk:stale, ros:stale}});
  return consCache[key];
}

/**
 * One player's consensus over a window: {v, n, lo, hi, rk, pr, pos}, or null.
 * `rk`/`pr` exist only for this week and rest of season (see the note above).
 */
function consFor(p, h){
  if(!h) h=hz();
  const prof=consStore.active(), sc=scoringKey(L());
  const anchor = h.kind==='ros' ? 'ros' : (h.kind==='week' && h.from===DATA.week ? 'wk' : null);
  if(anchor){
    const hit=consTable(sc, prof).get(p.i);
    if(hit && hit[anchor]) return hit[anchor];
  }
  // A full season is what has been scored plus what is left.
  if(h.kind==='season'){
    const r=consFor(p, parseHz('ros'));
    return r? Object.assign({}, r, {v:r.v+playedPts(p), rk:null, pr:null}) : null;
  }
  // Any other window - or a player with no source numbers in the matrix: average
  // what the sources published for it, on the weekly level, without a rank.
  const vals={};
  CONS_SRC.forEach(s=>{ const v=srcValue(p, s.k, h).v; if(v!=null) vals[s.k]=v; });
  const r=weightedMean(vals, h.kind==='ros'? prof.ros : prof.wk, {exclude:staleSet(), factor:k=>srcFactor(sc,'wk',k,p.p)});
  return r? {v:r.v, raw:r.raw, n:r.n, lo:r.lo, hi:r.hi, rk:null, pr:null, pos:null} : null;
}

/**
 * The parts of one consensus, for the tooltip: each source's published number,
 * the same on the consensus level, its weight, and why it is out when it is.
 */
function consBreakdown(p, h){
  const anchor = h.kind==='ros' ? 'ros' : (h.kind==='week' && h.from===DATA.week ? 'wk' : null);
  if(!anchor) return null;
  const sc=scoringKey(L()), prof=consStore.active(), e=consMatrix(sc).get(p.i);
  if(!e) return null;
  const stale=staleSet(), out=[];
  CONS_SRC.forEach(s=>{
    const v=e[anchor][s.k];
    if(v==null) return;
    const w=Number(prof[anchor][s.k]);
    let why=null;
    if(!(w>0)) why='weight 0';
    else if(stale.has(s.k)) why='stale';
    else if(e.partial[s.k]) why='partly priced';
    const f=srcFactor(sc, anchor, s.k, p.p);
    out.push({k:s.k, v, cal:v/f, w, why, raw: anchor==='ros' && e.rosRaw[s.k]!==v? e.rosRaw[s.k] : null});
  });
  return out;
}

/**
 * A source's number for a window, read the same way on every page. The two
 * anchor windows come from the universe-wide matrix, so a player looks identical
 * on Players and My Team; everything else reads the published weeks off the row.
 */
function srcValue(p, key, h){
  const anchor = h.kind==='ros' ? 'ros' : (h.kind==='week' && h.from===DATA.week ? 'wk' : null);
  if(anchor){
    const e=consMatrix(scoringKey(L())).get(p.i);
    if(e){
      const v=e[anchor][key];
      return v!=null? {v, real:true, raw: anchor==='ros' && e.rosRaw[key]!==v? e.rosRaw[key] : null} : {v:null};
    }
  }
  return horizonValue(p, key, h);
}

/** Consensus for the Week by week grid: the same weights and scaling, over the sources that published THAT week. */
function weekConsensus(p, wk){
  if(isBye(p,wk)) return {v:null, bye:true};
  const vals={}, sc=scoringKey(L());
  CONS_SRC.forEach(s=>{ const r=weekValue(p, s.k, wk); if(r.v!=null) vals[s.k]=r.v; });
  const r=weightedMean(vals, consStore.active().wk, {partial:p.vc===false? {vg:true} : null, exclude:staleSet(), factor:k=>srcFactor(sc,'wk',k,p.p)});
  return r? {v:round2(r.v), real:true, n:r.n} : {v:null};
}

function weekColumns(h){
  h=h||hz();
  if(h.kind==='ros'||h.kind==='season'||(h.kind==='week'&&h.from===DATA.week)){
    const out=[]; for(let w=DATA.week; w<=LAST_WEEK; w++) out.push(w); return out;
  }
  return hzWeeks(h);
}

/** One player's league-scored actual for a stored week, or {v:null}. */
function weekActual(p, w, l){
  const b=(l.scoreBoard||{})[String(w)];
  const pp=b&&b.playerPts;
  const v=pp? pp[p.i] : undefined;
  return v==null? {v:null} : {v, real:true, n:1};
}

/** The Week by week tab: every remaining week, this one to the end of the season, per source or as the consensus. */
function weeksTab(l, t){
  const out=[];
  const storedW0=(Object.keys(l.scoreBoard||{}).map(Number).filter(w=>w<DATA.week).length>0);
  const haveWeekly=(DATA.projectionAges&&DATA.projectionAges.length) || (DATA.dsAges&&DATA.dsAges.length) || (DATA.yahooAges&&DATA.yahooAges.length);
  if(!haveWeekly && !storedW0){
    out.push(panel('Week by week',null,emptyState('No weekly projections stored',
      'Run `npm run sleeper:proj`, `npm run ds:sync`, or `yahoo:sync`/`yahoo:ingest`. Each publishes a number per week; the NFL schedule is what marks a bye.')));
    return out;
  }

  const bar=el('div','toggles');
  bar.append(consensusSelect());
  bar.append(segmented([
    {label:'Consensus',value:'cons'},{label:'FP',value:'fp'},{label:'WWO',value:'wwo'},
    {label:'1D',value:'fd'},{label:'FD',value:'fdl'},{label:'Sleeper',value:'sl'},{label:'DS',value:'ds'},{label:'Yahoo',value:'yh'},
  ], weekSrc, v=>{ weekSrc=v; store.set('gd.weekSrc',v); render(); }));
  out.push(bar);

  // Stored weeks (past, with league-scored actuals captured at sync time) come
  // first; then DATA.week through the end of the season as projections. Stored
  // weeks replace projections for weeks that already happened — a score is a
  // better guess than a projection for a week that is over.
  const storedW=(Object.keys(l.scoreBoard||{}).map(Number).filter(w=>w<DATA.week).sort((a,b)=>a-b));
  const weeks=[...new Set(storedW.concat(weekColumns(parseHz('ros'))))].filter(w=>w>=1);
  const actSet=new Set(storedW);
  const cols=[{label:'Player'}].concat(weeks.map(w=>({label:String(w),r:1,w:52,sep:w===DATA.week?1:0,
    title:'Week '+w+' · '+oppLabel({t:null}, w)})));
  cols.push({label:'Sum',r:1,sep:1,w:58,title:'Sum of the weeks shown — stored actuals plus projected weeks'});
  const segs=[]; let seg=null;
  weeks.forEach(w=>{ const k=actSet.has(w)?'act':'proj'; if(!seg||seg.k!==k){ seg={k,weeks:[]}; segs.push(seg); } seg.weeks.push(w); });
  const bands=[{label:'',span:1}].concat(segs.map(s=>({
    label: s.k==='act'? 'Actual points scored' : 'Projected', span:s.weeks.length })), [{label:'',span:1}]);

  const groups=new Map();
  t.players.slice().sort(byPos).forEach(p=>{
    const k=String(p.p||'—').toUpperCase();
    if(!groups.has(k)) groups.set(k,[]);
    groups.get(k).push(p);
  });

  const rows=[];
  const colTotals={}; weeks.forEach(w=>{ colTotals[w]=0; });
  [...groups.entries()].forEach(([pos,list])=>{
    const hr=el('tr','grouphdr');
    const td=el('td'); td.colSpan=cols.length;
    const wrap=el('div','slotcell'); wrap.append(posChip(pos)); wrap.append(el('span',null,pos+' · '+list.length));
    td.append(wrap); hr.append(td); rows.push(hr);
    list.forEach(p=>{
      const tr=el('tr');
      tr.append(rosterCell(p,null));
      let rowSum=0, rowN=0;
      weeks.forEach(w=>{
        const isAct=actSet.has(w);
        const r = isAct? weekActual(p,w,l) : (weekSrc==='cons'? weekConsensus(p,w) : weekValue(p,weekSrc,w));
        const td2=el('td','r'+(w===DATA.week?' wknow tsep':''));
        const d=el('div','wkcell '+(r.bye?'bye':'real')+(isAct&&r.v!=null?' act':''));
        d.textContent = r.bye? 'bye' : (r.v==null? '—' : fmt(r.v));
        const opp=oppLabel(p,w);
        td2.title = isAct
          ? (r.bye? 'Bye'
             : (r.v!=null? 'Stored actual — league\u2019s own scoreboard, captured at sync time (a game in progress at capture reads low or empty)'
                : 'No stored score for week '+w))
          : (r.bye? 'Bye' : (r.v!=null? (weekSrc==='cons'? 'weighted average of '+r.n+' published number'+(r.n===1?'':'s') : 'published') : 'not published for this week'));
        td2.title += ' \u00b7 week '+w+(opp && opp!=='—'? ' \u00b7 '+opp : '');
        td2.append(d); tr.append(td2);
        if(r.v!=null){ colTotals[w]+=r.v; rowSum+=r.v; rowN++; }
      });
      tr.append(stackCell(fmt(rowN? rowSum : null,1),'',{sep:1}));
      rows.push(tr);
    });
  });

  const tot=el('tr','totrow');
  tot.append(el('td',null,'Roster total'));
  weeks.forEach(w=>{ tot.append(stackCell(fmt(colTotals[w]),'',{sep:w===DATA.week?1:0})); });
  tot.append(el('td','r tsep'));
  rows.push(tot);

  const hasAct=storedW.length>0;
  out.push(panel(hasAct? 'Points per week · actuals through wk '+storedW[storedW.length-1] : 'Projected points per week',
    t.players.length+' players'+(hasAct? ' · stored weeks are league-scored actuals (may be partial), the rest are projections' : ' · weeks '+DATA.week+'\u2013'+LAST_WEEK),
    table2(bands,cols,rows)));

  const lg=el('div','legend');
  if(hasAct) lg.append(Object.assign(el('span','note'),{textContent:
    'Shown in the actuals columns are the league\u2019s own scored totals, stored from earlier `matchups:sync` runs. A week with games still in progress at the time it was synced reads low or empty — it is a snapshot as captured, not live. Pick Live in the week picker above to return to the current week.'}));
  lg.append(el('span',null,'Every projection cell is a number a site published for that week, or it is empty. Sleeper, Draft Sharks and Yahoo publish every remaining week; FantasyPros, VegasEdge, WinWithOdds, First Down and FanDuel publish this week only, so their later weeks stay blank instead of being filled by spreading a season total. The Consensus view averages, with your weights, whichever sources published that week \u2014 so future weeks are an average of the three weekly feeds alone. Yahoo is under this league\u2019s own scoring settings, not a universal PPR/Half/Standard split.'));
  lg.append(el('span',null,'Opponents and byes come from the NFL schedule, not from Sleeper. A missing Sleeper row is no longer treated as a bye.'));
  out.push(lg);

  const slLive=(DATA.projectionAges||[]).find(a=>a.week===DATA.week);
  const dsLive=(DATA.dsAges||[]).find(a=>a.week===DATA.week || a.week==='ros');
  const yhLive=(DATA.yahooAges||[]).find(a=>a.week===DATA.week);
  const note=el('p','note');
  note.textContent='Sleeper week '+DATA.week+' recomputed '
    +(slLive&&slLive.sourceAt? new Date(slLive.sourceAt).toLocaleString() : 'unknown')
    +'. Draft Sharks last-modified '
    +(dsLive&&dsLive.sourceAt? new Date(dsLive.sourceAt).toLocaleString() : 'unknown')
    +'. Yahoo has no site clock to read, only when we captured it: '
    +(yhLive&&yhLive.fetchedAt? new Date(yhLive.fetchedAt).toLocaleString() : 'unknown')
    +'.';
  out.push(note);
  return out;
}

/**
 * My Team is one page with tabs. Every tab reads ONE fixed scope, so there is no
 * window to adjust: This week and Rest of season are tabs of their own, the
 * Overview shows both at once, and Week by week lays out every remaining week.
 * (The Window picker still drives Players and All Rosters, where a look-ahead is
 * the point.)
 */
function teamTabBar(){
  const tabs=el('div','pgtabs'); tabs.setAttribute('role','tablist'); tabs.setAttribute('aria-label','My Team views');
  const pick=k=>{ teamTab=k; writeHash(); render(); const b=document.querySelector('.pgtabs [aria-selected="true"]'); if(b) b.focus(); };
  TEAM_TABS.forEach(([k,label])=>{
    const b=el('button',null,label); b.type='button'; b.setAttribute('role','tab');
    b.setAttribute('aria-selected', String(k===teamTab));
    b.tabIndex = k===teamTab? 0 : -1;
    b.onclick=()=>pick(k);
    tabs.append(b);
  });
  tabs.addEventListener('keydown',e=>{
    if(e.key!=='ArrowRight' && e.key!=='ArrowLeft') return;
    e.preventDefault();
    const i=TEAM_TABS.findIndex(x=>x[0]===teamTab), n=TEAM_TABS.length;
    pick(TEAM_TABS[(i+(e.key==='ArrowRight'?1:n-1))%n][0]);
  });
  return tabs;
}

/** Keep only these columns of a set, optionally re-banded — how a tab picks its slice of the shared columns. */
function pickCols(cols, keys, band){
  return cols.filter(c=>keys.includes(c.key)).map(c=> band? Object.assign({}, c, {band}) : c);
}
/** A divider before a column, whatever it happens to be. */
function leadSep(c){
  if(!c || c.sep) return c;
  const inner=c.cell, tot=c.total;
  c.sep=1;
  c.cell=p=>{ const td=inner(p); td.classList.add('tsep'); return td; };
  if(tot) c.total=l=>{ const td=tot(l); td.classList.add('tsep'); return td; };
  return c;
}

/** The columns of each tab. Each is built for a fixed scope: this week, or rest of season. */
function teamColumns(tab){
  const wk=parseHz('w-'+DATA.week), ros=parseHz('ros');
  const CONS=['cons','consrk','conspos'];
  switch(tab){
    case 'overview': {
      // Both windows at once: what he does this week, and what he is worth from here on.
      const cols=[
        ...pickCols(columnsFor(wk,{groups:['cons']}), CONS, 'This week · wk '+DATA.week),
        ...pickCols(columnsFor(ros,{groups:['cons']}), CONS, 'Rest of season · '+rosSpan()),
        ...pickCols(columnsFor(wk,{groups:['info']}), ['opp'], 'Matchup').map(leadSep),
        ...pickCols(columnsFor(wk,{groups:['mkt']}), ['tm','tmd'], 'Trade value'),
        ...columnsFor(wk,{groups:[]}),   // points scored so far this week
      ];
      return cols;
    }
    case 'week':
      return {scope:wk, cols:columnsFor(wk,{groups:['cons','src','info']})};
    case 'ros':
      return {scope:ros, cols:columnsFor(ros,{groups:['cons','src','info']})};
    case 'trade':
      return [...pickCols(columnsFor(wk,{groups:['cons']}), ['cons'], 'This week'),
              ...columnsFor(wk,{groups:['mkt'], noActual:true})];
    case 'buzz':
      return [...pickCols(columnsFor(wk,{groups:['cons']}), ['cons'], 'This week'),
              ...columnsFor(wk,{groups:['buzz'], noActual:true})];
  }
  return [];
}

/** The lineup / roster table for one tab, with the starters-or-position switch above it. */
function teamRosterTable(l, t, scope, cols, title, sub){
  const out=[];
  if(teamView==='lineup'){
    const lu=lineupFor(l,t);
    const src = lu.source==='actual' ? 'lineup as set' : (lu.source==='computed' ? 'best-fit lineup (computed)' : 'no slot template');
    out.push(panel(title, sub? sub+' · '+src : src, lineupTableView(lu, scope, cols)));
    if(lu.source==='computed'){
      out.push(Object.assign(el('p','note'),{textContent:
        'This league is not active on FantasyPros, so the lineup you actually set is not available. Slots are filled best-first by projection using the league’s slot template — treat it as a suggestion, not your saved lineup.'}));
    }
  } else {
    out.push(panel(title, (sub? sub+' · ' : '')+t.players.length+' players', positionTableView(t.players, scope, cols)));
  }
  return out;
}

function teamToolbar(l, t){
  const bar=el('div','toggles');
  // Only shown when you actually run more than one team here — a one-option
  // switcher is noise, and the host data can never produce more than one.
  const mine=myTeams(l);
  if(mine.length>1){
    bar.append(segmented(mine.map(x=>({label:teamLabel(l,x),value:String(x.id)})), String(t.id),
      v=>{ store.set('gd.team.'+l.key, v); render(); }));
  }
  bar.append(segmented([{label:'Starting lineup',value:'lineup'},{label:'By position',value:'position'}], teamView, v=>{ teamView=v; store.set('gd.teamView',v); writeHash(); render(); }));
  bar.append(consensusSelect());
  return bar;
}

/**
 * My Team's view for a STORED (past) week. Projections no longer mean anything
 * for a week that already happened, so this renders the league's own scoreboard
 * numbers for the picked week instead — per player, and who was actually in the
 * stored starting lineup. The captures are as accurate as the last sync was:
 * a game still in progress when it ran reads low or empty, and the panel says
 * so rather than implying it is a final score.
 */
function storedWeekPanel(l, t){
  const out=[];
  const b=(l.scoreBoard||{})[String(viewWeek)];
  const pp=(b&&b.playerPts)||{};
  const mineIds=new Set(myTeams(l).map(x=>String(x.id)));
  const mine=(b&&b.matchups||[]).find(m=>m.sides.some(s=>mineIds.has(String(s.id))));
  const side=mine&&mine.sides.find(s=>mineIds.has(String(s.id)));
  const opp=mine&&mine.sides.find(s=>!mineIds.has(String(s.id)));
  const started=new Set((side&&side.starters||[]).map(ln=>Number(ln.i)).filter(Boolean));

  const groups=new Map();
  t.players.slice().sort(byPos).forEach(p=>{
    const k=String(p.p||'—').toUpperCase();
    if(!groups.has(k)) groups.set(k,[]);
    groups.get(k).push(p);
  });

  const cols=[
    {label:'Player'},
    {label:'Pts', r:1, title:'League-scored points for week '+viewWeek+', as stored'},
    {label:'Start', r:1, title:'In the stored starting lineup for that week'},
  ];
  const bands=[{label:'',span:1},{label:'Week '+viewWeek+' actuals',span:2}];
  const rows=[];
  let sum=0, n=0;
  [...groups.entries()].forEach(([pos,list])=>{
    const hr=el('tr','grouphdr');
    const td=el('td'); td.colSpan=cols.length;
    const wrap=el('div','slotcell'); wrap.append(posChip(pos)); wrap.append(el('span',null,pos+' · '+list.length));
    td.append(wrap); hr.append(td); rows.push(hr);
    list.forEach(p=>{
      const tr=el('tr');
      tr.append(rosterCell(p,null));
      const v=pp[p.i];
      const pt=el('td','r');
      const d=el('div','wkcell '+(v==null?'real':'real act'));
      d.textContent=v==null? '—' : fmt(v);
      pt.append(d); pt.title= v==null? 'No stored score for week '+viewWeek : 'Stored actual — as captured at sync time';
      tr.append(pt);
      const st=el('td','r');
      st.append(el('span','pill '+(started.has(p.i)?'ok':'gh'), started.has(p.i)? 'started' : 'bench'));
      tr.append(st);
      rows.push(tr);
      if(v!=null){ sum+=v; n++; }
    });
  });
  const tot=el('tr','totrow');
  tot.append(el('td',null,'Roster total'));
  tot.append(el('td','r', fmt(n?sum:null)));
  tot.append(el('td','r',''));
  rows.push(tot);

  const sub=[];
  if(side&&opp){
    const win=(side.pts||0)>(opp.pts||0), lose=(side.pts||0)<(opp.pts||0);
    sub.push(mine.final? (win?'W':'L')+' \u00b7 '+num(side.pts)+' \u2013 '+num(opp.pts)+' vs '+opp.name : 'vs '+opp.name+' — '+num(side.pts)+' to '+num(opp.pts)+' as captured');
  }
  sub.push(n+'/'+t.players.length+' players have a stored score for this week');
  out.push(panel('Week '+viewWeek+' \u00b7 stored scores', sub.join(' · '), table2(bands,cols,rows)));
  out.push(Object.assign(el('p','note'),{textContent:
    'Stored week — the scores are the league\u2019s own, captured by the last `matchups:sync` run. A game still in progress at capture reads low or empty; this is a snapshot, not live, and not a final. Pick Live above to return to the current week.'}));
  return out;
}

/**
 * The whole league's week, on one board.
 *
 * MyPlaybook's matchup endpoint accepts any teamId, so this works on ESPN and
 * Yahoo as well as Sleeper — neither of which exposes a league scoreboard
 * anywhere else reachable from here. Your own game is marked, not isolated:
 * what a scoreboard is for is seeing everyone else's at once.
 */
function scoreboard(l, board){
  if(!board || !board.ok) return null;
  const all=board.rows||[];
  const mineIds=new Set(myTeams(l).map(t=>String(t.id)));
  const byId=new Map(l.teams.map(t=>[String(t.id),t]));
  const rows=all.slice().sort((a,b)=>{
    const am=a.sides.some(s=>mineIds.has(String(s.id))), bm=b.sides.some(s=>mineIds.has(String(s.id)));
    return (bm?1:0)-(am?1:0) || (a.final?1:0)-(b.final?1:0);
  });
  const grid=el('div','sbgrid');
  rows.forEach(m=>{
    const card=el('div','sbcard');
    if(m.sides.some(s=>mineIds.has(String(s.id)))) card.classList.add('mine');
    const lead=Math.max(...m.sides.map(s=>s.pts??0));
    const tied=m.sides.length>1 && m.sides[0].pts===m.sides[1].pts;
    m.sides.forEach(s=>{
      const r=el('div','sbrow');
      const t=byId.get(String(s.id));
      r.append(teamAvatar(t? t.logo : s.logo));
      r.append(Object.assign(el('div','sbn'),{textContent: t? teamLabel(l,t) : (s.name||'—')}));
      const pv=el('div','sbp'+((s.pts??0)>=lead && !tied ? ' lead':''));
      pv.textContent=num(s.pts);
      r.append(pv);
      const pj=el('div','sbj'); pj.textContent = s.proj==null? '' : num(s.proj);
      pj.title='projected final';
      r.append(pj);
      card.append(r);
    });
    if(m.sides.length===1) card.append(Object.assign(el('div','sbrow sbbye'),{textContent:'bye'}));
    const foot=el('div','sbfoot');
    foot.append(el('span','pill '+(m.final?'gh':(m.pre?'gh':'q')), m.final? 'final' : (m.pre? 'not started' : (m.minutesLeft!=null? m.minutesLeft+'m left' : 'live'))));
    if(tied && !m.final) foot.append(el('span',null,'tied'));
    card.append(foot);
    grid.append(card);
  });
  const done=all.filter(m=>m.final).length;
  const stored=board.week&&board.week!==(Number(DATA.week)||1);
  return panel( stored? 'Week '+board.week+' scoreboard · stored' : 'Week '+DATA.week+' scoreboard',
    all.length+' matchups · '+done+' final · every team, from the per-team matchup endpoint'
      +(stored? ' \u00b7 as captured when the sync last ran' : ''), grid);
}

/**
 * Any matchup in the league, not just yours.
 *
 * This used to render one pairing — whichever one MyPlaybook answered for your
 * own teamId — and only for the single league FantasyPros has marked active.
 * The league-wide board already fetches every pairing with every lineup slot
 * (matchups.js asks per team, and the endpoint answers for any of them), so
 * there is no reason the page can only show one. You arrive on yours; the
 * selector and the arrows walk the rest of the league.
 *
 * Points here are the LEAGUE's own: MyPlaybook applies the league's scoring
 * table, so a Sleeper league taking -2 for an interception is already counted.
 * The previous version read actuals out of WinWithOdds' generic PPR file, which
 * is why a quarterback could read high by exactly the interceptions he threw.
 */
function muKey(m){ return m.sides.map(s=>String(s.id)).join('-'); }

function pickMatchup(board){
  const rows=(board && board.ok)? board.rows : [];
  if(!rows.length) return null;
  if(muPick){
    const hit=rows.find(m=> muKey(m)===muPick || m.sides.some(s=>String(s.id)===muPick));
    if(hit) return hit;
  }
  const mine=new Set(myTeams(L()).map(t=>String(t.id)));
  return rows.find(m=> m.sides.some(s=>mine.has(String(s.id)))) || rows[0];
}

/** Order the board reads in: yours first, then live, then finished. */
function muOrder(board){
  const rows=(board && board.ok)? board.rows.slice() : [];
  const mine=new Set(myTeams(L()).map(t=>String(t.id)));
  return rows.sort((a,b)=>{
    const am=a.sides.some(s=>mine.has(String(s.id))), bm=b.sides.some(s=>mine.has(String(s.id)));
    return (bm?1:0)-(am?1:0) || (a.final?1:0)-(b.final?1:0);
  });
}

function pageMatchup(){
  const l=L(), out=[];
  const viewPast=viewingPast(l);
  const h=el('div','head'); h.append(el('h1',null, viewPast? 'Week '+viewWeek+' Matchup \u00b7 stored scores' : 'Week '+DATA.week+' Matchup'));
  h.append(el('p',null,leagueLabel(l)+' · '+l.host));
  out.push(h);

  const wpick=weekPicker(l);
  if(wpick) out.push(wpick);

  const board=boardFor(l);
  const rows=muOrder(board);
  if(!rows.length){
    if(viewPast){
      out.push(panel('Matchup', null, emptyState('No stored board for week '+viewWeek,
        'This league has no stored matchups for that week — run `matchups:sync` during it to capture them.')));
      return out;
    }
    const M=l.adv&&l.adv.matchup;
    if(M && M.inactive) out.push(panel('Matchup', l.host, inactiveNote(l,'Matchups')));
    else if(l.detail && l.detail.supported) return out.concat(sleeperMatchupFallback(l));
    else out.push(panel('Matchup', l.host, emptyState('No league board yet','Run `node src/cli.js matchups:sync` to pull every pairing in this league.')));
    return out;
  }

  const cur=pickMatchup(board);
  const idx=rows.indexOf(cur);
  const go=(m)=>{ muPick=muKey(m); writeHash(); render(); };

  /* --- pick a pairing ------------------------------------------------- */
  const nav=el('div','munav');
  const prev=el('button','iconbtn','‹'); prev.type='button'; prev.title='Previous matchup';
  prev.onclick=()=>go(rows[(idx-1+rows.length)%rows.length]);
  const next=el('button','iconbtn','›'); next.type='button'; next.title='Next matchup';
  next.onclick=()=>go(rows[(idx+1)%rows.length]);
  nav.append(prev);
  const strip=el('div','mustrip');
  const mineIds=new Set(myTeams(l).map(t=>String(t.id)));
  const byId=new Map(l.teams.map(t=>[String(t.id),t]));
  rows.forEach(m=>{
    const b=el('button','muchip'+(m===cur?' on':'')); b.type='button';
    if(m.sides.some(s=>mineIds.has(String(s.id)))) b.classList.add('mine');
    m.sides.forEach((s,i)=>{
      if(i) b.append(el('span','vs','·'));
      const t=byId.get(String(s.id));
      b.append(teamAvatar(t? t.logo : s.logo));
      b.append(Object.assign(el('span','mc'),{textContent:num(s.pts)}));
    });
    b.title=m.sides.map(s=>{ const t=byId.get(String(s.id)); return (t? teamLabel(l,t) : s.name)+' '+num(s.pts); }).join('  vs  ');
    b.onclick=()=>go(m);
    strip.append(b);
  });
  nav.append(strip); nav.append(next);
  out.push(nav);

  out.push(matchupPanel(l, cur));
  out.push(scoreboard(l, board));
  return out.filter(Boolean);
}

/** Header, starters and bench for one pairing. */
function matchupPanel(l, m){
  const byId=new Map(l.teams.map(t=>[String(t.id),t]));
  const mineIds=new Set(myTeams(l).map(t=>String(t.id)));
  const [A,B]=m.sides;
  const body=el('div','pbody');

  /* --- head to head --------------------------------------------------- */
  const head=el('div','muhead');
  const sideHead=(s,cls)=>{
    const d=el('div','muteam'+(cls?' '+cls:''));
    const t=s? byId.get(String(s.id)) : null;
    const crest=teamAvatar(t? t.logo : (s&&s.logo));
    const nm=el('div','mun');
    nm.append(el('b',null, t? teamLabel(l,t) : (s&&s.name)||'—'));
    if(t && mineIds.has(String(t.id))) nm.append(el('span','pill ok','you'));
    const sc=el('div','musc');
    sc.append(Object.assign(el('div','p1'),{textContent:num(s? s.pts : null)}));
    const pj=el('div','p2');
    pj.textContent = s&&s.proj!=null? num(s.proj) : '';
    pj.title='projected final';
    sc.append(pj);
    if(cls==='b'){ d.append(sc); d.append(nm); d.append(crest); }
    else { d.append(crest); d.append(nm); d.append(sc); }
    return d;
  };
  head.append(sideHead(A));
  head.append(el('div','muvs', m.final? 'FINAL' : (m.pre? 'VS' : (m.minutesLeft!=null? m.minutesLeft+'m' : 'LIVE'))));
  head.append(sideHead(B,'b'));
  body.append(head);

  // Win probability stays here — it is the one page where a matchup-level
  // number belongs. It was only ever wrong sitting in a standings table.
  if(m.winProb!=null){
    const wp=Math.round(m.winProb*100);
    const w=el('div','wp');
    const bar=el('div','wpbar');
    const a=el('i'); a.style.width=wp+'%'; a.style.background='var(--good)';
    const b=el('i'); b.style.flex='1'; b.style.background='var(--bad)';
    bar.append(a); bar.append(b);
    const nums=el('div','wpnums');
    nums.append(el('span',null,wp+'%'));
    nums.append(el('span',null,'win probability'));
    nums.append(el('span',null,(100-wp)+'%'));
    w.append(bar); w.append(nums);
    body.append(w);
  }

  const panelEl=panel(
    m.final? 'Final' : (m.pre? 'Not started' : 'Live'),
    (m.status||'')+(m.minutesLeft!=null&&!m.final? ' · '+m.minutesLeft+' game minutes left' : ''),
    body);

  if(!B){ body.append(Object.assign(el('p','note'),{textContent:'Bye week — no opponent this week.'})); }
  body.append(muRows(l, A, B, 'starters'));
  const bench=muRows(l, A, B, 'bench');
  if(bench) body.append(bench);
  return panelEl;
}

/**
 * The slot-by-slot rows, laid out as the hosts lay them out: player, his game,
 * his points, the slot badge down the middle, then the same mirrored.
 *
 * The projection sits under the points in the colour of the gap, so a row
 * answers "is he beating his number" without a second column to read.
 */
function muRows(l, A, B, which){
  const a=(A&&A[which])||[], b=(B&&B[which])||[];
  if(!a.length && !b.length) return null;
  const wrap=el('div','muslots'+(which==='bench'?' bench':''));
  if(which==='bench') wrap.append(Object.assign(el('div','muband'),{textContent:'Bench'}));

  const byFp=new Map();
  l.teams.forEach(t=> t.players.forEach(p=> byFp.set(p.i,p)));

  const cell=(p,cls)=>{
    const d=el('div','muside'+(cls?' '+cls:''));
    if(!p){ d.append(el('span','note','—')); return d; }
    const en=byFp.get(p.i) || {i:p.i, n:p.n, t:p.t, p:p.pos, s:null};
    const who=el('div','muwho'); if(p.i!=null) who.dataset.pid=p.i;
    who.append(avatarFor({p:p.pos||en.p, t:p.t||en.t, s:en.s}));
    const nm=el('div','munm');
    const line1=el('div','l1');
    line1.append(p.i!=null? plink({i:p.i, n:p.n||'—'}) : el('b',null,p.n||'—'));
    if(p.t) line1.append(el('span','tm',p.t));
    const ip=injPill({inj:p.inj}); if(ip) line1.append(ip);
    nm.append(line1);
    const line2=el('div','l2');
    line2.textContent = p.score || p.game || p.opp || '';
    nm.append(line2);
    who.append(nm);

    const val=el('div','muval');
    const played = p.pts!=null && !p.pre;
    const pv=el('div','pv'+(played?'':' dim'));
    pv.textContent = played? num(p.pts) : '—';
    val.append(pv);
    /**
     * The second line is the projection the points should be read against —
     * and which projection that is depends on whether the game has been played.
     *
     * Once it is over, the live-adjusted number has converged on the actual, so
     * printing it puts the same figure twice on the row. What is worth knowing
     * then is what he was PROJECTED before kickoff, coloured by the gap. While
     * a game is running the live projected final is the useful one.
     */
    const sub=el('div','pj');
    const done = p.over || (p.pts!=null && p.min===0);
    const shown = done? (p.proj0!=null? p.proj0 : p.proj) : p.proj;
    if(shown!=null){
      sub.textContent=num(shown);
      if(done && p.pts!=null){
        const gap=p.pts-shown;
        sub.style.color = gap>=0? 'var(--good)' : 'var(--bad)';
        sub.title='projected '+num(shown)+' pre-game · '+(gap>=0?'+':'')+num(gap);
      } else {
        sub.title='projected final';
      }
    }
    val.append(sub);

    if(cls==='b'){ d.append(val); d.append(who); }
    else { d.append(who); d.append(val); }
    return d;
  };

  const n=Math.max(a.length,b.length);
  for(let i=0;i<n;i++){
    const L=a[i], R=b[i];
    const row=el('div','murow');
    row.append(cell(L));
    const mid=el('div','mumid');
    mid.append(posChip((L&&L.slot)||(R&&R.slot)||(which==='bench'?'BN':'—'),'slot'));
    row.append(mid);
    row.append(cell(R,'b'));
    wrap.append(row);
  }

  if(which==='starters'){
    /**
     * The totals are the HOST's, not the sum of the rows above them.
     *
     * On most leagues they are the same number. On one Yahoo league they are
     * not: MyPlaybook's per-player scoring comes out 1–3 points above what
     * Yahoo itself reports for the team, on five teams out of twelve. The team
     * score is the host's own live figure and the one the scoreboard and
     * standings use, so it is the one that belongs here — and where the parts
     * disagree with it, the row says so rather than quietly printing a third
     * number the league has never seen.
     */
    const row=el('div','murow mutot');
    const mk=(side,list,cls)=>{
      const d=el('div','muside'+(cls?' '+cls:''));
      const v=el('div','muval');
      const host = side? side.pts : null;
      v.append(Object.assign(el('div','pv'),{textContent:num(host)}));
      v.append(Object.assign(el('div','pj'),{textContent: side&&side.proj!=null? num(side.proj) : ''}));
      const parts = sum(list.filter(p=>p.pts!=null&&!p.pre), p=>p.pts);
      if(host!=null && Math.abs(parts-host)>0.05){
        const flag=Object.assign(el('div','ss'),{textContent:'rows sum '+num(parts)});
        flag.style.color='var(--warn)';
        flag.title='MyPlaybook\u2019s per-player scoring for this league sums to '+num(parts)
          +', '+num(Math.abs(parts-host))+' '+(parts>host?'above':'below')+' the '+l.host
          +' team score. The team score is the host\u2019s own and is what the scoreboard and standings use.';
        v.append(flag);
      }
      if(cls==='b'){ d.append(v); } else { d.append(el('span','grow')); d.append(v); }
      return d;
    };
    row.append(mk(A,a));
    const mid=el('div','mumid'); mid.append(el('span','wk','STARTERS')); row.append(mid);
    row.append(mk(B,b,'b'));
    wrap.append(row);
  }
  return wrap;
}

/* Sleeper still fills in when MyPlaybook has no active-league access. */
function sleeperMatchupFallback(l){
  const out=[];
  const t=myTeam();
  const norm=s=>String(s||'').toLowerCase().replace(/[^a-z0-9]/g,'');
  const mine=t? l.detail.standings.find(s=>norm(s.name)===norm(t.name)) : null;
  const mu=mine? l.detail.matchups.find(m=>m.sides.some(s=>s.rosterId===mine.rosterId)) : l.detail.matchups[0];
  if(!mu||mu.sides.length<2){ out.push(panel('Matchup',null,emptyState('No pairing posted','Sleeper has not published a week '+DATA.week+' matchup.'))); return out; }
  const projOf=name=>{ const team=l.teams.find(x=>norm(x.name)===norm(name)); return team? sum(team.players,p=>p.wk) : null; };
  const body=el('div','pbody'); const head=el('div','muhead');
  const side=(s,cls)=>{
    const d=el('div','muteam'+(cls?' '+cls:''));
    const crest=teamAvatar(s.avatar||null);
    const nm=el('div','mun'); nm.append(el('b',null,s.team));
    const sc=el('div','musc');
    sc.append(Object.assign(el('div','p1'),{textContent:num(s.points)}));
    const pj=projOf(s.team);
    sc.append(Object.assign(el('div','p2'),{textContent: pj==null? 'live' : num(pj)}));
    if(cls==='b'){ d.append(sc); d.append(nm); d.append(crest); } else { d.append(crest); d.append(nm); d.append(sc); }
    return d;
  };
  head.append(side(mu.sides[0])); head.append(el('div','muvs','VS')); head.append(side(mu.sides[1],'b'));
  body.append(head);
  body.append(Object.assign(el('p','note'),{textContent:'Sleeper\u2019s own live scoring. Run `node src/cli.js matchups:sync` for the full slot-by-slot board and every other pairing in the league.'}));
  out.push(panel('Head to head','Sleeper live scoring',body));
  mu.sides.forEach(s=>{ const team=l.teams.find(x=>norm(x.name)===norm(s.team)); if(team) out.push(panel(s.team,'projected '+num(sum(team.players,p=>p.wk)),rosterTable(team.players))); });
  return out;
}

/**
 * One standings table, whatever the host is.
 *
 * Every column below is filled from whichever source has it, and a column
 * nobody has is dropped rather than rendered empty.
 *
 *   logo, name      the rosters payload, which carries a logo for ALL THREE
 *                   hosts.
 *   record, rank    MyPlaybook projected-standings — works for every host.
 *   playoff odds    same source, same coverage.
 *   PF / PA         every FINISHED matchup this app has stored, with the game
 *                   count carried so a row over one game never reads as a
 *                   season.
 *   this week       the live board, for every host, with the projected final.
 *   waiver / FAAB   Sleeper only. Nothing else exposes it.
 *
 * WHAT COUNTS TOWARDS THE RECORD
 *
 * `standMode` decides, and it defaults to `done`:
 *
 *   done   the host's official record, plus any matchup THIS WEEK that has
 *          actually finished. A game in progress moves nothing — the table
 *          does not reorder itself while you watch a game.
 *   proj   also counts unfinished games to whoever is ahead, and games not
 *          yet kicked off to whoever is projected higher. "Assume the
 *          favourites hold."
 *
 * Either way the rank is the standard one: record first, then points for. The
 * league's seeding rule colours which rows are in, it does not renumber them —
 * a seed is an answer to a different question than "who is first".
 */
/**
 * Which matchup board the standings should read for the "this week" columns and
 * for counting a week's results. Prefers the live board; when the league was
 * synced at a time its host served nothing (mid-week, pre-kickoff), falls back
 * to the most recent stored week that has any real pairings, so the table never
 * reads a whole league as winless. Rows keep the stored matchups' shape.
 */
function standingsBoard(l){
  const live=(l.matchups && l.matchups.ok && l.matchups.rows.some(m=>m.sides.length>1));
  if(live) return { ok:true, week:Number(DATA.week)||1, rows:l.matchups.rows||[], live:true };
  const weeks=Object.keys(l.scoreBoard||{}).map(Number).filter(w=>w>0 && w<DATA.week).sort((a,b)=>b-a);
  for(const w of weeks){
    const b=(l.scoreBoard||{})[String(w)];
    if(!b || !b.matchups || !b.matchups.length || !b.matchups.some(m=>m.sides.length>1)) continue;
    return { ok:true, week:w, rows:b.matchups, live:false };
  }
  return { ok:false, week:Number(DATA.week)||1, rows:[], live:true };
}

function standingsRows(l, sb){
  const P = l.adv && l.adv.standings;
  const proj = (P && P.ok) ? P.standings : [];
  const projById = new Map(proj.map(r=>[String(r.teamId), r]));
  /**
   * Sleeper is the only host whose weekly detail carries an OFFICIAL season
   * record and points-for/against through its API — because unlike ESPN and
   * Yahoo it publishes them. When that exists it is the record of record, and
   * the live/ledger counters must not add to it (that would double-count).
   */
  const hostCur = !!(l.detail && l.detail.supported);
  const detail = hostCur ? (l.detail.standings||[]) : [];
  const norm = (x)=> String(x||'').toLowerCase().replace(/[^a-z0-9]/g,'');
  const detailByName = new Map(detail.map(d=>[norm(d.name), d]));

  // This week's score, keyed both ways so a bye still resolves.
  const liveById = new Map();
  if(sb && sb.ok){
    sb.rows.forEach(m=>{
      const [a,b]=m.sides;
      const put=(self,opp)=>{ if(self && self.id!=null) liveById.set(String(self.id), {self,opp,m}); };
      put(a,b); put(b,a);
    });
  }

  const rows = l.teams.map(t=>{
    const id=String(t.id);
    const pr = projById.get(id) || null;
    const dt = detailByName.get(norm(t.name)) || detailByName.get(norm(t.nameScraped)) || null;
    const live = liveById.get(id) || null;
    const acc = t.totals || null;

    const wins = hostCur? (dt?.wins ?? 0) : (pr?.winsCurrent ?? dt?.wins ?? 0);
    const losses = hostCur? (dt?.losses ?? 0) : (pr?.lossesCurrent ?? dt?.losses ?? 0);
    const ties = hostCur? (dt?.ties ?? 0) : (pr?.tiesCurrent ?? dt?.ties ?? 0);

    // The counter that adds this week's live results only runs when the host
    // does not already publish official numbers; with a host record the count
    // IS the record and adding a game would double-count it.
    const recordLive = !hostCur;
    let wkResult = null, addW = 0, addL = 0, addT = 0, provisional = false;
    if(live && live.opp){
      const gap = (live.self.pts??0) - (live.opp.pts??0);
      // Pre-game has no points to compare, so the favourite is the projection.
      const pgap = (live.self.proj??live.self.pts??0) - (live.opp.proj??live.opp.pts??0);
      wkResult = { final: live.m.final, pre: live.m.pre, gap, win: gap>0, tie: gap===0,
                   pts: live.self.pts, proj: live.self.proj,
                   oppPts: live.opp.pts, oppProj: live.opp.proj, opp: live.opp.name, m: live.m };
      if(recordLive && live.m.final){
        if(gap>0) addW=1; else if(gap<0) addL=1; else addT=1;
      } else if(recordLive && standMode==='proj'){
        const g = live.m.pre? pgap : gap;
        if(g>0) addW=1; else if(g<0) addL=1; else addT=1;
        provisional = true;
      }
    } else if(live){
      wkResult = { final: live.m.final, pre: live.m.pre, bye:true, pts: live.self.pts, proj: live.self.proj, m: live.m };
    }

    /**
     * Points for and against.
     *
     * The host's official season total is preferred when this host publishes
     * one (Sleeper) — it is complete, which weekly syncing never is. Otherwise
     * the ledger — every finished matchup this app has stored — is used for
     * ESPN and Yahoo, then MyPlaybook's own figure. A host total of exactly
     * zero with no games played is absent data wearing a number's clothes, so
     * it is read as absent.
     */
    const hostTot = (hostCur && dt && (dt.pointsFor!=null || dt.pointsAgainst!=null)) ? dt : null;
    const useAcc = !hostCur && acc && acc.games>0;
    let pointsFor = useAcc? acc.pointsFor : (hostTot? hostTot.pointsFor : (pr?.pointsFor ?? null));
    let pointsAgainst = useAcc? acc.pointsAgainst : (hostTot? hostTot.pointsAgainst : (pr?.pointsAgainst ?? null));
    let games = useAcc? acc.games : (hostTot? (wins+losses+ties) : null);
    // In `proj` mode the record already counts the game in progress, so the
    // points columns have to count it too — a record and a points total that
    // disagree about which games happened is worse than either alone. Never on
    // a host record, which is already complete.
    if(recordLive && standMode==='proj' && live && !live.m.final && !live.m.pre){
      pointsFor = (pointsFor||0) + (live.self.pts||0);
      if(live.opp) pointsAgainst = (pointsAgainst||0) + (live.opp.pts||0);
      games = (games||0) + 1;
    }

    return {
      team: t, id,
      name: teamLabel(l,t),
      // Under a nickname, the subtext is what the host actually calls the team;
      // the owner's username follows it where the host gives one.
      sub: [ (ovFor(l).teams[id]||{}).nickname ? t.name : null, dt?.owner || null ].filter(Boolean).join(' · ') || null,
      logo: t.logo,
      hostRank: pr?.rankCurrent ?? dt?.rank ?? null,
      rankProj: pr?.rankProjected ?? null,
      wins, losses, ties,
      effWins: wins+addW, effLosses: losses+addL, effTies: ties+addT,
      counted: !!(addW||addL||addT),
      provisional,
      projRecord: pr ? [pr.winsProjected, pr.lossesProjected] : null,
      odds: pr?.playoffOdds ?? null,
      oddsPct: (()=>{ const n=parseInt(String(pr?.playoffOdds||'').replace('%',''),10); return isNaN(n)?null:n; })(),
      pointsFor: pointsFor==null? null : Number(pointsFor.toFixed(2)),
      pointsAgainst: pointsAgainst==null? null : Number(pointsAgainst.toFixed(2)),
      games,
      recordLive,
      recordSource: hostCur? 'host' : (useAcc? 'ledger' : (pr? 'mpb' : null)),
      pfSource: hostTot? 'host' : (useAcc? 'ledger' : (pr?.pointsFor!=null? 'mpb' : null)),
      waiverPosition: dt?.waiverPosition ?? null,
      waiverBudgetUsed: dt?.waiverBudgetUsed ?? null,
      totalMoves: dt?.totalMoves ?? null,
      streak: dt?.streak ?? null,
      wkResult,
      wkPts: live? (live.self.pts ?? null) : null,
      rank: null, seed: null, seedWhy: null, inPlayoffs: null,  // filled below
      mine: !!t.mine,
      division: t.division ?? null,
    };
  });

  // Games back from the leader, on the record as counted.
  const lead = rows.reduce((a,r)=> (r.effWins - r.effLosses) > (a.effWins - a.effLosses) ? r : a, rows[0] || {effWins:0,effLosses:0});
  rows.forEach(r=>{ r.gb = ((lead.effWins - r.effWins) + (r.effLosses - lead.effLosses)) / 2; });

  /**
   * The standard rank: record, then points for. Every league, same rule.
   *
   * This used to be the seed where a seeding rule existed, which conflated two
   * things — a division winner can be seeded first from fourth place, and the
   * table then numbered them 1 while the record said otherwise. The seed still
   * decides who is IN, and is on the tooltip; the number is the plain standing.
   */
  rows.slice().sort(byStandard).forEach((r,i)=>{ r.rank=i+1; });

  applySeeds(rows, l);

  // With no rule configured, "in the playoffs" is simply the top N.
  if(!rows.some(r=>r.seed!=null)){
    const n = (l.playoffs && l.playoffs.teams) || null;
    if(n) rows.forEach(r=>{ r.inPlayoffs = r.rank<=n; });
  }
  return rows;
}

/** Record first, then points for — the ordering every league agrees on. */
function byStandard(a,b){
  return (b.effWins-a.effWins) || (a.effLosses-b.effLosses) || (b.effTies-a.effTies)
      || (b.pointsFor??0)-(a.pointsFor??0)
      || (b.wkPts??0)-(a.wkPts??0)
      || String(a.name).localeCompare(String(b.name));
}

/**
 * Playoff seeds, under this league's own rule, on these rows.
 *
 * The same three rules the CLI and League Setup speak, applied to the merged
 * rows rather than to one host's standings — so it works on ESPN and Yahoo,
 * and so the bracket and the table agree about this week.
 *
 * Rows are mutated rather than returned because every caller wants them
 * attached to the team they belong to, and a parallel array would be one more
 * thing to keep aligned.
 */
function applySeeds(rows, l){
  const cfg = l.seedRule;
  if(!cfg || !cfg.rule || !rows.length) return;
  const tb = cfg.tiebreak || 'pointsFor';
  const byRecord = tb==='pointsAgainst'
    ? (a,b)=> (b.effWins-a.effWins) || (a.effLosses-b.effLosses) || (a.pointsAgainst ?? Infinity)-(b.pointsAgainst ?? Infinity)
    : byStandard;
  const n = cfg.playoffTeams ?? rows.length;
  let ordered;

  if(cfg.rule==='division-first'){
    const locked = cfg.divisionSeeds ?? 2;
    const best=new Map();
    rows.forEach(r=>{
      const d=r.division ?? '_none';
      if(!best.has(d) || byRecord(r,best.get(d))<0) best.set(d,r);
    });
    const winners=[...best.values()].filter(r=>r.division).sort(byRecord).slice(0,locked);
    const w=new Set(winners);
    ordered=[...winners.map(r=>({r,why:'division winner'})),
             ...rows.filter(r=>!w.has(r)).sort(byRecord).map(r=>({r,why:'record'}))];
  } else if(cfg.rule==='points-wildcard'){
    const wc = cfg.wildcards ?? 1;
    const auto = rows.slice().sort(byRecord).slice(0, Math.max(0, n-wc));
    const a=new Set(auto);
    // The wildcard is decided on points alone, among everyone who missed.
    const wild = rows.filter(r=>!a.has(r))
      .sort((x,y)=> (y.pointsFor ?? y.wkPts ?? 0)-(x.pointsFor ?? x.wkPts ?? 0)).slice(0,wc);
    const wset=new Set(wild);
    ordered=[...auto.map(r=>({r,why:'record'})),
             ...wild.map(r=>({r,why:'points wildcard'})),
             ...rows.filter(r=>!a.has(r)&&!wset.has(r)).sort(byRecord).map(r=>({r,why:'missed'}))];
  } else {
    ordered=rows.slice().sort(byRecord).map(r=>({r,why:'record'}));
  }

  ordered.forEach(({r,why},i)=>{ r.seed=i+1; r.seedWhy=why; r.inPlayoffs = i<n; });
}

/* ---------- sortable tables ---------- */

const STAND_SORTS = {
  rank:   { label:'#',        of:(r)=> r.rank ?? 99, dir:1 },
  name:   { label:'Team',     of:(r)=> r.name.toLowerCase(), dir:1, text:1 },
  record: { label:'Record',   of:(r)=> (r.effWins - r.effLosses)*1000 + (r.pointsFor ?? 0), dir:-1 },
  gb:     { label:'GB',       of:(r)=> r.gb, dir:1 },
  pf:     { label:'PF',       of:(r)=> r.pointsFor ?? -1, dir:-1 },
  pa:     { label:'PA',       of:(r)=> r.pointsAgainst ?? Infinity, dir:1 },
  week:   { label:'Week',     of:(r)=> r.wkPts ?? -1, dir:-1 },
  odds:   { label:'Odds',     of:(r)=> r.oddsPct ?? -1, dir:-1 },
  div:    { label:'Division', of:(r)=> String(r.division||'~'), dir:1, text:1 },
  waiver: { label:'Waiver',   of:(r)=> r.waiverPosition ?? 99, dir:1 },
};

function sortRows(rows, key, flip){
  const s = STAND_SORTS[key] || STAND_SORTS.rank;
  const d = (s.dir || 1) * (flip ? -1 : 1);
  return rows.slice().sort((a,b)=>{
    const x=s.of(a), y=s.of(b);
    // Equal values fall back to the standard order rather than to whatever the
    // roster list happened to be in.
    if(x===y) return byStandard(a,b);
    if(s.text) return String(x).localeCompare(String(y))*d;
    return (x<y? -1 : 1)*d;
  });
}

/** A header cell that sorts the table when clicked. */
function sortTh(col, active, flip, onSort){
  const th=el('th',(col.r?'r':'')+(col.sep?' tsep':'')+' sortable'+(col.key===active?' sorted':''));
  const w=el('span','sorth');
  w.append(document.createTextNode(col.label));
  if(col.key===active) w.append(el('span','arrow', flip? '▲' : '▼'));
  th.append(w);
  if(col.title) th.title=col.title;
  if(col.key){ th.onclick=()=>onSort(col.key); th.style.cursor='pointer'; }
  return th;
}

function sortableTable(cols, rows, {sortKey, flip, onSort}={}){
  const wrap=el('div','scroll');
  const t=el('table','fixed stand');
  const cg=el('colgroup');
  cols.forEach(c=>{ const co=el('col'); if(c.w) co.style.width=c.w+'px'; cg.append(co); });
  t.append(cg);
  const thead=el('thead'); const hr=el('tr');
  cols.forEach(c=> hr.append(sortTh(c, sortKey, flip, onSort)));
  thead.append(hr); t.append(thead);
  const tb=el('tbody'); rows.forEach(r=>tb.append(r)); t.append(tb);
  wrap.append(t); return wrap;
}

/** Fantasy-team crests: square, uncropped, never zoomed like a headshot. */
function teamAvatar(src){

  return box;
